name: Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "docker/hive/Dockerfile"
      - "docker/spark/Dockerfile"
      - "docker/jupyterhub/Dockerfile"
      - "docker/marimo/Dockerfile"
      - "docker/k8s-git-sync/Dockerfile"
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to build"
        required: true
        type: choice
        options:
          - hive
          - spark
          - jupyterhub
          - marimo
          - k8s-git-sync

jobs:
  # ────────────────────────────────────────────────
  # Detect which Dockerfiles changed (push only)
  # ────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Dockerfiles
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      hive: ${{ steps.filter.outputs.hive }}
      spark: ${{ steps.filter.outputs.spark }}
      jupyterhub: ${{ steps.filter.outputs.jupyterhub }}
      marimo: ${{ steps.filter.outputs.marimo }}
      k8s-git-sync: ${{ steps.filter.outputs.k8s-git-sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BEFORE=${{ github.event.before }}
          AFTER=${{ github.event.after }}
          # For new branches, compare against the default branch
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse origin/main)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "hive=$(echo "$CHANGED" | grep -qx 'docker/hive/Dockerfile' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "spark=$(echo "$CHANGED" | grep -qx 'docker/spark/Dockerfile' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "jupyterhub=$(echo "$CHANGED" | grep -qx 'docker/jupyterhub/Dockerfile' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "marimo=$(echo "$CHANGED" | grep -qx 'docker/marimo/Dockerfile' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "k8s-git-sync=$(echo "$CHANGED" | grep -qx 'docker/k8s-git-sync/Dockerfile' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$CHANGED"

  # ────────────────────────────────────────────────
  # Hive
  # ────────────────────────────────────────────────
  hive:
    name: Build Hive Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'hive') ||
      (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.hive == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Load Hive configuration
        id: hive-config
        run: |
          source docker/hive/.env.hive
          echo "HIVE_VERSION=${HIVE_VERSION}" >> $GITHUB_OUTPUT
          echo "HIVE_IMAGE_VERSION_TAG=${HIVE_IMAGE_VERSION_TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker/hive
          file: docker/hive/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: subhodeep2022/spark-bigdata:hive-${{ steps.hive-config.outputs.HIVE_VERSION }}-${{ steps.hive-config.outputs.HIVE_IMAGE_VERSION_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  # Spark
  # ────────────────────────────────────────────────
  spark:
    name: Build Spark Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'spark') ||
      (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.spark == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Load Spark configuration
        id: spark-config
        run: |
          source docker/spark/.env.spark
          echo "SPARK_VERSION=${SPARK_VERSION}" >> $GITHUB_OUTPUT
          echo "UNITY_CATALOG_VERSION=${UNITY_CATALOG_VERSION}" >> $GITHUB_OUTPUT
          echo "SPARK_IMAGE_VERSION=${SPARK_IMAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker/spark
          file: docker/spark/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: subhodeep2022/spark-bigdata:spark-${{ steps.spark-config.outputs.SPARK_VERSION }}-uc-${{ steps.spark-config.outputs.UNITY_CATALOG_VERSION }}-${{ steps.spark-config.outputs.SPARK_IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  # JupyterHub
  # ────────────────────────────────────────────────
  jupyterhub:
    name: Build JupyterHub Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'jupyterhub') ||
      (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.jupyterhub == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Load JupyterHub configuration
        id: jupyterhub-config
        run: |
          source docker/jupyterhub/.env.jupyterhub
          echo "JUPYTERHUB_VERSION_TAG=${JUPYTERHUB_VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "JUPYTERHUB_IMAGE_VERSION_TAG=${JUPYTERHUB_IMAGE_VERSION_TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker/jupyterhub
          file: docker/jupyterhub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: subhodeep2022/spark-bigdata:jupyterhub-${{ steps.jupyterhub-config.outputs.JUPYTERHUB_VERSION_TAG }}-pyspark-scala-sql-${{ steps.jupyterhub-config.outputs.JUPYTERHUB_IMAGE_VERSION_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  # Marimo
  # ────────────────────────────────────────────────
  marimo:
    name: Build Marimo Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'marimo') ||
      (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.marimo == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Load Marimo configuration
        id: marimo-config
        run: |
          source docker/marimo/.env.marimo
          echo "MARIMO_IMAGE_VERSION=${MARIMO_IMAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker/marimo
          file: docker/marimo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: subhodeep2022/spark-bigdata:marimo-${{ steps.marimo-config.outputs.MARIMO_IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  # k8s-git-sync
  # ────────────────────────────────────────────────
  k8s-git-sync:
    name: Build k8s-git-sync Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'k8s-git-sync') ||
      (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.k8s-git-sync == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Load k8s-git-sync configuration
        id: git-sync-config
        run: |
          source docker/k8s-git-sync/.env.k8s-git-sync
          echo "GIT_SYNC_IMAGE_VERSION=${GIT_SYNC_IMAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker/k8s-git-sync
          file: docker/k8s-git-sync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: subhodeep2022/k8s-git-sync:${{ steps.git-sync-config.outputs.GIT_SYNC_IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
