apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-secrets-extension
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-secrets-extension-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: spark-operator-spark  # This matches your values.yaml serviceAccounts.spark.name
  namespace: default
roleRef:
  kind: Role
  name: spark-secrets-extension
  apiGroup: rbac.authorization.k8s.io