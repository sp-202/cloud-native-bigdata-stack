apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana-ingress.yaml
  - admin-user.yaml
  - kong-manual-config.yaml
  - spark-ui-service.yaml
  - spark-service-monitor.yaml
  - headlamp.yaml

configMapGenerator:
  - name: spark-grafana-dashboard
    files:
      - dashboards/spark-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: loki-logs-dashboard
    files:
      - dashboards/loki-logs-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 56.6.2
    namespace: default
    releaseName: kube-prometheus-stack
    includeCRDs: true
    valuesFile: values-prometheus.yaml

  - name: loki-stack
    repo: https://grafana.github.io/helm-charts
    version: 2.10.2
    namespace: default
    releaseName: loki-stack
    valuesFile: values-loki.yaml
