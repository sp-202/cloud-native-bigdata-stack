apiVersion: v1
kind: Pod
metadata:
  name: pvc-debug
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: dags-volume
      mountPath: /mnt
  volumes:
  - name: dags-volume
    persistentVolumeClaim:
      claimName: airflow-dags-shared-pvc
