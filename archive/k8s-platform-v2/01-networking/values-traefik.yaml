ports:
  web:
    port: 80
  websecure:
    port: 443
  traefik:
    port: 9000
  metrics:
    port: 9101

global:
  checkNewVersion: false
  sendAnonymousUsage: false

additionalArguments:
  - "--api.insecure=true"
  - "--api.dashboard=true"

tolerations:
  - key: "node.cilium.io/agent-not-ready"
    operator: "Exists"
    effect: "NoSchedule"

# No hostNetwork needed — cloudflared tunnels external traffic to Traefik ClusterIP
service:
  type: ClusterIP

ingressRoute:
  dashboard:
    enabled: false

# Container security context — no hostNetwork so no need for root or NET_BIND_SERVICE
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod security context
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true

# Increase probe timeouts from default 2s to avoid false restarts under load
readinessProbe:
  timeoutSeconds: 10
livenessProbe:
  timeoutSeconds: 10
