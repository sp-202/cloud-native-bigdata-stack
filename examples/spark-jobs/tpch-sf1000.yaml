# TPC-H SF1000 benchmark (spark-operator SparkApplication) — runs all queries
# via DataFusion Comet native execution against real SF1000 parquet data in
# s3://tpc-419772658418. 14 executors (20 vCPU/170Gi) + driver (4 vCPU/20Gi)
# on 7x r7gd.12xlarge on-demand spark-nodes (ap-south-1).
#
# Run:    kubectl apply -f examples/spark-jobs/tpch-sf1000.yaml
# Watch:  kubectl get sparkapplication tpch-sf1000 -n default -w
# Logs:   kubectl logs -n default -l spark-app-name=tpch-sf1000,spark-role=driver -f
# Clean:  kubectl delete -f examples/spark-jobs/tpch-sf1000.yaml
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: tpch-sf1000
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "subhodeep2022/spark-bigdata:spark-3.5.8-v13-iceberg-gravitino"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "s3://tpc-419772658418/scripts/tpcbench.py"
  arguments:
    - "--benchmark"
    - "tpch"
    - "--data"
    - "s3://tpc-419772658418/tpch-sf1000"
    - "--queries"
    - "s3://tpc-419772658418/tpch-queries"
    - "--output"
    - "s3://tpc-419772658418/tpch-results"
    # - "--iterations"
    # - "2"
  sparkVersion: "3.5.8"
  restartPolicy:
    type: Never

  sparkUIOptions:
    serviceLabels:
      app: spark-ui
    servicePortName: spark-ui

  sparkConf:
    "spark.local.dir": "/mnt/spark-nvme/spark-local"
    "spark.kubernetes.executor.request.cores": "20"
    "spark.memory.fraction": "0.6"
    "spark.memory.storageFraction": "0.2"
    "spark.memory.offHeap.enabled": "true"
    "spark.memory.offHeap.size": "80g"

    "spark.scheduler.minRegisteredResourcesRatio": "1.0"
    "spark.scheduler.maxRegisteredResourcesWaitingTime": "600s"

    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.endpoint.region": "ap-south-1"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "true"
    "spark.hadoop.fs.s3a.fast.upload.buffer": "disk"
    "spark.hadoop.fs.s3a.buffer.dir": "/mnt/spark-nvme/s3a-buffer"
    "spark.hadoop.fs.s3a.multipart.size": "128M"
    "spark.hadoop.fs.s3a.multipart.threshold": "256M"
    "spark.hadoop.fs.s3a.threads.max": "50"
    "spark.hadoop.fs.s3a.connection.maximum": "200"
    "spark.hadoop.fs.s3a.multipart.purge": "true"
    "spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version": "2"

    "spark.comet.parquet.read.parallel.io.enabled": "true"
    "spark.comet.parquet.read.parallel.io.thread-pool.size": "12"
    "spark.comet.parquet.read.io.mergeRanges": "true"
    "spark.comet.parquet.read.io.mergeRanges.delta": "67108864"

    "spark.plugins": "org.apache.spark.CometPlugin"
    "spark.sql.extensions": "org.apache.comet.CometSparkSessionExtensions"
    "spark.shuffle.manager": "org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager"
    "spark.comet.enabled": "true"
    "spark.comet.exec.enabled": "true"
    "spark.comet.exec.all.enabled": "true"
    "spark.comet.exec.replaceSortMergeJoin": "true"
    "spark.comet.exec.hashJoin.enabled": "true"
    "spark.comet.exec.shuffle.enabled": "true"
    "spark.comet.exec.shuffle.mode": "auto"
    "spark.comet.exec.shuffle.directRead.enabled": "true"
    "spark.comet.exec.shuffle.convertFromSparkPlan.enabled": "true"
    "spark.comet.exec.shuffle.revertRedundantColumnar.enabled": "true"
    "spark.comet.exec.zeroCopySpill.enabled": "true"
    "spark.comet.exec.localTableScan.enabled": "true"
    "spark.comet.exec.localTopKPushdown.enabled": "true"
    "spark.comet.exec.rowComet.enabled": "true"
    "spark.comet.exec.columnarToRow.native.enabled": "true"
    "spark.comet.exec.memoryPool": "fair_unified"
    "spark.comet.exec.memoryPool.fraction": "1.0"
    "spark.comet.memoryPool.fraction": "0.8"
    "spark.comet.sparkToColumnar.enabled": "true"
    "spark.comet.sparkToColumnar.supportedOperatorList": "Range,InMemoryTableScan,RDDScan,OneRowRelation"
    "spark.comet.batchSize": "8192"
    "spark.comet.nativeLoadRequired": "true"
    "spark.comet.shuffle.preferDictionary.ratio": "10.0"
    "spark.comet.shuffle.sizeInBytesMultiplier": "1.0"
    "spark.comet.parquet.write.enabled": "true"
    "spark.comet.cache.serializer.enabled": "true"
    "spark.comet.expression.Cast.allowIncompatible": "true"
    "spark.comet.expression.JsonToStructs.allowIncompatible": "true"
    "spark.comet.operator.DataWritingCommandExec.allowIncompatible": "true"
    "spark.comet.exec.strictFloatingPoint": "false"
    "spark.comet.caseConversion.enabled": "false"
    "spark.comet.logFallbackReasons.enabled": "true"
    "spark.comet.explainFallback.enabled": "true"
    "spark.comet.scan.csv.v2.enabled": "true"
    "spark.comet.scan.json.v2.enabled": "true"
    "spark.comet.native.shuffle.partitioning.roundrobin.maxHashColumns": "0"
    "spark.comet.write.iceberg.splitOperator.enabled": "true"
    "spark.comet.write.iceberg.nativeAcceleration": "true"
    "spark.comet.exec.shuffle.compression.codec": "zstd"

    "spark.executorEnv.COMET_NATIVE_SCAN_CACHE_ENABLED": "false"
    "spark.comet.native.scan.cache.enabled": "false"

    # --- S3 range disk cache (raw object bytes on the instance NVMe) ---------------
    # Complements the in-memory scan cache above, which is off because it keys on
    # (file, projection, filters, limit) and caches decoded Arrow -- an SF1000 run
    # measured 66,021 lookups and zero hits, since no two scans agree on all four.
    # This caches raw bytes in fixed 8 MiB aligned blocks below Parquet decoding, so
    # q1 reading l_shipdate and q9 reading l_suppkey share every block their ranges
    # both touch.
    #
    # The directory sits inside the spark-shuffle hostPath, so it is on the r7gd's
    # local NVMe and is SHARED BY BOTH EXECUTORS ON A NODE. Two consequences:
    #   * cacheAffinity.level must be "host" (below), not "executor";
    #   * capacity is enforced per executor process, not per directory.
    # An executor accounts for what it adopted at startup plus what it wrote itself
    # and never learns about a sibling's later writes, so the directory can exceed
    # the value below -- measured at ~1.3x the N-executor sum on a 2-executor node.
    # 128 GiB x 2 executors x ~1.3 bounds a node near 333 GiB. r7gd.12xlarge ships
    # 2 x 1425 GB of NVMe, so that is comfortable even if only one device is mounted
    # at /mnt/spark-nvme, alongside spark-local, the s3a buffer and java.io.tmpdir.
    # (Worth checking which: `lsblk` on a spark-node. If both are RAID0'd there is
    # 2850 GB and this could go higher still.)
    #
    # Sizing sanity check: SF1000 is ~396 GB over 7 nodes, so with placement on each
    # node owns ~57 GB and each executor writes ~28 GB -- roughly 4.5x inside the cap,
    # so the steady state should never evict. WITH PLACEMENT OFF every node converges
    # on caching everything, 396 GB into ~333 GiB, so the baseline evicts mildly
    # rather than thrashing. That is the fairer comparison: both arms mostly fit, so
    # what is measured is placement rather than the difference between fitting and
    # not. Drop this to 64 GiB (68719476736) if you want the thrashing baseline too.
    #
    # Unset fs.s3a.comet.range.cache.dir to disable the feature entirely.
    # NOTE: the hostPath outlives the application, so blocks from a previous run are
    # adopted at startup. Wipe /mnt/spark-nvme/spark-shuffle/comet-range-cache on the
    # nodes first if you need a genuinely cold run.
    "spark.hadoop.fs.s3a.comet.range.cache.dir": "/mnt/spark-nvme/comet-range-cache-baseline-8mb"
    "spark.hadoop.fs.s3a.comet.range.cache.block.size": "8388608"
    "spark.hadoop.fs.s3a.comet.range.cache.capacity": "137438953472"
    # Lookups between progress lines on executor stderr: hits/misses, MiB from disk vs
    # origin, origin request count, and misses deduped by single-flight. Read misses
    # against requests -- misses are blocks that were absent, requests are the network
    # calls they cost. 0 disables reporting.
    "spark.executorEnv.COMET_RANGE_CACHE_REPORT_EVERY": "2048"

    # --- cache-aware scan placement -----------------------------------------------
    # Without this, scan tasks carry no locality at all: object stores report no block
    # locations (S3AFileSystem inherits the default getFileBlockLocations, which names
    # the host as literally "localhost"), so Spark places tasks wherever a slot frees
    # first and a file cached by q1 on one node is refetched by q9 on another. Files
    # are assigned a stable owner by rendezvous hashing and offered as a preference --
    # a task still runs elsewhere when the owner is busy, taking a cache miss, so a
    # stale assignment costs time and never correctness.
    #
    # "host" (NODE_LOCAL) because the cache directory is a shared hostPath: any
    # executor on the owning node can serve the block. "executor" (PROCESS_LOCAL)
    # would make Spark hold out for one specific JVM for no gain.
    "spark.comet.scan.cacheAffinity.enabled": "true"
    "spark.comet.scan.cacheAffinity.level": "host"

    "spark.comet.exec.replaceSortMergeJoin.leftSemi.enabled": "true"
    "spark.comet.operator.ProjectExec.allowIncompatible": "true"

    "spark.sql.adaptive.enabled": "true"
    "spark.sql.shuffle.partitions": "560"
    "spark.sql.adaptive.localShuffleReader.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"
    "spark.sql.files.maxPartitionBytes": "536870912"

    "spark.speculation": "true"
    "spark.speculation.quantile": "0.90"
    "spark.speculation.multiplier": "3.0"
    "spark.speculation.interval": "1000ms"

    "spark.ui.enabled": "true"
    "spark.ui.port": "4040"
    "spark.ui.host": "0.0.0.0"
    "spark.ui.retainedJobs": "200"
    "spark.ui.retainedStages": "200"
    "spark.ui.retainedTasks": "100000"
    "spark.ui.retainedDeadExecutors": "20"
    "spark.sql.ui.retainedExecutions": "200"

    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.driver.sink.prometheusServlet.path": "/metrics/driver/prometheus/"
    "spark.metrics.conf.executor.sink.prometheusServlet.path": "/metrics/executors/prometheus/"

    "spark.network.timeout": "2000s"
    "spark.executor.heartbeatInterval": "300s"
    "spark.files.fetchTimeout": "300s"
    "spark.kubernetes.submission.connectionTimeout": "120000"
    "spark.kubernetes.submission.requestTimeout": "120000"
    "spark.kubernetes.driver.connectionTimeout": "120000"
    "spark.kubernetes.driver.requestTimeout": "120000"
    "spark.kubernetes.executor.podNamePrefix": "tpch-sf1000"

    "spark.executor.decommission.enabled": "true"
    "spark.storage.decommission.enabled": "true"
    "spark.storage.decommission.shuffleBlocks.enabled": "true"
    "spark.storage.decommission.rddBlocks.enabled": "true"

    "spark.shuffle.file.buffer": "1m"
    "spark.reducer.maxSizeInFlight": "48m"
    "spark.reducer.maxReqsInFlight": "256"
    "spark.reducer.maxBlocksInFlightPerAddress": "128"

    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://tpc-419772658418/spark-event-logs"
    "spark.eventLog.compress": "true"
    "spark.eventLog.compression.codec": "zstd"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "64m"

    "spark.driver.extraJavaOptions": "-Djava.io.tmpdir=/mnt/spark-nvme -Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"
    "spark.executor.defaultJavaOptions": "-Djava.io.tmpdir=/mnt/spark-nvme -XX:+UseParallelGC -XX:InitiatingHeapOccupancyPercent=70 -Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"

  driver:
    cores: 4
    memory: "16g"
    memoryOverhead: "4g"
    serviceAccount: spark-operator-spark
    dnsConfig:
      options:
        - name: ndots
          value: "2"
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    nodeSelector:
      node-role.kubernetes.io/spark-node: ""
      karpenter.k8s.aws/instance-family: "r7gd"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.k8s.aws/instance-size
                  operator: In
                  values:
                    - "12xlarge"
                - key: karpenter.sh/capacity-type
                  operator: In
                  values:
                    - "on-demand"
    tolerations:
      - key: spark-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    volumeMounts:
      - name: spark-shuffle
        mountPath: /mnt/spark-nvme
      # Must mount at the exact path in spark.local.dir, or Spark's
      # LocalDirsFeatureStep sees no volume there and auto-creates a
      # shadowing emptyDir (on gp3 root) over this NVMe hostPath.
      - name: spark-local-dir-1
        mountPath: /mnt/spark-nvme/spark-local
      - name: log4j2-config
        mountPath: /opt/spark/log4j2-custom

  executor:
    cores: 20
    coreLimit: "20"
    instances: 14
    memory: "74g"
    memoryOverhead: "16g"
    # REQUIRED, and easy to miss: without this, executors run under the
    # namespace's `default` ServiceAccount, NOT the driver's. Only
    # spark-operator-spark carries the eks.amazonaws.com/role-arn
    # annotation, so `default` gets no IRSA token projected — and the
    # credential failure this fixes happened on EXECUTOR tasks
    # ("Executor task launch worker for task 199.0 in stage 72.0"), not the
    # driver. Setting it on the driver alone fixes nothing here.
    #
    # Nothing else is needed for IRSA: the EKS pod-identity webhook injects
    # AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE and the token file itself
    # off this annotation. Do NOT add spark.executorEnv.AWS_* by hand (the
    # token file is what matters, and only the webhook can create it), and
    # do NOT set spark.hadoop.fs.s3a.aws.credentials.provider — forcing a
    # provider class there already broke startup once.
    serviceAccount: spark-operator-spark
    dnsConfig:
      options:
        - name: ndots
          value: "2"
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    nodeSelector:
      node-role.kubernetes.io/spark-node: ""
      karpenter.k8s.aws/instance-family: "r7gd"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.k8s.aws/instance-size
                  operator: In
                  values:
                    - "12xlarge"
                - key: karpenter.sh/capacity-type
                  operator: In
                  values:
                    - "on-demand"
    tolerations:
      - key: spark-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    volumeMounts:
      - name: spark-shuffle
        mountPath: /mnt/spark-nvme
      - name: spark-local-dir-1
        mountPath: /mnt/spark-nvme/spark-local
      - name: log4j2-config
        mountPath: /opt/spark/log4j2-custom

  volumes:
    - name: spark-shuffle
      hostPath:
        path: /mnt/spark-nvme/spark-shuffle
        type: DirectoryOrCreate
    - name: spark-local-dir-1
      hostPath:
        path: /mnt/spark-nvme/spark-shuffle/spark-local
        type: DirectoryOrCreate
    - name: log4j2-config
      configMap:
        name: spark-log4j2-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-log4j2-config
  namespace: default
data:
  log4j2.properties: |
    #
    # Licensed to the Apache Software Foundation (ASF) under one or more
    # contributor license agreements.  See the NOTICE file distributed with
    # this work for additional information regarding copyright ownership.
    # The ASF licenses this file to You under the Apache License, Version 2.0
    # (the "License"); you may not use this file except in compliance with
    # the License.  You may obtain a copy of the License at
    #
    #    http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.
    #

    rootLogger.level = warn
    rootLogger.appenderRef.stdout.ref = console

    appender.console.type = Console
    appender.console.name = console
    appender.console.target = SYSTEM_ERR
    appender.console.layout.type = JsonLayout
    appender.console.layout.compact = true
    appender.console.layout.eventEol = true

    logger.repl.name = org.apache.spark.repl.Main
    logger.repl.level = warn

    logger.thriftserver.name = org.apache.spark.sql.hive.thriftserver.SparkSQLCLIDriver
    logger.thriftserver.level = warn

    logger.jetty1.name = org.sparkproject.jetty
    logger.jetty1.level = warn
    logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
    logger.jetty2.level = error
    logger.replexprTyper.name = org.apache.spark.repl.SparkIMain$exprTyper
    logger.replexprTyper.level = info
    logger.replSparkILoopInterpreter.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
    logger.replSparkILoopInterpreter.level = info
    logger.parquet1.name = org.apache.parquet
    logger.parquet1.level = error
    logger.parquet2.name = parquet
    logger.parquet2.level = error

    # rootLogger is warn, which would hide the one line that says whether cache
    # affinity actually engaged and how the partitions were spread across targets.
    # A spread piling most partitions onto one target is a failure mode that looks
    # identical to success from the config alone.
    logger.cometCacheAffinity.name = org.apache.spark.sql.comet.CometCacheAffinity
    logger.cometCacheAffinity.level = info

    logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
    logger.metastore.level = fatal
    logger.metastore2.name = org.apache.hadoop.hive.metastore.ObjectStore
    logger.metastore2.level = error
