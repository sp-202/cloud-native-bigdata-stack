# ------------------------------------------------------------------------------
# TPC-H SF100 Q1 (spark-operator/SparkApplication CRD) — real S3 data, not synthetic
# ------------------------------------------------------------------------------
# Runs the actual DataFusion Comet benchmark runner (s3://tpch-sf100-419772658418/
# scripts/tpcbench.py) against the real SF100 parquet dataset already in that
# bucket, --query 1 only (TPC-H Q1 — "pricing summary report", a single GROUP
# BY/aggregation over lineitem, the standard simplest TPC-H query).
#
# NOTE: the bucket has TPC-H data (tpch_sf100/, tpch-queries/) — there is no
# TPC-DS data in it at all, so this targets --benchmark tpch, not tpcds. If you
# actually need TPC-DS specifically, that dataset would need to be generated
# into this bucket (or a new one) first.
#
# terraform-aws-k8s-ha's storage-s3-tpch-benchmark.tf grants the node role
# read/write access to this bucket (source parquet data is read-only in
# practice, but the benchmark run also needs to WRITE its own results and
# event logs back into the same bucket) — that resource has been written
# but NOT applied yet, run `terraform apply
# -target=aws_iam_policy.tpch_sf100_s3
# -target=aws_iam_role_policy_attachment.node_tpch_sf100_s3` before
# submitting this, or the S3 calls will fail with AccessDenied. That
# bucket was created outside Terraform (by hand) and is not referenced by
# any other .tf resource, so `terraform destroy`/clean.sh can never touch it.
#
# Node sizing: 6 executors x (16 vCPU, 148Gi) + driver (5 vCPU, 26Gi) on
# r7gd.12xlarge, ~2 executors/node (3 nodes). A "1 executor per node, ~40
# vCPU" fat-executor redesign was drafted here and then deliberately
# walked back — NOT applied — once data-on-eks's own real, production
# Comet benchmark config surfaced (see the Apache DataFusion blog "What
# two months with the Comet community got our Spark workload on Amazon
# EKS", and data-on-eks's tpcds-benchmark-comet-parquet.yaml): AWS's own
# TPC-DS 3TB benchmark on the exact same r8gd.12xlarge instance runs THIN
# executors (cores=5, memory=20g, memoryOverhead=6g) at ~2/node — the
# opposite direction from fat-executor consolidation. Two concrete reasons
# that reference config wins over speculative fat-executor math: (1) their
# root cause for excess S3 connection/DNS volume was fixed in Comet's own
# code (#3802, object-store + bucket-region caching — confirmed already
# present in this fork's git log), not by shrinking executor count, so
# consolidating executors here would have been solving the same problem
# twice; (2) very large JVM heaps (150-300Gi+) carry their own GC-pause
# tax that can hurt tail latency worse than the network stalls being
# chased. Kept at the current 16-core/148Gi/2-per-node shape rather than
# resized to AWS's thinner 5-core pattern, since that's a real follow-up
# resizing decision, not yet made — this comment exists so the header
# never again silently drifts from what spec.executor below actually says.
#
# The underlying S3 stall issue this was all in service of: the same
# 55-63s Comet S3 stall signature (issues.md #38, later corrected by #39
# to ENA bandwidth allowance exhaustion, confirmed live for this exact job
# via bw_in/out_allowance_exceeded climbing into the millions while
# Cilium's NAT/CT maps sat idle) always clustered on the same subset of
# executors, consistent with those executors sharing one node's bandwidth
# cap — reducing executor density per node (the move already made, 4->2)
# is still a valid partial mitigation for that; going further to 1/node
# was the (unapplied) idea for removing that sharing entirely.
#
# Run:
#   kubectl apply -f examples/spark-jobs/tpch-sf100.yaml
#   kubectl get sparkapplication tpch-sf100-q1 -n default -w
#   kubectl get nodes -l node-role.kubernetes.io/spark-node -w
#   kubectl logs -n default -l spark-app-name=tpch-sf100-q1,spark-role=driver -f
#
# Clean up:
#   kubectl delete -f examples/spark-jobs/tpch-sf100.yaml
# ------------------------------------------------------------------------------
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: tpch-sf100
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "subhodeep2022/spark-bigdata:spark-3.5.8-v13-iceberg-gravitino"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "s3a://tpch-sf100-419772658418/scripts/tpcbench.py"
  arguments:
    - "--benchmark"
    - "tpch"
    - "--data"
    - "s3a://tpch-sf100-419772658418/tpch_sf100"
    - "--queries"
    - "s3a://tpch-sf100-419772658418/tpch-queries"
    - "--output"
    - "s3a://tpch-sf100-419772658418/tpch-results"
  sparkVersion: "3.5.8"
  restartPolicy:
    type: Never

  sparkConf:
    "spark.local.dir": "/mnt/spark-nvme/spark-local"
    "spark.kubernetes.executor.request.cores": "16"
    "spark.memory.fraction": "0.6"
    "spark.memory.storageFraction": "0.2"
    "spark.memory.offHeap.enabled": "true"
    "spark.memory.offHeap.size": "64g"

    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.endpoint.region": "us-east-1"
    # No explicit aws.credentials.provider override — this image's
    # hadoop-aws still expects the SDK v1 AWSCredentialsProvider interface
    # (confirmed live: pointing this at the SDK v2
    # software.amazon.awssdk.auth.credentials.ContainerCredentialsProvider
    # class failed startup with "does not implement AWSCredentialsProvider").
    # Hadoop's default provider chain already resolves container/pod
    # credentials on its own — this was the proven-working state before.
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "true"

    "spark.hadoop.fs.s3a.fast.upload.buffer": "disk"
    # kept on the NVMe mount (not the reference job's /data1/s3a) — this
    # pod's local scratch disk is /mnt/spark-nvme, see volumeMounts below.
    "spark.hadoop.fs.s3a.buffer.dir": "/mnt/spark-nvme/s3a-buffer"
    "spark.hadoop.fs.s3a.multipart.size": "128M"
    "spark.hadoop.fs.s3a.multipart.threshold": "256M"
    "spark.hadoop.fs.s3a.threads.max": "50"
    "spark.hadoop.fs.s3a.connection.maximum": "200"
    "spark.hadoop.fs.s3a.multipart.purge": "true"
    "spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version": "2"

    # ── Comet native parquet reader — S3 connection concurrency ──────────────
    # Comet's native reader bypasses hadoop-s3a entirely (its own Rust S3
    # client), so none of the fs.s3a.* settings above bound it. The knobs
    # that do (verified against the vendored fork's actual compiled-in
    # defaults in CometConf.scala, not assumed): parallel.io.enabled=true,
    # thread-pool.size=16 PER EXECUTOR (doc: "in a single executor"),
    # mergeRanges=true, mergeRanges.delta=8MB. All left unset here to take
    # those defaults as-is.
    #
    # This job is now 6 executors (down from 12, see the header's "Node
    # sizing" note): at the default thread-pool.size=16, peak concurrent
    # S3 GETs is 6*16=96 cluster-wide, and — more relevant than the
    # cluster-wide total — only 2 executors' worth (32) share any single
    # node's connection/bandwidth limit now, down from 4 executors' worth
    # (64) before. That's the actual lever the executor-count change
    # pulls; thread-pool.size itself is unchanged.
    # No evidence (GET-count/latency metrics from an actual run) yet that
    # the default 8MB mergeRanges.delta is too tight for this dataset —
    # revisit with real numbers before hand-tuning it further.

    # --- Comet native execution (full set, matching the proven reference job) ---
    "spark.plugins": "org.apache.spark.CometPlugin"
    "spark.sql.extensions": "org.apache.comet.CometSparkSessionExtensions"
    "spark.shuffle.manager": "org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager"
    "spark.comet.enabled": "true"
    "spark.comet.exec.enabled": "true"
    "spark.comet.exec.all.enabled": "true"
    "spark.comet.exec.replaceSortMergeJoin": "true"
    "spark.comet.exec.hashJoin.enabled": "true"
    "spark.comet.exec.shuffle.enabled": "true"
    "spark.comet.exec.shuffle.mode": "auto"
    "spark.comet.exec.shuffle.directRead.enabled": "true"
    "spark.comet.exec.shuffle.convertFromSparkPlan.enabled": "true"
    "spark.comet.exec.shuffle.revertRedundantColumnar.enabled": "true"
    "spark.comet.exec.zeroCopySpill.enabled": "true"
    "spark.comet.exec.localTableScan.enabled": "true"
    "spark.comet.exec.localTopKPushdown.enabled": "true"
    "spark.comet.exec.rowComet.enabled": "true"
    "spark.comet.exec.columnarToRow.native.enabled": "true"
    "spark.comet.exec.memoryPool": "fair_unified"
    "spark.comet.exec.memoryPool.fraction": "1.0"
    "spark.comet.memoryPool.fraction": "0.8"
    "spark.comet.sparkToColumnar.enabled": "true"
    "spark.comet.sparkToColumnar.supportedOperatorList": "Range,InMemoryTableScan,RDDScan,OneRowRelation"
    "spark.comet.batchSize": "8192"
    "spark.comet.nativeLoadRequired": "true"
    "spark.comet.shuffle.preferDictionary.ratio": "10.0"
    "spark.comet.shuffle.sizeInBytesMultiplier": "1.0"
    "spark.comet.parquet.write.enabled": "true"
    "spark.comet.cache.serializer.enabled": "true"
    "spark.comet.expression.Cast.allowIncompatible": "true"
    "spark.comet.expression.JsonToStructs.allowIncompatible": "true"
    "spark.comet.operator.DataWritingCommandExec.allowIncompatible": "true"
    "spark.comet.exec.strictFloatingPoint": "false"
    "spark.comet.caseConversion.enabled": "false"
    "spark.comet.logFallbackReasons.enabled": "true"
    "spark.comet.explainFallback.enabled": "true"
    "spark.comet.scan.csv.v2.enabled": "true"
    "spark.comet.scan.json.v2.enabled": "true"
    "spark.comet.native.shuffle.partitioning.roundrobin.maxHashColumns": "0"
    "spark.comet.write.iceberg.splitOperator.enabled": "true"
    "spark.comet.write.iceberg.nativeAcceleration": "true"

    # --- Native Scan Cache (CTE Cache) and Zero-Copy Spill Compression ---
    "spark.comet.exec.shuffle.compression.codec": "lz4"
    # "spark.comet.native.scan.cache.enabled": "true"
    # "spark.executorEnv.COMET_NATIVE_SCAN_CACHE_ENABLED": "true"

    # --- SQL / AQE ---
    # tpcbench.py runs the FULL 22-query TPC-H suite here (no --query arg
    # is passed below), not just Q1 despite the header comment above — so
    # this has to be tuned for the whole mix, not one query.
    #
    # Only the on/off switches were set before, which left two defaults
    # silently active:
    #   - spark.sql.shuffle.partitions defaults to 200, unrelated to this
    #     job's 96 task slots (6 executors x 16 cores).
    #   - spark.sql.adaptive.coalescePartitions.parallelismFirst defaults
    #     to true, which makes AQE IGNORE advisoryPartitionSizeInBytes
    #     entirely and only merge partitions under minPartitionSize (1MB
    #     default) to preserve parallelism. So coalescing was barely
    #     doing anything — that's why low-data queries still fan out
    #     into ~200 small partitions instead of a handful of big ones.
    #
    # Separately: several TPC-H queries end in a GROUP BY over a handful
    # of distinct values (Q1 by l_returnflag/l_linestatus = 4 groups,
    # Q5/Q8/Q10 by nation/region = tens of groups). That final shuffle
    # collapses onto a few hot reduce partitions no matter how this is
    # tuned, because skewJoin only rebalances joins, not aggregates —
    # expect a handful of idle executors on those stages; that's the
    # query shape, not a misconfiguration.
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.localShuffleReader.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    # "spark.sql.adaptive.coalescePartitions.parallelismFirst": "false"
    # Below this, a partition isn't worth its own task: S3 GET latency
    # and task-scheduling overhead dominate under ~32m anyway.
    # "spark.sql.adaptive.coalescePartitions.minPartitionSize": "32m"
    # Matches spark.sql.files.maxPartitionBytes' default (128m), so the
    # scan side and the shuffle side target the same partition size.
    "spark.sql.adaptive.advisoryPartitionSizeInBytes": "128m"
    # ~4x the 96 task slots: enough initial partitions for lineitem-scale
    # joins to land near the 128m target after coalescing, while AQE can
    # still merge hard down on the low-volume queries/stages.
    "spark.sql.shuffle.partitions": "384"
    "spark.sql.adaptive.skewJoin.enabled": "true"
    # skewJoin's factor/threshold (default 5x median / 256m) are left as
    # Spark defaults deliberately — raising advisoryPartitionSizeInBytes
    # already lifts the baseline partition size skew is measured against.
    # Only tighten these if the run logs actually show skewed-partition
    # warnings.

    # S3 reports no real block locality, so making Spark wait through
    # PROCESS_LOCAL/NODE_LOCAL/RACK_LOCAL levels (3s each by default)
    # before it'll schedule on an idle executor just stalls it for
    # nothing on this job — schedule immediately instead.
    # "spark.locality.wait": "0s"

    # --- UI ---
    "spark.ui.enabled": "true"
    "spark.ui.port": "4040"
    "spark.ui.host": "0.0.0.0"
    "spark.ui.retainedJobs": "200"
    "spark.ui.retainedStages": "200"
    "spark.ui.retainedTasks": "100000"
    "spark.ui.retainedDeadExecutors": "20"
    "spark.sql.ui.retainedExecutions": "200"

    # ── Prometheus metrics ──────────────────────────────────────────────────
    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.driver.sink.prometheusServlet.path": "/metrics/driver/prometheus/"
    "spark.metrics.conf.executor.sink.prometheusServlet.path": "/metrics/executors/prometheus/"

    # ── Stability ────────────────────────────────────────────────────────────
    "spark.network.timeout": "2000s"
    "spark.executor.heartbeatInterval": "300s"
    "spark.files.fetchTimeout": "300s"
    "spark.kubernetes.submission.connectionTimeout": "120000"
    "spark.kubernetes.submission.requestTimeout": "120000"
    "spark.kubernetes.driver.connectionTimeout": "120000"
    "spark.kubernetes.driver.requestTimeout": "120000"
    "spark.kubernetes.executor.podNamePrefix": "tpch-sf100-q1"

    # ── Graceful executor decommission ──────────────────────────────────────
    # do-not-disrupt (driver/executor annotations above) already blocks
    # Karpenter's own voluntary disruption (consolidation/drift/expiration)
    # for this job's pods — this is defense-in-depth for what that doesn't
    # cover: involuntary termination (node hardware failure, manual
    # intervention). Without it, a killed executor forces the shuffle/RDD
    # data it held to be recomputed from scratch; with it, that data
    # migrates to another live executor first. Zero cost when nothing
    # actually terminates early, matches data-on-eks's own Karpenter/Spark
    # best-practices guidance.
    "spark.executor.decommission.enabled": "true"
    "spark.storage.decommission.enabled": "true"
    "spark.storage.decommission.shuffleBlocks.enabled": "true"
    "spark.storage.decommission.rddBlocks.enabled": "true"

    # ── Shuffle tuning ───────────────────────────────────────────────────────
    "spark.shuffle.file.buffer": "1m"
    "spark.reducer.maxSizeInFlight": "48m"

    # ── Event logs ──────────────────────────────────────────────────────────
    # ${S3_BUCKET} was a real shell variable in the original bash
    # spark-submit script — nothing expands it inside a YAML manifest, so
    # it's the literal bucket name here instead.
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://tpch-sf100-419772658418/spark-event-logs"
    "spark.eventLog.compress": "true"
    "spark.eventLog.compression.codec": "zstd"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "64m"

    # ── GC / JVM options ─────────────────────────────────────────────────────
    # log4j2-custom ConfigMap is mounted at /opt/spark/log4j2-custom (see
    # volumeMounts/volumes below) — JSON console layout, tuned to quiet
    # Jetty/Parquet/Hive-metastore noise.
    "spark.driver.extraJavaOptions": "-Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"
    "spark.executor.defaultJavaOptions": "-verbose:gc -XX:+UseParallelGC -XX:InitiatingHeapOccupancyPercent=70 -Dlog4j.configurationFile=/opt/spark/log4j2-custom/log4j2.properties"

  driver:
    cores: 5
    memory: "20g"
    memoryOverhead: "6g"
    serviceAccount: spark-operator-spark
    # ndots:5 (k8s default) makes every non-cluster hostname (s3.us-east-1.
    # amazonaws.com, etc.) get tried against 4 search-domain suffixes before
    # the raw name, each a wasted DNS round trip — data-on-eks's own
    # networking best-practices doc calls this out specifically for the
    # S3/RDS-endpoint case. ndots:2 still resolves in-cluster service names
    # (namespace-local and cross-namespace) correctly, it just stops
    # appending suffixes to anything with 2+ dots already (which S3/AWS
    # endpoints always have) — pure latency/DNS-volume win, no downside for
    # what this job actually talks to.
    dnsConfig:
      options:
        - name: ndots
          value: "2"
    # Belt-and-suspenders on top of spark_nodepool's consolidationPolicy
    # (karpenter-k8s.tf, now WhenEmpty): do-not-disrupt is the blanket
    # Karpenter opt-out covering the mechanisms WhenEmpty doesn't —
    # drift (NodePool/EC2NodeClass spec changes) and expiration — not
    # just consolidation. Scoped to this job's own pods only, so it
    # doesn't stop Karpenter reclaiming this node once the job exits and
    # only DaemonSet pods are left on it.
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    nodeSelector:
      node-role.kubernetes.io/spark-node: ""
      karpenter.k8s.aws/instance-family: "r7gd"
    # nodeSelector only does exact single-value match, so allowing EITHER
    # 8xlarge or 12xlarge (not pinning to one) needs a real nodeAffinity
    # with the In operator instead. Pinning the family+size at all here is
    # deliberately for reproducible before/after benchmark comparisons —
    # letting Karpenter's bin-packing choose freely (the normal, better
    # default for a real job) means a timing delta between two runs could
    # just be Karpenter picking a different instance type, not the config
    # change actually being compared.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.k8s.aws/instance-size
                  operator: In
                  values:
                    - "12xlarge"
                # Spot capacity can be reclaimed by AWS with ~2min notice
                # at any time — exactly the instability that breaks a
                # benchmark run (executors dying mid-query, forcing
                # stage recomputation, isn't a config bug, it's spot
                # doing exactly what spot does). spark_nodepool's own
                # requirements allow both spot AND on-demand
                # (karpenter-k8s.tf), so this needs an explicit
                # constraint here to actually rule spot out for this job.
                - key: karpenter.sh/capacity-type
                  operator: In
                  values:
                    - "on-demand"
    tolerations:
      - key: spark-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    volumeMounts:
      - name: spark-shuffle
        mountPath: /mnt/spark-nvme
      - name: log4j2-config
        mountPath: /opt/spark/log4j2-custom

  executor:
    cores: 16
    coreLimit: "16"
    instances: 6
    memory: "64g"
    memoryOverhead: "20g"
    # Same ndots rationale as the driver above — executors are the ones
    # actually issuing the high-volume S3 lookups Comet's native reader
    # generates, so this matters more here than on the driver.
    dnsConfig:
      options:
        - name: ndots
          value: "2"
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    nodeSelector:
      node-role.kubernetes.io/spark-node: ""
      karpenter.k8s.aws/instance-family: "r7gd"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.k8s.aws/instance-size
                  operator: In
                  values:
                    - "12xlarge"
                - key: karpenter.sh/capacity-type
                  operator: In
                  values:
                    - "on-demand"

    tolerations:
      - key: spark-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    volumeMounts:
      - name: spark-shuffle
        mountPath: /mnt/spark-nvme
      - name: log4j2-config
        mountPath: /opt/spark/log4j2-custom

  volumes:
    - name: spark-shuffle
      hostPath:
        path: /mnt/spark-nvme/spark-shuffle
        type: DirectoryOrCreate
    - name: log4j2-config
      configMap:
        name: spark-log4j2-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-log4j2-config
  namespace: default
data:
  log4j2.properties: |
    #
    # Licensed to the Apache Software Foundation (ASF) under one or more
    # contributor license agreements.  See the NOTICE file distributed with
    # this work for additional information regarding copyright ownership.
    # The ASF licenses this file to You under the Apache License, Version 2.0
    # (the "License"); you may not use this file except in compliance with
    # the License.  You may obtain a copy of the License at
    #
    #    http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.
    #

    # Set everything to be logged to the console
    rootLogger.level = info
    rootLogger.appenderRef.stdout.ref = console

    # In the pattern layout configuration below, we specify an explicit `%ex` conversion
    # pattern for logging Throwables. If this was omitted, then (by default) Log4J would
    # implicitly add an `%xEx` conversion pattern which logs stacktraces with additional
    # class packaging information. That extra information can sometimes add a substantial
    # performance overhead, so we disable it in our default logging config.
    # For more information, see SPARK-39361.
    appender.console.type = Console
    appender.console.name = console
    appender.console.target = SYSTEM_ERR
    appender.console.layout.type = JsonLayout
    appender.console.layout.compact = true
    appender.console.layout.eventEol = true

    # Set the default spark-shell/spark-sql log level to WARN. When running the
    # spark-shell/spark-sql, the log level for these classes is used to overwrite
    # the root logger's log level, so that the user can have different defaults
    # for the shell and regular Spark apps.
    logger.repl.name = org.apache.spark.repl.Main
    logger.repl.level = warn

    logger.thriftserver.name = org.apache.spark.sql.hive.thriftserver.SparkSQLCLIDriver
    logger.thriftserver.level = warn

    # Settings to quiet third party logs that are too verbose
    logger.jetty1.name = org.sparkproject.jetty
    logger.jetty1.level = warn
    logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
    logger.jetty2.level = error
    logger.replexprTyper.name = org.apache.spark.repl.SparkIMain$exprTyper
    logger.replexprTyper.level = info
    logger.replSparkILoopInterpreter.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
    logger.replSparkILoopInterpreter.level = info
    logger.parquet1.name = org.apache.parquet
    logger.parquet1.level = error
    logger.parquet2.name = parquet
    logger.parquet2.level = error

    # SPARK-9183, SPARK-55237: Settings to avoid annoying messages when looking up nonexistent DBs/UDFs in spark-sql with Hive support
    logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
    logger.metastore.level = fatal
    logger.metastore2.name = org.apache.hadoop.hive.metastore.ObjectStore
    logger.metastore2.level = error
