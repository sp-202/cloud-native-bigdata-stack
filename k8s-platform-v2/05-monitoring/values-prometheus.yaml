grafana:
  adminPassword: prom-operator
  nodeSelector:
    node-role.kubernetes.io/k8s-gp-node: ""
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-stack.default.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
  grafana.ini:
    server:
      root_url: http://grafana.dailyblogstudio.com
      serve_from_sub_path: true

prometheus:
  prometheusSpec:
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 168h
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-hostpath
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
