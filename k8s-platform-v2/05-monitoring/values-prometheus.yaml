grafana:
  adminPassword: prom-operator
  nodeSelector:
    node-role.kubernetes.io/$(CONTROL_PLANE_NODE_ROLE): ""
  tolerations:
    - key: "node-role.kubernetes.io/$(CONTROL_PLANE_NODE_ROLE)"
      operator: "Exists"
      effect: "NoSchedule"
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-stack.default.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
  grafana.ini:
    server:
      root_url: http://grafana.$(INGRESS_DOMAIN)
      serve_from_sub_path: true

prometheus:
  prometheusSpec:
    nodeSelector:
      node-role.kubernetes.io/$(CONTROL_PLANE_NODE_ROLE): ""
    tolerations:
      - key: "node-role.kubernetes.io/$(CONTROL_PLANE_NODE_ROLE)"
        operator: "Exists"
        effect: "NoSchedule"
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: $(PROMETHEUS_RETENTION)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-hostpath
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: $(PROMETHEUS_STORAGE)
