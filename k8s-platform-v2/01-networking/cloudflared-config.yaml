apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: $(CF_TUNNEL_ID)
    credentials-file: /etc/cloudflared/creds/credentials.json
    protocol: http2
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: airflow.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: minio.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: s3.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: superset.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: jupyterhub.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: spark.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: grafana.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: headlamp.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: traefik.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: hubble.$(CF_DOMAIN)
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: dashboard.$(CF_DOMAIN)
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      # Catch-all rule (required by cloudflared)
      - service: http_status:404
