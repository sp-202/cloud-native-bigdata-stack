ports:
  web:
    port: 80
  websecure:
    port: 443
  traefik:
    port: 9000
  metrics:
    port: 9101

global:
  checkNewVersion: false
  sendAnonymousUsage: false

additionalArguments:
  - "--api.insecure=true"
  - "--api.dashboard=true"

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node.cilium.io/agent-not-ready"
    operator: "Exists"
    effect: "NoSchedule"

hostNetwork: true

service:
  type: ClusterIP

ingressRoute:
  dashboard:
    enabled: false

# Container security context - must allow binding to ports 80/443
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: true
  capabilities:
    add:
      - NET_BIND_SERVICE
    drop: []

# Pod security context
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
