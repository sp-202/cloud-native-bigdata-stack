# =============================================================================
# WORKLOAD: PostgreSQL
# DESCRIPTION: Manually binds a local directory to a PV for database persistence.
# NOTE: Ensure '/var/openebs/local/postgres-data' exists on 'k8s-gp-node'.
# =============================================================================

apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: openebs-hostpath
  volumeMode: Filesystem
  local:
    path: /var/openebs/local/postgres-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/k8s-gp-node
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 10Gi
  volumeName: postgres-data-pv

