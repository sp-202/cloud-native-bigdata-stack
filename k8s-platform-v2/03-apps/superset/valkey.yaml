# Redis for Superset (cache, Celery broker, SQL Lab results). The operator does not bundle one.
# Cache-only data, so no PVC (same as the previous Helm-chart Redis).
# Password comes from secret "valkey-connection" (key: password), created by deploy-superset.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-valkey
  namespace: superset
  labels:
    app: superset-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: superset-valkey
  template:
    metadata:
      labels:
        app: superset-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-connection
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: superset-valkey
  namespace: superset
spec:
  selector:
    app: superset-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
