apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  namespace: default
  labels:
    app: jupyterhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterhub
  template:
    metadata:
      labels:
        app: jupyterhub
    spec:
      nodeSelector:
        node-role.kubernetes.io/k8s-gp-node: ""
      serviceAccountName: jupyterhub
      initContainers:
        - name: wait-for-minio
          image: curlimages/curl:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              until curl -sf http://minio.default.svc.cluster.local:9000/minio/health/live; do
                echo "MinIO not ready, retrying in 3s..."
                sleep 3
              done
              echo "MinIO is ready"

      containers:
        - name: jupyterhub
          image: subhodeep2022/spark-bigdata:jupyterhub-4.0.7-pyspark-scala-sql-prod-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: web
          env:
            - name: SPARK_REMOTE
              value: "sc://spark-connect-server-driver-svc:15002"
            - name: PYSPARK_PYTHON
              value: "python3"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: AWS_SECRET_ACCESS_KEY
            - name: JUPYTER_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MINIO_ENDPOINT
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MINIO_ENDPOINT
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: JUPYTER_TOKEN
              value: ""
            - name: GRANT_SUDO
              value: "yes"

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4

          volumeMounts:
            - name: jupyter-config
              mountPath: /etc/jupyter/jupyter_notebook_config.py
              subPath: jupyter_notebook_config.py
            - name: notebooks
              mountPath: /home/jovyan/work
            - name: startup-script
              mountPath: /usr/local/bin/before-notebook.d/setup-kernels.sh
              subPath: setup-kernels.sh

      volumes:
        - name: jupyter-config
          configMap:
            name: jupyterhub-config
        - name: notebooks
          emptyDir: {}
        - name: startup-script
          configMap:
            name: jupyterhub-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub
  namespace: default
spec:
  selector:
    app: jupyterhub
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
      name: web
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jupyterhub-spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: jupyterhub
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-config
  namespace: default
data:
  jupyter_notebook_config.py: |
    c = get_config()
    c.ServerApp.ip = '0.0.0.0'
    c.ServerApp.allow_remote_access = True
    c.IdentityProvider.token = ''

    # Notebook Persistence with MinIO using s3contents
    import os
    from s3contents import S3ContentsManager

    c.ServerApp.contents_manager_class = S3ContentsManager
    c.S3ContentsManager.access_key_id = os.environ.get('AWS_ACCESS_KEY_ID')
    c.S3ContentsManager.secret_access_key = os.environ.get('AWS_SECRET_ACCESS_KEY')
    c.S3ContentsManager.endpoint_url = os.environ.get('JUPYTER_S3_ENDPOINT')
    c.S3ContentsManager.bucket = "notebooks"
    c.S3ContentsManager.prefix = "jupyterhub"

    c.S3ContentsManager.s3fs_additional_kwargs = {
        "client_kwargs": {
            "endpoint_url": os.environ.get('JUPYTER_S3_ENDPOINT'),
            "verify": False,
            "use_ssl": False,
        }
    }

  setup-kernels.sh: |
    #!/bin/bash
    set -e

    echo "=== Spark Connect Thin Client Setup ==="
    echo "Spark Remote: ${SPARK_REMOTE}"

    mkdir -p /home/jovyan/.local/share/jupyter/kernels/pyspark_connect
    cat > /home/jovyan/.local/share/jupyter/kernels/pyspark_connect/kernel.json << 'KERNEL_EOF'
    {
      "argv": ["python", "-m", "ipykernel_launcher", "-f", "{connection_file}"],
      "display_name": "PySpark (Connect)",
      "language": "python",
      "env": {
        "PYSPARK_PYTHON": "python3",
        "SPARK_REMOTE": "${SPARK_REMOTE}",
        "MINIO_ENDPOINT": "${MINIO_ENDPOINT}",
        "AWS_ACCESS_KEY_ID": "${AWS_ACCESS_KEY_ID}",
        "AWS_SECRET_ACCESS_KEY": "${AWS_SECRET_ACCESS_KEY}"
      }
    }
    KERNEL_EOF

    mkdir -p /home/jovyan/.ipython/profile_default/startup/
    cat > /home/jovyan/.ipython/profile_default/startup/00-pyspark-setup.py << 'STARTUP_EOF'
    import os

    spark_remote = os.environ.get('SPARK_REMOTE')

    if spark_remote:
        try:
            from pyspark.sql import SparkSession
            spark = SparkSession.builder.remote(spark_remote).getOrCreate()
            import builtins
            builtins.spark = spark
            print(f"✅ Connected to Spark {spark.version} via Spark Connect")
            print(f"   Remote: {spark_remote}")
        except Exception as e:
            print(f"⚠️ Spark Connect initialization failed: {e}")
            print(f"   Ensure Spark Connect Server is running at {spark_remote}")
    else:
        print("⚠️ SPARK_REMOTE not set. Spark session not initialized.")
    STARTUP_EOF

    echo "=== Spark Connect configuration complete ==="
