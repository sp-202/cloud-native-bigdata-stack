apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: default
spec:
  replicas: $(SPARK_HISTORY_REPLICAS)
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      # --- Pinning to Spark Node ---
      nodeSelector:
        node-role.kubernetes.io/$(SPARK_NODE_ROLE): ""
      containers:
        - name: spark-history-server
          image: $(SPARK_IMAGE)
          command:
            [
              "/opt/spark/bin/spark-class",
              "org.apache.spark.deploy.history.HistoryServer",
            ]
          resources:
            requests:
              cpu: "$(SPARK_HISTORY_CPU_REQUEST)"
              memory: "$(SPARK_HISTORY_MEM_REQUEST)"
            limits:
              cpu: "$(SPARK_HISTORY_CPU_LIMIT)"
              memory: "$(SPARK_HISTORY_MEM_LIMIT)"
          env:
            - name: SPARK_DAEMON_MEMORY
              value: "1g"
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=s3a://spark-logs/
                -Dspark.hadoop.fs.s3a.endpoint=http://minio.default.svc.cluster.local:9000
                -Dspark.hadoop.fs.s3a.access.key=minioadmin
                -Dspark.hadoop.fs.s3a.secret.key=minioadmin
                -Dspark.hadoop.fs.s3a.path.style.access=true
                -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
                -Dspark.history.fs.subpath.enabled=true
                -Dspark.history.fs.cleaner.enabled=false
                -Dspark.history.retainedApplications=500
                -Dspark.history.fs.update.interval=10s
          ports:
            - containerPort: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 18080
      targetPort: 18080
      protocol: TCP
      name: http
  selector:
    app: spark-history-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-history-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: spark-history.$(INGRESS_DOMAIN)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark-history-server
                port:
                  number: 18080
