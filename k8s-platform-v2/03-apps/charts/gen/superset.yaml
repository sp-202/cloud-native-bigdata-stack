kind: Job
metadata:
  name: superset-init-db
  namespace: default
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    metadata:
      name: superset-init-db
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s
        envFrom:
        - secretRef:
            name: 'superset-env'
        image: 'apache/superset:dockerize'
        imagePullPolicy: 'IfNotPresent'
        name: wait-for-postgres
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi
      containers:
      - name: superset-init-db
        image: "apachesuperset.docker.scarf.sh/apache/superset:3.1.0"
        env:
          - name: "GUNICORN_KEEPALIVE"
            value: "2"
          - name: "GUNICORN_TIMEOUT"
            value: "300"
          - name: "SERVER_THREADS_AMOUNT"
            value: "20"
          - name: "SERVER_WORKER_AMOUNT"
            value: "4"
        envFrom:
          - secretRef:
              name: superset-env
        imagePullPolicy: IfNotPresent
        securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
        volumeMounts:
          - name: superset-config
            mountPath: "/app/pythonpath"
            readOnly: true
        command: ["/bin/sh","-c",". /app/pythonpath/superset_bootstrap.sh; . /app/pythonpath/superset_init.sh"]
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
      nodeSelector:
        node-role.kubernetes.io/k8s-gp-node: ""
      volumes:
        - name: superset-config
          secret:
            secretName: superset-config
      restartPolicy: Never
