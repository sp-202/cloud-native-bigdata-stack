apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - airflow.yaml
  - hive.yaml
  - jupyterhub.yaml
  - airflow-git-sync.yaml
  - airflow-spark-rbac.yaml
  - airflow-rbac.yaml

  - spark-history-server.yaml

  - spark-ui-service.yaml
  - spark-connect-server.yaml
  # StarRocks is deployed by Helm + operator (deploy-starrocks.sh)
  # Generated Helm Charts
  - charts/gen/spark-operator.yaml
  # Superset is deployed by the Superset operator (deploy-superset.sh)

configMapGenerator:
  - name: spark-config
    files:
      - configs/spark-defaults.conf
  - name: hive-config
    files:
      - configs/hive-site.xml



