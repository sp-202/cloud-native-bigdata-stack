apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-monitor-role
  namespace: default # The namespace where your Spark jobs run
rules:
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "sparkapplications/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-monitor-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: airflow-worker # Name of your Airflow worker ServiceAccount
    namespace: airflow   # Namespace where Airflow is installed
roleRef:
  kind: Role
  name: airflow-spark-monitor-role
  apiGroup: rbac.authorization.k8s.io