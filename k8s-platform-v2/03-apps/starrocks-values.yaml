# StarRocks via the official operator chart (kube-starrocks)
#   helm repo add starrocks https://starrocks.github.io/starrocks-kubernetes-operator
#   helm upgrade --install starrocks starrocks/kube-starrocks --version 1.11.8 \
#     -n starrocks --create-namespace -f k8s-platform-v2/03-apps/starrocks-values.yaml
#
# Single node (16 CPU / 31Gi) shared with Spark, Superset, Airflow, MinIO, etc.,
# so resources are sized well below the chart defaults (4 CPU / 4Gi requests each).

operator:
  starrocksOperator:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 800Mi

starrocks:
  timeZone: Etc/UTC

  # root password comes from secret "starrocks-root-password" (key: password), created before install.
  # Per chart docs: keep this block unchanged on every later helm upgrade.
  initPassword:
    enabled: true
    passwordSecret: starrocks-root-password

  starrocksFESpec:
    replicas: 1
    image:
      repository: starrocks/fe-ubuntu
      tag: 4.1.3
    # Same external ports as the legacy setup (MySQL clients / DBeaver use 30930)
    service:
      type: NodePort
      ports:
        - containerPort: 9030
          nodePort: 30930
        - containerPort: 8030
          nodePort: 30830
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    # storageSpec.name must be set, otherwise the operator uses emptyDir (metadata lost on restart)
    storageSpec:
      name: fe
      storageClassName: local-path
      storageSize: 10Gi
      logStorageSize: 5Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    config: |
      LOG_DIR = ${STARROCKS_HOME}/log
      DATE = "$(date +%Y%m%d-%H%M%S)"
      JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx2048m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
      http_port = 8030
      rpc_port = 9020
      query_port = 9030
      edit_log_port = 9010
      mysql_service_nio_enabled = true
      sys_log_level = INFO
      min_graceful_exit_time_second = 25
      # single BE: internal tables cannot have 3 replicas
      default_replication_num = 1

  starrocksBeSpec:
    replicas: 1
    image:
      repository: starrocks/be-ubuntu
      tag: 4.1.3
    resources:
      requests:
        cpu: 1
        memory: 3Gi
      limits:
        cpu: 4
        memory: 6Gi
    storageSpec:
      name: be
      storageClassName: local-path
      storageSize: 50Gi
      logStorageSize: 10Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    config: |
      be_port = 9060
      webserver_port = 8040
      heartbeat_service_port = 9050
      brpc_port = 8060
      sys_log_level = INFO
      default_rowset_type = beta
