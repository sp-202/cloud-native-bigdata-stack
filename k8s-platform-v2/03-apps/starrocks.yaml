apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-fe-core-site
  namespace: default
data:
  core-site.xml: |
    <configuration>
      <!-- s3a:// scheme -->
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://minio.default.svc.cluster.local:9000</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3a.attempts.maximum</name>
        <value>3</value>
      </property>
      <property>
        <name>fs.s3a.aws.credentials.provider</name>
        <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
      </property>
      <!-- s3:// scheme — route through S3AFileSystem with same settings -->
      <property>
        <name>fs.s3.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3.endpoint</name>
        <value>http://minio.default.svc.cluster.local:9000</value>
      </property>
      <property>
        <name>fs.s3.access.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3.secret.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3.aws.credentials.provider</name>
        <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
      </property>
    </configuration>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starrocks-fe
  namespace: default
  labels:
    app: starrocks-fe
spec:
  serviceName: starrocks-fe
  replicas: 1
  selector:
    matchLabels:
      app: starrocks-fe
  template:
    metadata:
      labels:
        app: starrocks-fe
    spec:
      containers:
        - name: starrocks-fe
          image: starrocks/fe-ubuntu:3.3-latest
          ports:
            - containerPort: 8030
              name: http
            - containerPort: 9030
              name: query
            - containerPort: 9020
              name: rpc
            - containerPort: 9010
              name: edit-log
          env:
            - name: JAVA_OPTS
              value: "-Xmx1024m -XX:+UseG1GC"
          volumeMounts:
            - name: fe-meta
              mountPath: /data/meta
            - name: core-site
              mountPath: /opt/starrocks/fe/conf/core-site.xml
              subPath: core-site.xml
          command: ["/bin/bash", "-c"]
          args:
            - |
              /opt/starrocks/fe/bin/start_fe.sh --daemon
              echo "Waiting for FE to start..."

              # Wait for port 9030 to be ready
              for i in {1..30}; do
                  if mysql -h 127.0.0.1 -P 9030 -u root -e "SELECT 1" >/dev/null 2>&1; then
                      echo "FE is ready!"
                      break
                  fi
                  echo "Waiting for FE port 9030... ($i/30)"
                  sleep 5
              done

              echo "FE is ready! Creating 'demo' database..."
              # Create DB immediately after FE is ready
              mysql -h 127.0.0.1 -P 9030 -u root -e "CREATE DATABASE IF NOT EXISTS demo;" || echo "Failed to create demo DB"
              
              echo "Starting BE Registration..."
              for i in {1..60}; do
                  echo "Attempt $i: Resolving BE (starrocks-be-0)..."
                  # Use stable StatefulSet DNS for reliable resolution
                  BE_HOST="starrocks-be-0.starrocks-be.default.svc.cluster.local"
                  BE_IP=$(getent hosts $BE_HOST | awk '{print $1}')
                  
                  if [ -n "$BE_IP" ]; then
                      echo "Resolved BE IP: $BE_IP"
                      echo "Registering BE..."
                      mysql -h 127.0.0.1 -P 9030 -u root -e "ALTER SYSTEM ADD BACKEND '${BE_IP}:9050';" || true
                      
                      # Create HMS Delta Catalog (Native Delta Lake)
                      echo "Creating 'hms_delta_catalog'..."
                      mysql -h 127.0.0.1 -P 9030 -u root -e "
                      CREATE EXTERNAL CATALOG IF NOT EXISTS hms_delta_catalog
                      PROPERTIES (
                          'type' = 'delta_lake',
                          'hive.metastore.type' = 'hive',
                          'hive.metastore.uris' = 'thrift://hive-metastore:9083',
                          'aws.s3.enable_ssl' = 'false',
                          'aws.s3.enable_path_style_access' = 'true',
                          'aws.s3.endpoint' = 'http://minio.default.svc.cluster.local:9000',
                          'aws.s3.access_key' = 'minioadmin',
                          'aws.s3.secret_key' = 'minioadmin'
                      );" || true
                      
                      echo "Initialization Complete."
                      mysql -h 127.0.0.1 -P 9030 -u root -e "SHOW PROC '/backends'; SHOW DATABASES;"
                      break
                  else
                      echo "DNS resolution failed for $BE_HOST. Retrying in 5s..."
                  fi
                  sleep 5
              done

              sleep infinity
          livenessProbe:
            tcpSocket:
              port: 9030
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                [
                  "/bin/bash",
                  "-c",
                  "mysql -h 127.0.0.1 -P 9030 -u root -e 'SELECT 1'",
                ]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: core-site
          configMap:
            name: starrocks-fe-core-site
  volumeClaimTemplates:
    - metadata:
        name: fe-meta
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-fe
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8030
      targetPort: 8030
      name: http
    - port: 9030
      targetPort: 9030
      name: query
    - port: 9020
      targetPort: 9020
      name: rpc
  selector:
    app: starrocks-fe
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starrocks-be
  namespace: default
  labels:
    app: starrocks-be
spec:
  serviceName: starrocks-be
  replicas: 1
  selector:
    matchLabels:
      app: starrocks-be
  template:
    metadata:
      labels:
        app: starrocks-be
    spec:
      containers:
        - name: starrocks-be
          image: starrocks/be-ubuntu:3.3-latest
          ports:
            - containerPort: 9060
              name: be-port
            - containerPort: 8040
              name: web-server
            - containerPort: 9050
              name: heart-beat
            - containerPort: 8060
              name: brpc
          env:
            - name: FE_SERVERS
              value: "starrocks-fe:9010"
            - name: BE_ADDR
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: be-storage
              mountPath: /data/storage
          command: ["/bin/bash", "-c"]
          args: ["/opt/starrocks/be/bin/start_be.sh --daemon && sleep infinity"]
          livenessProbe:
            tcpSocket:
              port: 9050
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 9050
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: be-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-be
  namespace: default
spec:
  clusterIP: None
  ports:
    - port: 9060
      name: be-port
    - port: 9050
      name: heart-beat
  selector:
    app: starrocks-be
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-fe-nodeport
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 9030
      targetPort: 9030
      nodePort: 30930
      name: mysql-query
    - port: 8030
      targetPort: 8030
      nodePort: 30830
      name: http-ui
  selector:
    app: starrocks-fe
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starrocks-fe-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: starrocks.172.30.1.145.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starrocks-fe
                port:
                  number: 8030
