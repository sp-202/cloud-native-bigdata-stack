apiVersion: batch/v1
kind: Job
metadata:
  name: fix-node-storage
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: fix
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /host/mnt/spark-nvme/starrocks-fe
              mkdir -p /host/mnt/spark-nvme/starrocks-be
              mkdir -p /host/mnt/spark-nvme/minio
              chmod -R 777 /host/mnt/spark-nvme
              echo "Storage paths fixed on node"
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
      restartPolicy: Never
      hostPID: true
      hostNetwork: true
  parallelism: 5
  completions: 5
