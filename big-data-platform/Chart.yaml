apiVersion: v2
name: big-data-platform
description: >-
  Data Platform as Code (DPaC) — Helm Umbrella Chart for a full big-data
  stack on an on-prem RKE2 cluster (x86_64). Includes Spark, Gravitino, Airflow,
  StarRocks, JupyterHub, SeaweedFS-backed S3, PostgreSQL, and Redis.
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: cloudnative-pg
    version: "0.29.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: cloudnative-pg.enabled

  - name: cert-manager
    version: "v1.16.2"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled

  - name: spark-operator
    version: "2.4.0"
    repository: "https://kubeflow.github.io/spark-operator"
    condition: spark-operator.enabled

  # superset (apache/superset 0.12.0) is not a dependency on this branch — kept
  # off; re-add this entry and set superset.enabled + ingress.superset.enabled
  # to bring it back (values.yaml `superset:` block is kept for that).

  - name: kube-starrocks
    alias: starrocks
    version: "1.9.8"
    repository: "https://starrocks.github.io/starrocks-kubernetes-operator"
    condition: starrocks.enabled

  - name: airflow
    version: "1.21.0"
    repository: "https://airflow.apache.org"
    condition: airflow.enabled

  - name: kube-prometheus-stack
    version: "56.6.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled

  - name: loki-stack
    version: "2.10.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki-stack.enabled

  # Single node agent: pod logs, journal and Spark node files -> Loki; OTLP
  # (any OpenTelemetry source) and its own delivery metrics -> Prometheus. Replaces loki-stack's promtail.
  # Pipeline config: charts/monitoring/files/config.alloy.
  - name: alloy
    version: "1.13.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: alloy.enabled

  - name: monitoring
    version: "1.0.5"
    repository: "file://./charts/monitoring"
    condition: monitoring.enabled

  - name: thanos
    version: "1.0.4"
    repository: "file://./charts/thanos"
    condition: thanos.enabled

  - name: networking-extras
    version: "1.0.0"
    repository: "file://./charts/networking-extras"
    condition: networking-extras.enabled

  - name: persistence
    version: "1.0.0"
    repository: "file://./charts/persistence"
    condition: persistence.enabled

  - name: postgres
    version: "1.0.0"
    repository: "file://./charts/postgres"
    condition: postgres.enabled

  - name: redis
    version: "1.0.0"
    repository: "file://./charts/redis"
    condition: redis.enabled

  - name: gravitino-helm
    alias: gravitino
    version: "1.3.11"
    repository: "oci://registry-1.docker.io/apache"
    condition: gravitino.enabled

  - name: spark-history-server
    version: "1.0.0"
    repository: "file://./charts/spark-history-server"
    condition: spark-history-server.enabled

  - name: spark-connect-server
    version: "1.0.0"
    repository: "file://./charts/spark-connect-server"
    condition: spark-connect-server.enabled

  - name: jupyterhub
    version: "1.0.0"
    repository: "file://./charts/jupyterhub"
    condition: jupyterhub.enabled

  - name: ingress
    version: "1.0.0"
    repository: "file://./charts/ingress"
    condition: ingress.enabled

  # Kafka for the IIoT stream (KRaft). Operator only — the Kafka/KafkaNodePool/
  # KafkaTopic resources are in charts/iiot. CRDs: rke2/scripts/apply-crds.sh.
  - name: strimzi-kafka-operator
    version: "0.48.0"
    repository: "oci://quay.io/strimzi-helm"
    condition: strimzi-kafka-operator.enabled

  - name: iiot
    version: "1.0.0"
    repository: "file://./charts/iiot"
    condition: iiot.enabled
