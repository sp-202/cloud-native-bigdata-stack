# =============================================================================
# big-data-platform — Root values.yaml
# Data Platform as Code (DPaC) on AWS EC2 (ARM64/Graviton)
#
# This single file centralizes 60+ variables that were previously scattered
# across global-config.env and hardcoded in static manifests.
# =============================================================================

# --- Override Helpers ---
nameOverride: ""
fullnameOverride: ""

# The postgres Cluster/Database CRs (charts/postgres, sync-wave -2) need the
# CNPG operator actually running to reconcile them — a CR with no controller
# watching it just sits inert. The cloudnative-pg subchart has no sync-wave
# of its own (defaults to 0, same wave as most other resources), so without
# this it doesn't exist yet when the Cluster/Database CRs are created, and
# the wave -1 hook Jobs (airflow-db-migrate, gravitino-schema-init) that
# need a live Postgres connection retry forever. commonAnnotations pushes
# every resource this subchart creates to the same early wave as
# namespaces.yaml (-3), well before the -2 CRs that depend on it.
cloudnative-pg:
  enabled: true
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-3"

# --- Namespace Toggles ---
namespaces:
  createDashboard: true

# =============================================================================
# GLOBAL — shared across ALL sub-charts via .Values.global.*
# =============================================================================
global:
  # --- Platform Routing & Domain ---
  domain: "dailyblogstudio.com"
  cfTunnelId: "91e5be1d-3b51-4cac-aebf-d330aafda394"

  # --- Container Images ---
  sparkImage: "subhodeep2022/spark-bigdata:spark-3.5.8-v13-iceberg-gravitino"
  jupyterhubImage: "subhodeep2022/spark-bigdata:jupyterhub-4.0.7-pyspark-scala-sql-prod-v3"
  airflowImage: "apache/airflow:3.2.0"
  gitSyncImage: "subhodeep2022/k8s-git-sync:v2-prod"

  # --- S3 ---
  # No endpoint/accessKey/secretKey — real S3's default endpoint applies, and
  # every workload gets credentials from the node's IAM role instead of
  # static keys. pathStyleAccess/sslEnabled still apply to real S3 (virtual-
  # hosted-style + TLS, the opposite of MinIO's old defaults).
  s3:
    pathStyleAccess: false
    sslEnabled: true

  # --- Node Selectors ---
  # Labels are applied by the node-auto-labeler DaemonSet in the bootstrap script.
  # The auto-labeler reads the `node-role` K8s label set by Terraform on each node
  # and creates node-role.kubernetes.io/<role>=  e.g. spark-node → node-role.kubernetes.io/spark-node
  # sparkWorker/spark-worker removed — that was the static spot-fleet ASG's
  # node-role, deleted along with it in favor of Karpenter. Karpenter's
  # spark-node NodePool covers both spot and on-demand capacity under the
  # same node-role label; spot-vs-on-demand is already distinguishable via
  # Karpenter's own native karpenter.sh/capacity-type label if ever needed,
  # no separate custom node-role required for that.
  #
  # Two always-on tiers (replacing the old single "gp" tier):
  #   core: cluster/platform-control-plane-adjacent services — ArgoCD,
  #     Traefik, CoreDNS, cert-manager, cloudflared, CSI controllers,
  #     Karpenter's own controller, Spark Operator (all wired in Terraform,
  #     not here — see compute-core-node.tf).
  #   data: data/app-plane services — Postgres, Airflow, Gravitino, Redis,
  #     kube-prometheus-stack, Spark History Server.
  # Only core/data/spark are used by local chart templates
  # (.Values.global.nodeSelector.x). Superset/StarRocks don't have entries
  # here — they're external charts with their own top-level nodeSelector
  # value, not something that reads our global.* convention; see the
  # superset/starrocks blocks below instead (their fallback, while their own
  # dedicated node groups are disabled, is the core tier).
  nodeSelector:
    core:
      node-role.kubernetes.io/core-node: ""
    data:
      node-role.kubernetes.io/data-node: ""
    spark:
      node-role.kubernetes.io/spark-node: ""


  # --- Storage ---
  storageClassName: "openebs-hostpath"

  # --- PostgreSQL Connection (shared by Airflow, Superset, Gravitino) ---
  # host is CNPG's primary read-write service ("<cluster-name>-rw"), not a
  # plain Service named "postgres" — see charts/postgres/templates/cluster.yaml.
  # No password here: the superuser password lives in the postgres-superuser
  # Secret (pre-created out-of-band by post-cluster-bootstrap.sh) and is
  # referenced directly by name wherever it's needed, never as a Helm value.
  postgres:
    host: "postgres-rw.default.svc.cluster.local"
    port: 5432
    user: "postgres"
    database: "postgres"

  # --- Apache Gravitino — Iceberg REST Catalog & unified metadata lake ---
  # Sole metadata catalog now — Hive Metastore and Unity Catalog removed.
  gravitino:
    metalake: "enterprise_metalake"
    catalog: "sales_catalog"
    extraCatalogs:
      - "raw_catalog"
    # Iceberg REST Catalog endpoint consumed by StarRocks (direct IRC access).
    icebergRestUri: "http://gravitino.default.svc.cluster.local:9001/iceberg/"
    # Main API endpoint — used by GravitinoSparkPlugin for catalog discovery
    apiUri: "http://gravitino.default.svc.cluster.local:8090"

# =============================================================================
# PERSISTENCE — PV/PVC definitions
# =============================================================================
persistence:
  enabled: true
  # postgres no longer has a static local-hostpath PV/PVC here — see
  # postgres.persistence below (StatefulSet volumeClaimTemplates on ebs-gp3).
  # minio removed entirely — replaced by S3 (lakehouse-s3 Secret).
  # DAGs PVC is dynamically provisioned on efs-airflow-dags now (RWX) —
  # only .size is still read (see charts/persistence/templates/volumes.yaml).
  airflow:
    size: 5Gi
  # Scheduler/triggerer logs no longer need static PVs — they're on ebs-gp3
  # via airflow.logs.persistence.storageClassName, dynamically provisioned
  # by the official chart's own StatefulSet volumeClaimTemplates.
  # Coupled to starrocks.starrocks.starrocksFESpec/BeSpec.nodeSelector below
  # in the actual chart values — the PV's nodeAffinity must always match
  # wherever the pod is actually scheduled, or the PVC never binds. Flip
  # both together if you ever move StarRocks to its dedicated node group.
  starrocksFe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-fe"
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
  starrocksBe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-be"
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
  redis:
    size: 8Gi
    localPath: "/var/openebs/local/redis-data"
    nodeSelector:
      node-role.kubernetes.io/data-node: ""

# =============================================================================
# POSTGRES — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# CloudNativePG Cluster CR (charts/postgres/templates/cluster.yaml) on
# ebs-gp3 (network-attached, survives node replacement/pod reschedule).
# image MUST be a CNPG-published postgresql image, not the plain Docker Hub
# `postgres` image — CNPG's initdb/instance-manager expects that image's
# specific UID/filesystem layout. Using vanilla `postgres:16` fails every
# single initdb attempt with "could not look up effective user ID 26: user
# does not exist". Confirmed live.
# =============================================================================
postgres:
  enabled: true
  replicas: 3
  image: "ghcr.io/cloudnative-pg/postgresql:16"
  persistence:
    storageClassName: "ebs-gp3"
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# REDIS — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
redis:
  enabled: true
  replicas: 1
  image: "redis:7.2-alpine"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# MinIO removed entirely — replaced by S3 (one "lakehouse" bucket with
# prefixes instead of MinIO's separate warehouse/spark-logs/notebooks/
# airflow/delta-tables buckets; S3 prefixes don't need explicit creation).

# =============================================================================
# APACHE AIRFLOW (external dependency)
# =============================================================================
airflow:
  enabled: true
  fullnameOverride: "airflow"
  useStandardNaming: true
  executor: "LocalExecutor"
  # airflow-credentials is pre-created out-of-band by post-cluster-bootstrap.sh
  # (never in git) — one Secret referenced three times, each setting reading
  # its own key (fernet-key / webserver-secret-key / connection), matching
  # what the official chart expects for each of these three settings.
  fernetKeySecretName: "airflow-credentials"
  webserverSecretKeySecretName: "airflow-credentials"
  postgresql:
    enabled: false
  data:
    metadataSecretName: "airflow-credentials"
  # Disable the chart's internal Helm-hook migration job.
  # Migrations are handled by templates/airflow-db-migrate.yaml (ArgoCD wave 5).
  # Running both concurrently can cause race conditions under ArgoCD.
  migrateDatabaseJob:
    enabled: false
  # Disable the chart's own admin-user creation job too — it defaults to
  # enabled:true and would race templates/airflow-db-migrate.yaml, which
  # creates the same "admin" user with the real (secret-sourced) password.
  # Whichever job happened to run first was silently deciding the actual
  # login password — this was a real, live bug, not just redundancy.
  createUserJob:
    enabled: false
  images:
    airflow:
      repository: apache/airflow
      tag: "3.2.0"
  dags:
    # Built-in gitSync disabled — replaced by airflow-git-sync sub-chart which
    # uses the custom image (git-sync + mc) and writes to the shared PVC.
    # Airflow reads DAGs from the PVC via persistence below.
    gitSync:
      enabled: false
    persistence:
      enabled: true
      existingClaim: airflow-dags-shared-pvc
      subPath: "repo/dags"
  # Airflow 3.x: DAG processor is a separate component that parses DAGs.
  # LocalDagBundle reads from the same folder git-sync mounts to ($AIRFLOW_HOME/dags).
  dagProcessor:
    enabled: true
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    dagBundleConfigList:
      - name: airflow-dags
        classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
        kwargs: {}
  # Airflow 3.x's actual UI/API-serving Deployment — this is what
  # ingress.yaml's {{ .Release.Name }}-api-server backend actually points
  # at, not webserver below (kept for chart compat, may be otherwise unused
  # in 3.x — not touched further here, out of scope for the node-tier split).
  apiServer:
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
  triggerer:
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
  webserver:
    defaultUser:
      enabled: true
      role: Admin
      username: admin
      email: admin@airflow.com
      firstName: Admin
      lastName: User
      # No password here — templates/airflow-db-migrate.yaml sources it from
      # the airflow-credentials Secret's admin-password key via env var.
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1500m"
        memory: "2Gi"
  scheduler:
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  logs:
    persistence:
      enabled: true
      # The official chart's logs PVC uses accessMode ReadWriteMany by
      # default (scheduler/webserver/triggerer/workers all need to read the
      # SAME log files concurrently) — ebs-gp3 is EBS block storage, which
      # cannot satisfy RWX at all (EBS only supports RWO/ReadOnlyMany), so
      # the PVC sat Pending forever with "Volume capabilities not
      # supported", not a transient provisioning error. Needs an actual
      # network filesystem — reusing the same EFS storage class already
      # provisioned for airflow-dags. Confirmed live.
      storageClassName: efs-airflow-dags
      size: 10Gi

  config:
    core:
      parallelism: "64"
      max_active_runs_per_dag: "20"
      max_active_tasks_per_dag: "20"
    database:
      sql_alchemy_pool_size: "15"

# =============================================================================
# AIRFLOW GIT-SYNC (custom sub-chart)
# Uses subhodeep2022/k8s-git-sync:v2-prod, writing the repo to
# airflow-dags-shared-pvc at /dags/repo (symlink) — its only job now. A
# separate s3-sync sidecar (official amazon/aws-cli image, IAM-role auth)
# mirrors /dags/repo to S3, replacing the image's own mc-based exechook.
# =============================================================================
airflow-git-sync:
  enabled: true
  image: "subhodeep2022/k8s-git-sync:v2-prod"
  repo: "https://github.com/sp-202/airflow-dags.git"
  branch: "main"
  period: "60s"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# =============================================================================
# APACHE GRAVITINO 1.2.0 — Unified Metadata Lake + Iceberg REST Catalog (IRC)
# GP node — moderate CPU/memory; IRC handles Spark & StarRocks catalog traffic.
#
# Architecture:
#   Port 8090 → Main REST API + Web UI v2 (metalake, catalog, table management)
#   Port 9001 → Iceberg REST Catalog (consumed by Spark SparkCatalog + StarRocks)
#
# Gravitino 1.2.0 bundles Iceberg 1.10.1 — exact parity with Spark image JARs.
# =============================================================================
gravitino:
  enabled: true
  replicas: 1
  image:
    repository: apache/gravitino
    tag: "1.3.0"
  # Matches .Values.global.nodeSelector.data used elsewhere — this chart's
  # values.yaml is separate (external dependency), so it's repeated literally
  # rather than templated (values.yaml itself is plain data, not Go-templated).
  nodeSelector:
    node-role.kubernetes.io/data-node: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  # entity.jdbcPassword is NOT set here — the official chart renders it as
  # plaintext into a ConfigMap (SKIP_CONFIG_REWRITE=true disables the
  # env-var-override mechanism our old custom chart relied on), so it can't
  # use a Secret reference at all. The real value is injected by
  # post-cluster-bootstrap.sh as an ArgoCD Application-level Helm parameter
  # (gravitino.entity.jdbcPassword) instead — never touches this file/git.
  entity:
    jdbcUrl: "jdbc:postgresql://postgres-rw.default.svc.cluster.local:5432/gravitino?currentSchema=public"
    jdbcDriver: "org.postgresql.Driver"
    jdbcUser: "gravitino"
  auxService:
    names: iceberg-rest
  icebergRest:
    httpPort: 9001
    # dynamic-config-provider: IRC delegates catalog lookup to the Core
    # Server (8090) instead of managing its own static/memory catalog —
    # same mode the old custom chart used, needed so Spark-created tables
    # show up in the Gravitino Web UI. icebergRest.warehouse/jdbc.* are
    # irrelevant in this mode (only used for static/jdbc catalog backends).
    catalogConfigProvider: dynamic-config-provider
    dynamicConfigProvider:
      uri: "http://localhost:8090"
      metalake: "enterprise_metalake"
    ioImpl: "org.apache.iceberg.aws.s3.S3FileIO"
    # No s3.accessKeyId/secretAccessKey/endpoint/pathStyleAccess — omitting
    # them makes Iceberg's S3FileIO fall back to the AWS SDK's default
    # credential chain (the node's IAM role) and real S3's default
    # virtual-hosted-style endpoint. Only region needs to be explicit.
    s3:
      region: "us-east-1"
  # icebergCatalog is this platform's own key (read by templates/gravitino-init.yaml
  # and templates/gravitino-schema-init.yaml), not part of the official chart's
  # schema — the catalog's own JDBC backend DB, name/user are safe as plain
  # values; warehouse (real S3 bucket path) and password are both injected via
  # ArgoCD helm.parameters at deploy time (bucket name is only known after
  # `terraform apply`, so it can't be hardcoded here either).
  icebergCatalog:
    db:
      name: "iceberg_catalog"
      user: "gravitino"

# =============================================================================
# SPARK HISTORY SERVER — Spark node (i4g.8xlarge: 32 vCPU / 256 GB)
# Light read workload; runs on spark node so it can access local NVMe event logs
# =============================================================================
spark-history-server:
  enabled: true
  replicas: 1
  daemonMemory: "2g"
  # logDirectory is no longer a value here — the real bucket name (only known
  # after `terraform apply`) is read from the lakehouse-s3 Secret directly in
  # charts/spark-history-server/templates/deployment.yaml.
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# SPARK CONNECT SERVER — Spark node (Karpenter-managed, c7gd/m7gd/r7gd)
# Driver and executors both land on Karpenter's spark-node NodePool.
# =============================================================================
spark-connect-server:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  dynamicAllocation:
    minExecutors: 2
    maxExecutors: 8
  executor:
    # Executor node targeting is handled by executor-pod-template-cm.yaml's
    # nodeAffinity (single spark-node pool now) rather than nodeSelector here.
    localDir: "/mnt/spark-nvme"
    hostPath: "/mnt/spark-nvme/spark-shuffle"

# =============================================================================
# KUBE-STARROCKS (external dependency)
# =============================================================================
starrocks:
  enabled: false
  # kube-starrocks is itself an umbrella with two subcharts: operator + starrocks.
  # FE/BE specs live under the "starrocks" subchart key, NOT under starrocksCluster.
  starrocks:
    starrocksCluster:
      name: starrocks-cluster
    starrocksFESpec:
      image:
        repository: starrocks/fe-ubuntu
        tag: "3.3-latest"
      replicas: 1
      # runAsNonRoot must be true (not false) due to a chart v1.9.8 Go-template bug:
      # the helper uses `{{- if .Values.starrocksFESpec.runAsNonRoot -}}` which treats
      # false as falsy and emits empty string → null, failing CRD boolean validation.
      # StarRocks 3.3 ubuntu images support non-root (UID 1000).
      runAsNonRoot: true
      # Defaults to the GP node — matches where its PV is currently pinned
      # (persistence.starrocksFe.nodeSelector below). To actually move FE to
      # the dedicated starrocks-node (terraform-aws-k8s-ha's
      # compute-starrocks.tf, enable_starrocks_nodegroup): flip BOTH this
      # value AND persistence.starrocksFe.nodeSelector together, or the PVC
      # won't bind (nodeAffinity would point at a different node than the
      # pod is scheduled on). Manual, not automatic — see conversation
      # history for why an ArgoCD helm.parameters toggle doesn't work
      # cleanly here (nodeSelector is a map; overriding one key adds an AND
      # condition instead of replacing it).
      nodeSelector:
        node-role.kubernetes.io/core-node: ""
      service:
        type: NodePort
        ports:
          - name: query
            containerPort: 9030
            nodePort: 30930
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
    starrocksBeSpec:
      image:
        repository: starrocks/be-ubuntu
        tag: "3.3-latest"
      replicas: 1
      runAsNonRoot: true
      # Same coupling as starrocksFESpec above — flip together with
      # persistence.starrocksBe.nodeSelector.
      nodeSelector:
        node-role.kubernetes.io/core-node: ""
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      storageVolumes:
        - name: be-storage
          storageClassName: "openebs-hostpath"
          storageSize: 20Gi

# =============================================================================
# JUPYTERHUB — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
jupyterhub:
  enabled: false
  replicas: 1
  sparkRemote: "sc://spark-connect-server-driver-svc:15002"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"

# =============================================================================
# INGRESS — centralized Traefik ingress rules
# =============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  # Sub-chart dependency flags passed to ingress template.
  # NOTE: the ingress chart can't see sibling subcharts' own .enabled values
  # (Helm only auto-shares .Values.global.* across subcharts) — these are
  # separate, manually-duplicated flags. If you flip the real superset.enabled
  # / gravitino.enabled / jupyterhub.enabled / spark-connect-server.enabled
  # above, flip the matching one here too, or the ingress rule and the
  # actual Service will disagree.
  gravitino:
    enabled: true
  superset:
    enabled: false
  jupyterhub:
    enabled: false
  spark-connect-server:
    enabled: false

# =============================================================================
# SPARK OPERATOR (external dependency)
# =============================================================================
spark-operator:
  enabled: true
  fullnameOverride: "spark-operator"
  # Top-level nodeSelector is a no-op here — the chart's controller
  # Deployment actually reads .Values.controller.nodeSelector (confirmed by
  # inspecting templates/controller/deployment.yaml), not a top-level key.
  controller:
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
  webhook:
    enable: true
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
  prometheus:
    metrics:
      enable: true
    podMonitor:
      create: false
      labels:
        release: kube-prometheus-stack
  spark:
    jobNamespaces:
      - default
    serviceAccount:
      create: true
      name: "spark-operator-spark"

# =============================================================================
# SUPERSET (external dependency)
# =============================================================================
superset:
  enabled: false
  fullnameOverride: "superset"
  postgresql:
    enabled: false
  redis:
    enabled: false
  # Defaults to the GP node — safe when enable_superset_nodegroup is false
  # (the default), since that's the only node this could possibly schedule
  # on. post-cluster-bootstrap.sh overrides this to superset-node via an
  # ArgoCD helm.parameters entry (same mechanism as Gravitino's password —
  # see argocd-app.sh) ONLY when enable_superset_nodegroup=true, so it's
  # automatically correct either way without hand-editing this file.
  nodeSelector:
    node-role.kubernetes.io/core-node: ""
  image:
    repository: apachesuperset.docker.scarf.sh/apache/superset
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  initImage:
    repository: apache/superset
    tag: dockerize
    pullPolicy: IfNotPresent
  bootstrapScript: |
    #!/bin/bash
    set -e
    pip install --no-cache-dir \
      starrocks==1.0.6 \
      pymysql \
      psycopg2-binary \
      pyhive \
      thrift \
      sasl \
      thrift-sasl
    if [ ! -f ~/bootstrap ]; then
      touch ~/bootstrap
    fi
  ingress:
    enabled: false
  # Secrets injected as raw env vars (valueFrom.secretKeyRef) — reach every
  # Superset pod including the init Job, per the chart's own template wiring.
  # See configOverrides below for how DB_PASS/SUPERSET_SECRET_KEY get used,
  # and init.initscript for ADMIN_PASSWORD.
  extraEnvRaw:
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: db-password
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: secret-key
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: admin-password
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    connections:
      redis_host: "redis"
      redis_port: "6379"
      redis_user: ""
      redis_cache_db: "1"
      redis_celery_db: "0"
      redis_ssl:
        enabled: false
        ssl_cert_reqs: CERT_NONE
      db_type: "postgresql"
      db_host: "postgres-rw.default.svc.cluster.local"
      db_port: "5432"
      db_user: superset
      # Not the real password — configOverrides.database below replaces
      # SQLALCHEMY_DATABASE_URI using $DB_PASS from superset-credentials.
      db_pass: "unused-see-configOverrides-database"
      db_name: superset
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetCeleryBeat:
    enabled: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  # Appended to the end of superset_config.py (chart's own default assignments
  # run first, these overwrite them) — real values come from extraEnvRaw above,
  # never from a literal here.
  configOverrides:
    secret: |
      import os
      SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
    database: |
      import os
      SQLALCHEMY_DATABASE_URI = (
          f"postgresql+psycopg2://superset:{os.environ['DB_PASS']}"
          f"@postgres-rw.default.svc.cluster.local:5432/superset"
      )
  init:
    enabled: true
    createAdmin: true
    jobAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@superset.com
      # No password here — initscript override below reads $ADMIN_PASSWORD
      # instead of interpolating .Values.init.adminUser.password directly
      # (the chart's default initscript does the latter, which would put
      # the real password in this file).
    # Same as the chart's default init.initscript (see apache-superset/superset
    # templates/secret-superset-config.yaml), except the create-admin line
    # uses "$ADMIN_PASSWORD" (shell env, from extraEnvRaw) instead of a
    # Helm-templated literal.
    initscript: |-
      #!/bin/sh
      set -eu
      echo "Upgrading DB schema..."
      superset db upgrade
      echo "Initializing roles..."
      superset init
      {{ if .Values.init.createAdmin }}
      echo "Creating admin user..."
      superset fab create-admin \
                      --username {{ .Values.init.adminUser.username }} \
                      --firstname {{ .Values.init.adminUser.firstname }} \
                      --lastname {{ .Values.init.adminUser.lastname }} \
                      --email {{ .Values.init.adminUser.email }} \
                      --password "$ADMIN_PASSWORD" \
                      || true
      {{- end }}
      {{ if .Values.init.loadExamples }}
      echo "Loading examples..."
      superset load_examples
      {{- end }}
      if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
        echo "Importing database connections.... "
        superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
      fi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# =============================================================================
# METRICS SERVER (external dependency - required for Headlamp)
# =============================================================================
metrics-server:
  enabled: true
  fullnameOverride: "metrics-server"
  nodeSelector:
    node-role.kubernetes.io/core-node: ""
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 60
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 30

# =============================================================================
# CERT-MANAGER (external dependency)
# Only consumer today is kube-prometheus-stack's Prometheus Operator admission
# webhook (below) — generates a self-signed CA for it instead of the chart's
# own create/patch Jobs, which ArgoCD can't manage safely (see comment there).
# =============================================================================
cert-manager:
  enabled: true
  crds:
    enabled: true
  nodeSelector:
    node-role.kubernetes.io/core-node: ""
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  webhook:
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  cainjector:
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# KUBE-PROMETHEUS-STACK (external dependency)
# =============================================================================
kube-prometheus-stack:
  enabled: true
  prometheusOperator:
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    admissionWebhooks:
      # Without this, the chart renders its own admission-create/-patch Jobs
      # (helm.sh/hook annotations, meaningless to ArgoCD's `helm template`
      # rendering) as permanent resources. Kubernetes Jobs are immutable, so
      # every ArgoCD resync fails to reapply them — this was the actual cause
      # of the "stuck Progressing/OutOfSync" loop. cert-manager (below)
      # generates the webhook CA instead; the chart's own condition
      # (see admission-webhooks/job-patch/job-createSecret.yaml) automatically
      # skips rendering those Jobs when this is true.
      certManager:
        enabled: true
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    admin:
      existingSecret: "grafana-credentials"
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: false  # Using centralized ingress instead
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: ALL
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  alertmanager:
    alertmanagerSpec:
      nodeSelector:
        node-role.kubernetes.io/data-node: ""
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      nodeSelector:
        node-role.kubernetes.io/data-node: ""
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
  prometheus-node-exporter:
    fullnameOverride: "node-exporter"
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  kube-state-metrics:
    fullnameOverride: "kube-state-metrics"
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# LOKI STACK (external dependency)
# =============================================================================
loki-stack:
  enabled: true
  loki:
    fullnameOverride: "loki"
    isDefault: false
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    image:
      repository: grafana/loki
      tag: 2.9.3
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    config:
      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h
      storage_config:
        boltdb_shipper:
          active_index_directory: /data/loki/boltdb-shipper-active
          cache_location: /data/loki/boltdb-shipper-cache
          cache_ttl: 24h
          shared_store: filesystem
        filesystem:
          directory: /data/loki/chunks
  promtail:
    enabled: true
    fullnameOverride: "promtail"
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    config:
      snippets:
        pipelineStages:
          - cri: {}

# =============================================================================
# CLOUDFLARED (local sub-chart) — spread across GP nodes for tunnel HA
# =============================================================================
cloudflared:
  enabled: true
  replicas: 3
  image: "cloudflare/cloudflared:2025.1.0"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# =============================================================================
# HEADLAMP (local sub-chart) — GP node
# =============================================================================
headlamp:
  enabled: true
  replicas: 1
  image: "ghcr.io/headlamp-k8s/headlamp:latest"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# =============================================================================
# MONITORING EXTRAS (local sub-chart)
# =============================================================================
monitoring:
  enabled: true

# =============================================================================
# NETWORKING EXTRAS (local sub-chart)
# =============================================================================
networking-extras:
  enabled: true
