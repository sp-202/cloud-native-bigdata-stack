# =============================================================================
# big-data-platform — Root values.yaml
# Data Platform as Code (DPaC) on AWS EC2 (ARM64/Graviton)
#
# This single file centralizes 60+ variables that were previously scattered
# across global-config.env and hardcoded in static manifests.
# =============================================================================

# --- Override Helpers ---
nameOverride: ""
fullnameOverride: ""

# --- Namespace Toggles ---
namespaces:
  createDashboard: true

# =============================================================================
# GLOBAL — shared across ALL sub-charts via .Values.global.*
# =============================================================================
global:
  # --- Platform Routing & Domain ---
  domain: "dailyblogstudio.com"
  cfTunnelId: "91e5be1d-3b51-4cac-aebf-d330aafda394"

  # --- Container Images ---
  sparkImage: "subhodeep2022/spark-bigdata:spark-4.0.1-v11-iceberg-gravitino"
  jupyterhubImage: "subhodeep2022/spark-bigdata:jupyterhub-4.0.7-pyspark-scala-sql-prod-v2"
  hiveImage: "subhodeep2022/spark-bigdata:hive-3.1.3-arm64-v1"
  airflowImage: "apache/airflow:2.7.1"
  gitSyncImage: "subhodeep2022/k8s-git-sync:v2-prod"

  # --- S3/MinIO Credentials & Endpoints ---
  s3:
    endpoint: "http://minio.default.svc.cluster.local:9000"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    pathStyleAccess: true
    sslEnabled: false

  # --- Node Selectors ---
  # Labels are applied by the node-auto-labeler DaemonSet in the bootstrap script.
  # The auto-labeler reads the `node-role` K8s label set by Terraform on each node
  # and creates node-role.kubernetes.io/<role>=  e.g. spark-node → node-role.kubernetes.io/spark-node
  nodeSelector:
    gp:
      node-role.kubernetes.io/k8s-gp-node: ""
    spark:
      node-role.kubernetes.io/spark-node: ""
    sparkWorker:
      node-role.kubernetes.io/spark-worker: ""
    minio:
      node-role.kubernetes.io/minio-worker: ""
    controlPlane:
      node-role.kubernetes.io/control-plane: ""

  # --- Storage ---
  storageClassName: "openebs-hostpath"

  # --- PostgreSQL Connection (shared by Hive, Airflow, Superset) ---
  postgres:
    host: "postgres.default.svc.cluster.local"
    port: 5432
    user: "postgres"
    password: "password"
    database: "postgres"

  # --- Hive Metastore Connection (optional — kept for StarRocks HMS compatibility if needed) ---
  hiveMetastore:
    uri: "thrift://hive-metastore.default.svc.cluster.local:9083"

  # --- Apache Gravitino — Iceberg REST Catalog & unified metadata lake ---
  gravitino:
    # Iceberg REST Catalog endpoint consumed by Spark & StarRocks.
    # In dynamic-config-provider mode each catalog is served at:
    #   http://gravitino:9001/iceberg/{catalog-name}
    # Must match the catalog name registered in the Gravitino Web UI (enterprise_metalake/sales_catalog).
    icebergRestUri: "http://gravitino.default.svc.cluster.local:9001/iceberg/sales_catalog"
    # Main API endpoint (metalake/catalog/schema/table management + Web UI)
    apiUri: "http://gravitino.default.svc.cluster.local:8090"

  # --- Unity Catalog OSS (disabled — replaced by Gravitino) ---
  unityCatalog:
    uri: "http://unity-catalog-server.default.svc.cluster.local:8080"
    token: ""

# =============================================================================
# PERSISTENCE — PV/PVC definitions
# =============================================================================
persistence:
  enabled: true
  postgres:
    size: 10Gi
    localPath: "/var/openebs/local/postgres-data"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  minio:
    size: 10Gi
    localPath: "/mnt/spark-nvme/minio"
    nodeSelector:
      node-role.kubernetes.io/minio-worker: ""
  airflow:
    size: 5Gi
    localPath: "/var/openebs/local/airflow-shared"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  # Logs PVs for Airflow StatefulSets (scheduler + triggerer).
  # Without these, the StatefulSet volumeClaimTemplates create PVCs that
  # stay Pending forever because there is no matching pre-provisioned PV.
  airflowSchedulerLogs:
    size: 10Gi
    localPath: "/var/openebs/local/airflow-scheduler-logs"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  airflowTriggererLogs:
    size: 10Gi
    localPath: "/var/openebs/local/airflow-triggerer-logs"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  starrocksFe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-fe"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  starrocksBe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-be"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  redis:
    size: 8Gi
    localPath: "/var/openebs/local/redis-data"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""

# =============================================================================
# POSTGRES — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
postgres:
  enabled: true
  replicas: 1
  image: "postgres:13"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# REDIS — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
redis:
  enabled: true
  replicas: 1
  image: "redis:7.2-alpine"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# =============================================================================
# MINIO — MinIO node (im4gn.8xlarge: 32 vCPU / 128 GB + NVMe RAID0)
# =============================================================================
minio:
  enabled: true
  replicas: 1
  image: "minio/minio:latest"
  mcImage: "minio/mc:latest"
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  buckets:
    - warehouse
    - spark-logs
    - notebooks
    - airflow
    - delta-tables

# =============================================================================
# AIRFLOW SECRETS — used by templates/airflow-secrets.yaml
# These values are NOT passed to the airflow sub-chart.
# The sub-chart references the pre-created secrets by name below.
# =============================================================================
airflowSecrets:
  fernetKey: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="
  webserverSecretKey: "bigdata-platform-airflow-webserver-key-change-me"
  metadataConnection:
    user: airflow
    pass: airflow
    host: postgres.default.svc.cluster.local
    port: 5432
    db: airflow

# =============================================================================
# APACHE AIRFLOW (external dependency)
# =============================================================================
airflow:
  enabled: true
  fullnameOverride: "airflow"
  executor: "LocalExecutor"
  # Reference pre-created secrets from templates/airflow-secrets.yaml
  fernetKeySecretName: "big-data-platform-fernet-key"
  webserverSecretKeySecretName: "big-data-platform-webserver-secret-key"
  postgresql:
    enabled: false
  data:
    metadataSecretName: "big-data-platform-metadata"
  # Disable the chart's internal Helm-hook migration job.
  # Migrations are handled by templates/airflow-db-migrate.yaml (ArgoCD wave 5).
  # Running both concurrently can cause race conditions under ArgoCD.
  migrateDatabaseJob:
    enabled: false
  images:
    airflow:
      repository: apache/airflow
      tag: 2.7.1
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/sp-202/airflow-dags.git"
      branch: "main"
      rev: "HEAD"
      depth: 1
      maxFailures: 0
      subPath: ""
  webserver:
    defaultUser:
      enabled: true
      role: Admin
      username: admin
      email: admin@airflow.com
      firstName: Admin
      lastName: User
      password: admin
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1500m"
        memory: "2Gi"
  scheduler:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  logs:
    persistence:
      enabled: false

  config:
    core:
      parallelism: "64"
      max_active_runs_per_dag: "20"
      max_active_tasks_per_dag: "20"
    database:
      sql_alchemy_pool_size: "15"

# =============================================================================
# HIVE METASTORE (+ HiveServer2) — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
hive-metastore:
  enabled: false  # Replaced by Apache Gravitino IRC (Iceberg REST Catalog)
  replicas: 1
  db:
    user: "hive"
    password: "hive"
    name: "metastore"
  metastore:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  server:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  initContainer:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

# =============================================================================
# APACHE GRAVITINO 1.2.0 — Unified Metadata Lake + Iceberg REST Catalog (IRC)
# GP node — moderate CPU/memory; IRC handles Spark & StarRocks catalog traffic.
#
# Architecture:
#   Port 8090 → Main REST API + Web UI v2 (metalake, catalog, table management)
#   Port 9001 → Iceberg REST Catalog (consumed by Spark SparkCatalog + StarRocks)
#
# Gravitino 1.2.0 bundles Iceberg 1.10.1 — exact parity with Spark image JARs.
# =============================================================================
gravitino:
  enabled: true
  replicas: 1
  image: "apache/gravitino:1.2.0"
  db:
    name: "gravitino"
    user: "postgres"
    password: "password"
  icebergCatalog:
    db:
      name: "iceberg_catalog"
      user: "postgres"
      password: "password"
    warehouse: "s3://warehouse/iceberg/"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# SPARK HISTORY SERVER — Spark node (i4g.8xlarge: 32 vCPU / 256 GB)
# Light read workload; runs on spark node so it can access local NVMe event logs
# =============================================================================
spark-history-server:
  enabled: true
  replicas: 1
  daemonMemory: "2g"
  logDirectory: "s3a://spark-logs/spark-events/"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# SPARK CONNECT SERVER — Spark node (i4g.8xlarge: 32 vCPU / 256 GB)
# Driver runs on spark node; executors dispatched to spark-worker nodes
# =============================================================================
spark-connect-server:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  dynamicAllocation:
    minExecutors: 2
    maxExecutors: 8
  executor:
    # Node targeting is handled by executor-pod-template-cm.yaml via nodeAffinity
    # (OR logic: spark-critical OR spark-spot). nodeSelector removed — it is
    # AND-only and cannot target multiple pools.
    localDir: "/mnt/spark-nvme"
    hostPath: "/mnt/spark-nvme/spark-shuffle"

# =============================================================================
# UNITY CATALOG OSS 0.4.0
# NOTE: unitycatalog/unitycatalog:0.4.0 does not exist on Docker Hub.
# Disabled until a valid image tag is confirmed (check ghcr.io or build custom).
# =============================================================================
unity-catalog:
  enabled: false
  replicas: 1
  db:
    name: "unity_catalog"
    user: "postgres"
    password: "password"
  server:
    image: "unitycatalog/unitycatalog:0.4.0"
    port: 8080
    # S3 bucket name + region are injected dynamically:
    #   Terraform → SSM param → bootstrap script → K8s Secret (unity-catalog-s3)
    # AWS credentials use EC2 instance profile (IAM role) — no static keys needed
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  ui:
    image: "unitycatalog/unitycatalog-ui:0.4.0"
    port: 3000
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# =============================================================================
# KUBE-STARROCKS (external dependency)
# =============================================================================
starrocks:
  enabled: true
  # kube-starrocks is itself an umbrella with two subcharts: operator + starrocks.
  # FE/BE specs live under the "starrocks" subchart key, NOT under starrocksCluster.
  starrocks:
    starrocksCluster:
      name: starrocks-cluster
    starrocksFESpec:
      image:
        repository: starrocks/fe-ubuntu
        tag: "3.3-latest"
      replicas: 1
      # runAsNonRoot must be true (not false) due to a chart v1.9.8 Go-template bug:
      # the helper uses `{{- if .Values.starrocksFESpec.runAsNonRoot -}}` which treats
      # false as falsy and emits empty string → null, failing CRD boolean validation.
      # StarRocks 3.3 ubuntu images support non-root (UID 1000).
      runAsNonRoot: true
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
    starrocksBeSpec:
      image:
        repository: starrocks/be-ubuntu
        tag: "3.3-latest"
      replicas: 1
      runAsNonRoot: true
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      storageVolumes:
        - name: be-storage
          storageClassName: "openebs-hostpath"
          storageSize: 20Gi

# =============================================================================
# JUPYTERHUB — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
jupyterhub:
  enabled: true
  replicas: 1
  sparkRemote: "sc://spark-connect-server-driver-svc:15002"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"

# =============================================================================
# INGRESS — centralized Traefik ingress rules
# =============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  # Sub-chart dependency flags passed to ingress template
  gravitino:
    enabled: true
  unityCatalog:
    enabled: false

# =============================================================================
# SPARK OPERATOR (external dependency)
# =============================================================================
spark-operator:
  enabled: true
  fullnameOverride: "spark-operator"
  nodeSelector:
    node-role.kubernetes.io/k8s-gp-node: ""
  controller:
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
  webhook:
    enable: true
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
  prometheus:
    metrics:
      enable: true
    podMonitor:
      create: false
      labels:
        release: kube-prometheus-stack
  spark:
    jobNamespaces:
      - default
    serviceAccount:
      create: true
      name: "spark-operator-spark"

# =============================================================================
# SUPERSET (external dependency)
# =============================================================================
superset:
  enabled: true
  fullnameOverride: "superset"
  postgresql:
    enabled: false
  redis:
    enabled: false
  nodeSelector:
    node-role.kubernetes.io/k8s-gp-node: ""
  image:
    repository: apachesuperset.docker.scarf.sh/apache/superset
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  initImage:
    repository: apache/superset
    tag: dockerize
    pullPolicy: IfNotPresent
  bootstrapScript: |
    #!/bin/bash
    set -e
    pip install --no-cache-dir \
      starrocks==1.0.6 \
      pymysql \
      psycopg2-binary \
      pyhive \
      thrift \
      sasl \
      thrift-sasl
    if [ ! -f ~/bootstrap ]; then
      touch ~/bootstrap
    fi
  ingress:
    enabled: false
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    connections:
      redis_host: "redis"
      redis_port: "6379"
      redis_user: ""
      redis_cache_db: "1"
      redis_celery_db: "0"
      redis_ssl:
        enabled: false
        ssl_cert_reqs: CERT_NONE
      db_type: "postgresql"
      db_host: "postgres.default.svc.cluster.local"
      db_port: "5432"
      db_user: superset
      db_pass: superset
      db_name: superset
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetCeleryBeat:
    enabled: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  configOverrides:
    secret: |
      SECRET_KEY = 'bigdata-platform-superset-secret-key-change-me'
  init:
    enabled: true
    createAdmin: true
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@superset.com
      password: "CHANGE_ME_STRONG_PASSWORD"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# =============================================================================
# METRICS SERVER (external dependency - required for Headlamp)
# =============================================================================
metrics-server:
  enabled: true
  fullnameOverride: "metrics-server"
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 60
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 30

# =============================================================================
# KUBE-PROMETHEUS-STACK (external dependency)
# =============================================================================
kube-prometheus-stack:
  enabled: true
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    adminPassword: "admin"
    ingress:
      enabled: false  # Using centralized ingress instead
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: ALL
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
  prometheus-node-exporter:
    fullnameOverride: "node-exporter"
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  kube-state-metrics:
    fullnameOverride: "kube-state-metrics"
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# LOKI STACK (external dependency)
# =============================================================================
loki-stack:
  enabled: true
  loki:
    fullnameOverride: "loki"
    isDefault: false
    image:
      repository: grafana/loki
      tag: 2.9.3
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    config:
      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h
      storage_config:
        boltdb_shipper:
          active_index_directory: /data/loki/boltdb-shipper-active
          cache_location: /data/loki/boltdb-shipper-cache
          cache_ttl: 24h
          shared_store: filesystem
        filesystem:
          directory: /data/loki/chunks
  promtail:
    enabled: true
    fullnameOverride: "promtail"
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    config:
      snippets:
        pipelineStages:
          - cri: {}

# =============================================================================
# CLOUDFLARED (local sub-chart) — spread across GP nodes for tunnel HA
# =============================================================================
cloudflared:
  enabled: true
  replicas: 3
  image: "cloudflare/cloudflared:2025.1.0"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# =============================================================================
# HEADLAMP (local sub-chart) — GP node
# =============================================================================
headlamp:
  enabled: true
  replicas: 1
  image: "ghcr.io/headlamp-k8s/headlamp:latest"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# =============================================================================
# MONITORING EXTRAS (local sub-chart)
# =============================================================================
monitoring:
  enabled: true

# =============================================================================
# NETWORKING EXTRAS (local sub-chart)
# =============================================================================
networking-extras:
  enabled: true
