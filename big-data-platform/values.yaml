# =============================================================================
# big-data-platform — Root values.yaml
# Data Platform as Code (DPaC) on on-prem RKE2 (x86_64) — branch `rke2`
#
# This single file centralizes 60+ variables that were previously scattered
# across global-config.env and hardcoded in static manifests.
#
# RKE2 port (vs. the EKS stack on `main`):
#   * storage    OpenEBS local PV (hostpath or LVM CSI) behind one StorageClass,
#                `local-storage`, replaces EBS/EFS
#   * objects    SeaweedFS S3 (namespace `storage`) replaces AWS S3; credentials
#                come from the `lakehouse-s3` Secret, not IRSA/IMDS
#   * network    Canal (RKE2 default CNI) replaces Cilium — no Hubble
#   * ingress    Traefik DaemonSet on hostPorts 80/443, hosts are
#                *.<node-ip>.sslip.io (global.domain, set at deploy time)
#   * nodes      4 identical nodes, no node tiers/Karpenter — no nodeSelectors
# Cluster + platform bootstrap: rke2/README.md
# =============================================================================

# --- Override Helpers ---
nameOverride: ""
fullnameOverride: ""

# The postgres Cluster/Database CRs (charts/postgres, sync-wave -2) need the
# CNPG operator actually running to reconcile them — a CR with no controller
# watching it just sits inert. The cloudnative-pg subchart has no sync-wave
# of its own (defaults to 0, same wave as most other resources), so without
# this it doesn't exist yet when the Cluster/Database CRs are created, and
# the wave -1 hook Jobs (airflow-db-migrate, gravitino-schema-init) that
# need a live Postgres connection retry forever. commonAnnotations pushes
# every resource this subchart creates to the same early wave as
# namespaces.yaml (-3), well before the -2 CRs that depend on it.
cloudnative-pg:
  enabled: true
  # Drops the "big-data-platform-" prefix (matches airflow/redis/postgres).
  # The operator's own webhook Service/ValidatingWebhookConfiguration/
  # MutatingWebhookConfiguration names (cnpg-webhook-service,
  # cnpg-*-webhook-configuration) are fixed by the chart regardless of
  # release name, and nothing else in this repo references the
  # release-prefixed operator name — pure rename.
  fullnameOverride: "cloudnative-pg"
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-3"
  # One operator replica: it manages a single Postgres instance here. main
  # ran 2 because a lone webhook backend intermittently hit "context
  # deadline exceeded" during ArgoCD's first big sync on EKS; if that shows
  # up here, raise this to 2 (webhook serving needs no leader election).
  replicaCount: 1
  # The operator ran BestEffort (no requests/limits) by default — zero
  # guaranteed CPU share. It also serves the mutating/validating admission
  # webhooks (cnpg-webhook-service) that every postgresql.cnpg.io Cluster/
  # Database create or update must pass through synchronously with a 30s
  # deadline. Confirmed live: on a node with CPU limits overcommitted to
  # ~120% during a fresh-deploy pod-startup storm, this pod's webhook
  # handler got starved and ArgoCD's sync started failing with
  # "failed calling webhook ... context deadline exceeded". A real CPU
  # request gives the scheduler grounds to guarantee this pod a share
  # instead of leaving it BestEffort. Deliberately NO cpu limit — a cpu
  # limit on a latency-sensitive pod causes hard CFS throttling
  # mid-request, the same failure class as this webhook timeout; the
  # request alone already gives a guaranteed floor.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "256Mi"

# =============================================================================
# GLOBAL — shared across ALL sub-charts via .Values.global.*
# =============================================================================
global:
  # --- Platform Routing & Domain ---
  # Every UI is <name>.<domain> through Traefik (charts/ingress,
  # charts/networking-extras). sslip.io resolves any "<anything>.<IP>.sslip.io"
  # to <IP>, so with domain "192.168.1.10.sslip.io" grafana.192.168.1.10.sslip.io
  # lands on that node's Traefik — no DNS server or tunnel needed. The real
  # value is injected by rke2/bootstrap-platform.sh as an ArgoCD Helm
  # parameter (INGRESS_IP in rke2/cluster.env); this placeholder only keeps a
  # local `helm template` rendering.
  domain: "127.0.0.1.sslip.io"

  # --- Container Images ---
  # All x86_64 (linux/amd64) on this branch. The Spark image is stock Apache
  # Spark + Iceberg/Gravitino/hadoop-aws, no Comet (docker/spark/README.md).
  sparkImage: "subhodeep2022/spark-bigdata:spark-3.5.8-v14-iceberg-gravitino-kafka-oss"
  # Always, not IfNotPresent: the image is rebuilt under the same tag.
  sparkImagePullPolicy: Always
  jupyterhubImage: "subhodeep2022/spark-bigdata:jupyterhub-4.0.7-pyspark-scala-sql-prod-v3"
  airflowImage: "apache/airflow:3.2.0"

  # --- S3 (SeaweedFS, rke2/argocd/seaweedfs.yaml) ---
  # In-cluster SeaweedFS S3 gateway (filer-embedded, namespace `storage`).
  # Plain HTTP + path-style, the opposite of real S3's defaults. Credentials
  # are NOT here: rke2/bootstrap-platform.sh creates the `lakehouse-s3`
  # Secret (in default and kube-system) with the AWS-SDK-standard keys
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_ENDPOINT_URL,
  #   S3_ENDPOINT (host:port, no scheme), bucket
  # so any pod that does `envFrom: secretRef: lakehouse-s3` gets working
  # credentials for aws-cli, boto3, the AWS Java SDKs, Hadoop S3A, Loki,
  # Thanos and Tempo without a single key in git.
  s3:
    secretName: "lakehouse-s3"
    endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
    # host:port form, for clients that take scheme and host separately
    # (Loki, Thanos, Tempo — all with insecure/plain-HTTP set).
    endpointHost: "seaweedfs-filer.storage.svc.cluster.local:8333"
    # SeaweedFS ignores the region, but every AWS SDK insists on one.
    region: "us-east-1"
    pathStyleAccess: true
    sslEnabled: false
    # Buckets created by rke2/bootstrap-platform.sh (S3 prefixes need no
    # creation). lakehouse holds iceberg/, spark-events/, thanos/, tempo/,
    # airflow-logs/; loki gets its own bucket because Loki treats the whole
    # bucket as its storage root (no prefix option).
    bucket: "lakehouse"
    lokiBucket: "loki"

  # --- Node Selectors ---
  # All four nodes are identical, so nothing is pinned: these stay empty maps
  # (templates render `nodeSelector: {}`) and the scheduler spreads pods.
  # To dedicate nodes later, label them and fill these in — local chart
  # templates read .Values.global.nodeSelector.<tier>.
  nodeSelector:
    core: {}
    data: {}
    spark: {}

  # --- Storage ---
  # `local-storage` is created by rke2/bootstrap-platform.sh and is the
  # cluster default. Its backend is STORAGE_BACKEND in rke2/cluster.env:
  #   hostpath  OpenEBS Local PV Hostpath — a directory per PVC, no disk prep,
  #             sizes not enforced
  #   lvm       OpenEBS Local PV LVM (CSI local.csi.openebs.io) — a real
  #             logical volume per PVC from the node's LVM volume group:
  #             enforced sizes, ext4/xfs, snapshots, online expansion
  # Every PVC in this chart names `local-storage`, so switching backends never
  # touches this file. Either way: WaitForFirstConsumer, RWO only, and the
  # volume is tied to its node — a pod with a PVC only reschedules onto the
  # same node. Data that must survive a node loss is replicated at the
  # application layer where it matters (2 Prometheus replicas, SeaweedFS
  # replication 001); Postgres is a single instance (postgres block below).
  storageClassName: "local-storage"

  # --- PostgreSQL Connection (shared by Airflow, Superset, Gravitino) ---
  # host is CNPG's primary read-write service ("<cluster-name>-rw"), not a
  # plain Service named "postgres" — see charts/postgres/templates/cluster.yaml.
  # No password here: the superuser password lives in the postgres-superuser
  # Secret (pre-created out-of-band by post-cluster-bootstrap.sh) and is
  # referenced directly by name wherever it's needed, never as a Helm value.
  postgres:
    host: "postgres-rw.default.svc.cluster.local"
    port: 5432
    user: "postgres"
    database: "postgres"

  # --- Apache Gravitino — Iceberg REST Catalog & unified metadata lake ---
  # Sole metadata catalog now — Hive Metastore and Unity Catalog removed.
  gravitino:
    metalake: "enterprise_metalake"
    catalog: "sales_catalog"
    extraCatalogs:
      - "raw_catalog"
    # Iceberg REST Catalog endpoint consumed by StarRocks (direct IRC access).
    icebergRestUri: "http://gravitino.default.svc.cluster.local:9001/iceberg/"
    # Main API endpoint — used by GravitinoSparkPlugin for catalog discovery
    apiUri: "http://gravitino.default.svc.cluster.local:8090"

# =============================================================================
# PERSISTENCE — PVCs that aren't owned by a StatefulSet
# Dynamically provisioned on global.storageClassName (local-storage) — no static
# PVs or node-pinned host paths. The Airflow DAGs PVC is gone: DAGs come from
# the official chart's own git-sync sidecar (airflow.dags.gitSync below), so
# nothing needs ReadWriteMany.
# =============================================================================
persistence:
  enabled: true
  # Only Redis is left here (StarRocks gets its volumes from the kube-starrocks
  # chart's own storageSpec). Keep enabled in step with redis.enabled.
  redis:
    enabled: false
    size: 8Gi

# =============================================================================
# POSTGRES — CloudNativePG Cluster CR (charts/postgres/templates/cluster.yaml)
# Single instance (no HA) on local-storage: one pod, one PVC pinned to the
# node it first lands on. Losing that node means restoring the DB — see
# rke2/README.md "Backups". To go HA later, raise replicas to 3: CNPG adds
# streaming replicas and failover with no other change.
# image MUST be a CNPG-published postgresql image, not the plain Docker Hub
# `postgres` image — CNPG's initdb/instance-manager expects that image's
# specific UID/filesystem layout. Using vanilla `postgres:16` fails every
# single initdb attempt with "could not look up effective user ID 26: user
# does not exist". Confirmed live.
# =============================================================================
postgres:
  enabled: true
  replicas: 1
  image: "ghcr.io/cloudnative-pg/postgresql:16"
  persistence:
    storageClassName: "local-storage"
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# REDIS — only Superset used it (cache + Celery broker; Airflow runs the
# LocalExecutor). Off while Superset is off; turn on together with
# persistence.redis.enabled.
# =============================================================================
redis:
  enabled: false
  replicas: 1
  image: "redis:7.2-alpine"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# =============================================================================
# APACHE AIRFLOW (external dependency)
# =============================================================================
airflow:
  enabled: true
  fullnameOverride: "airflow"
  useStandardNaming: true
  executor: "LocalExecutor"
  # airflow-credentials is pre-created out-of-band by post-cluster-bootstrap.sh
  # (never in git) — one Secret referenced three times, each setting reading
  # its own key (fernet-key / webserver-secret-key / connection), matching
  # what the official chart expects for each of these three settings.
  fernetKeySecretName: "airflow-credentials"
  webserverSecretKeySecretName: "airflow-credentials"
  # Airflow 3 API-server signing keys. Left unset, the chart generates them
  # with randAlphaNum at render time — Argo CD re-renders on every new commit,
  # so they'd rotate on each push (logging everyone out, briefly breaking the
  # api-server <-> scheduler log fetch). Pre-created once by
  # rke2/bootstrap-platform.sh instead (keys api-secret-key / jwt-secret).
  apiSecretKeySecretName: "airflow-api-secrets"
  jwtSecretName: "airflow-api-secrets"
  # The chart's bundled Redis is a Celery broker; LocalExecutor never uses it.
  # Off, which also stops its randomly generated password/broker-url Secrets
  # from churning on every render.
  redis:
    enabled: false
  postgresql:
    enabled: false
  data:
    metadataSecretName: "airflow-credentials"
  # Disable the chart's internal Helm-hook migration job.
  # Migrations are handled by templates/airflow-db-migrate.yaml (ArgoCD wave 5).
  # Running both concurrently can cause race conditions under ArgoCD.
  migrateDatabaseJob:
    enabled: false
  # Disable the chart's own admin-user creation job too — it defaults to
  # enabled:true and would race templates/airflow-db-migrate.yaml, which
  # creates the same "admin" user with the real (secret-sourced) password.
  # Whichever job happened to run first was silently deciding the actual
  # login password — this was a real, live bug, not just redundancy.
  #
  # createUserJob.enabled here does NOT actually control this — the
  # chart's own helper (templates/_helpers.yaml, createUserJob.isEnabled)
  # checks webserver.defaultUser.enabled FIRST and only falls back to
  # createUserJob.enabled when webserver.defaultUser is unset entirely:
  #   {{- if .Values.webserver.defaultUser -}}
  #     {{- .Values.webserver.defaultUser.enabled -}}
  #   {{- else -}}
  #     {{- .Values.createUserJob.enabled -}}
  #   {{- end -}}
  # Since webserver.defaultUser (below) IS set — it has to be, for
  # airflow-db-migrate.yaml to read its username/role/email — this
  # setting was silently dead code the whole time and the chart's own
  # airflow-create-user Job kept running anyway. Confirmed live: it
  # crash-looped with the exact same empty-ADMIN_PASSWORD race as
  # airflow-db-migrate.yaml (its own default password is a hardcoded
  # "admin", never wired to the real secret, so even a successful run
  # would have set the WRONG password). The real, effective switch is
  # webserver.defaultUser.enabled below — left false there instead.
  createUserJob:
    enabled: false
  images:
    airflow:
      repository: apache/airflow
      tag: "3.2.0"
  dags:
    # The official chart's git-sync sidecar in every component that parses or
    # runs DAGs (dag-processor, scheduler, triggerer), each with its own local
    # copy. Replaces main's airflow-git-sync subchart + RWX EFS PVC: no
    # ReadWriteMany storage exists on this cluster (local-storage is RWO), and
    # per-pod clones of a small DAG repo need none. The chart points
    # [core] dags_folder at <mount>/repo/<subPath>, which LocalDagBundle
    # below picks up.
    gitSync:
      enabled: true
      repo: "https://github.com/sp-202/airflow-dags.git"
      branch: "main"
      rev: HEAD
      subPath: "dags"
      period: 60s
      # Chart default 0 = the container exits on the FIRST failed fetch; on a
      # flaky uplink that is a CrashLoopBackOff. Keep serving the last good
      # checkout and retry: 10 consecutive failures (~10 min at period 60s).
      maxFailures: 10
      # git's HTTP/2 to GitHub breaks mid-fetch on lossy links ("curl 16 Error
      # in the HTTP2 framing layer"); HTTP/1.1 is plenty for a DAG repo.
      env:
        - name: GITSYNC_GIT_CONFIG
          value: "http.version:HTTP/1.1"
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          memory: "256Mi"
    persistence:
      enabled: false
  # Airflow 3.x: DAG processor is a separate component that parses DAGs.
  # LocalDagBundle reads from the same folder git-sync mounts to ($AIRFLOW_HOME/dags).
  statsd:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  dagProcessor:
    enabled: true
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    dagBundleConfigList:
      - name: airflow-dags
        classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
        kwargs: {}
  # Airflow 3.x's actual UI/API-serving Deployment — this is what
  # ingress.yaml's {{ .Release.Name }}-api-server backend actually points
  # at, not webserver below (kept for chart compat, may be otherwise unused
  # in 3.x).
  apiServer:
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1500m"
        memory: "1536Mi"
  triggerer:
    resources:
      requests:
        cpu: "100m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"
    # StatefulSet with its own RWO log volume.
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: "local-storage"
  webserver:
    defaultUser:
      # This is the flag that actually disables the chart's own
      # airflow-create-user Job (see createUserJob comment above) — the
      # username/role/email/name fields below stay set regardless, since
      # airflow-db-migrate.yaml still reads them for its own user-create
      # call. Only .enabled controls whether the CHART creates its own
      # competing Job.
      enabled: false
      role: Admin
      username: admin
      email: admin@airflow.com
      firstName: Admin
      lastName: User
      # No password here — templates/airflow-db-migrate.yaml sources it from
      # the airflow-credentials Secret's admin-password key via env var.
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1500m"
        memory: "2Gi"
  scheduler:
    replicas: 1
    # LocalExecutor: tasks run inside this pod, so the limit is the task budget.
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "2Gi"
  # Task logs without ReadWriteMany. On main the logs PVC was RWX on EFS
  # because scheduler/api-server/triggerer/dag-processor shared one volume.
  # Here logs.persistence stays off, which makes the chart run the
  # LocalExecutor scheduler as a StatefulSet with its own RWO log volume
  # (sized by workers.persistence below, the chart's switch for that). Tasks
  # write there and the api-server reads live logs from the scheduler's log
  # server (:8793). Finished task logs are also uploaded to SeaweedFS
  # (config.logging below), so they outlive that volume.
  logs:
    persistence:
      enabled: false
  workers:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: "local-storage"
  # AIRFLOW_CONN_SEAWEEDFS_S3: an Airflow "aws" connection pointing at
  # SeaweedFS (endpoint_url, path-style, static keys), stored as a JSON
  # connection by rke2/bootstrap-platform.sh in the airflow-s3-connection
  # Secret. Used by remote logging below, and usable from DAGs as
  # aws_conn_id="seaweedfs_s3".
  secret:
    - envName: AIRFLOW_CONN_SEAWEEDFS_S3
      secretName: airflow-s3-connection
      secretKey: connection

  config:
    core:
      parallelism: "64"
      max_active_runs_per_dag: "20"
      max_active_tasks_per_dag: "20"
      # Airflow 3.1.0 switched the DEFAULT auth manager from FAB to the new
      # "Simple Auth Manager" (dev/test only — generates random per-user
      # passwords to a local file inside the pod, no support for a known
      # admin/password the way this stack is built around). This entire
      # deployment assumes FAB: templates/airflow-db-migrate.yaml runs
      # `airflow users create --password "$ADMIN_PASSWORD"` (a FAB-only
      # CLI command) with a password sourced from the airflow-credentials
      # Secret, and webserver.defaultUser (below) is FAB's own config
      # shape. Without this, `airflow users create` fails with
      # "AttributeError: 'AirflowSecurityManagerV2' object has no
      # attribute 'find_role'" — the FAB provider is still bundled in the
      # image, just no longer the default. Confirmed live.
      auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    database:
      sql_alchemy_pool_size: "15"
    logging:
      remote_logging: "True"
      remote_base_log_folder: "s3://lakehouse/airflow-logs"
      remote_log_conn_id: "seaweedfs_s3"

# =============================================================================
# APACHE GRAVITINO 1.2.0 — Unified Metadata Lake + Iceberg REST Catalog (IRC)
# Moderate CPU/memory; IRC handles Spark & StarRocks catalog traffic.
#
# Architecture:
#   Port 8090 → Main REST API + Web UI v2 (metalake, catalog, table management)
#   Port 9001 → Iceberg REST Catalog (consumed by Spark SparkCatalog + StarRocks)
#
# Gravitino 1.2.0 bundles Iceberg 1.10.1 — exact parity with Spark image JARs.
# =============================================================================
gravitino:
  enabled: true
  # Drops the "big-data-platform-" prefix from the Deployment/pod name
  # (matches airflow/redis/postgres). The chart's own Service is already
  # named "gravitino" regardless of release name — verified via `helm
  # template` that this override doesn't change it, so the ingress backend
  # reference (charts/ingress/templates/ingress.yaml) needs no update.
  fullnameOverride: "gravitino"
  replicas: 1
  image:
    repository: apache/gravitino
    tag: "1.3.0"
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2560Mi"
  # entity.jdbcPassword is NOT set here — the official chart renders it as
  # plaintext into a ConfigMap (SKIP_CONFIG_REWRITE=true disables the
  # env-var-override mechanism our old custom chart relied on), so it can't
  # use a Secret reference at all. The real value is injected by
  # rke2/bootstrap-platform.sh as an ArgoCD Application-level Helm parameter
  # (gravitino.entity.jdbcPassword) instead — never touches this file/git.
  entity:
    jdbcUrl: "jdbc:postgresql://postgres-rw.default.svc.cluster.local:5432/gravitino?currentSchema=public"
    jdbcDriver: "org.postgresql.Driver"
    jdbcUser: "gravitino"
  auxService:
    names: iceberg-rest
  icebergRest:
    httpPort: 9001
    # dynamic-config-provider: IRC delegates catalog lookup to the Core
    # Server (8090) instead of managing its own static/memory catalog —
    # same mode the old custom chart used, needed so Spark-created tables
    # show up in the Gravitino Web UI. icebergRest.warehouse/jdbc.* are
    # irrelevant in this mode (only used for static/jdbc catalog backends).
    catalogConfigProvider: dynamic-config-provider
    dynamicConfigProvider:
      uri: "http://localhost:8090"
      metalake: "enterprise_metalake"
    ioImpl: "org.apache.iceberg.aws.s3.S3FileIO"
    # No icebergRest.s3 block, deliberately: the chart would render the
    # access/secret key into gravitino.conf (a ConfigMap — no Secret
    # reference possible). In dynamic-config-provider mode the IRC opens
    # S3FileIO with the catalog's own s3-* properties, which
    # templates/gravitino-init.yaml registers from the lakehouse-s3 Secret
    # (endpoint, region, path-style, keys) — so credentials stay in that
    # Secret only.
  # icebergCatalog is this platform's own key (read by templates/gravitino-init.yaml
  # and templates/gravitino-schema-init.yaml), not part of the official chart's
  # schema — the catalog's own JDBC backend DB, name/user and warehouse are
  # plain values; the DB password comes from the gravitino-db-role Secret and
  # the S3 keys from lakehouse-s3 (gravitino-init.yaml).
  icebergCatalog:
    warehouse: "s3://lakehouse/iceberg/"
    db:
      name: "iceberg_catalog"
      user: "gravitino"

# =============================================================================
# SPARK HISTORY SERVER — reads event logs from SeaweedFS
# =============================================================================
spark-history-server:
  enabled: true
  replicas: 1
  daemonMemory: "1g"
  # Where jobs write spark.eventLog.dir (examples/spark-jobs/rke2-iceberg-smoke-test.yaml).
  # rke2/bootstrap-platform.sh puts a marker object under it: the history
  # server refuses to start on a log directory that does not exist yet.
  logDirectory: "s3a://lakehouse/spark-events/"
  retainedApplications: 2000
  storeSizeLimit: "20Gi"
  # The history server rebuilds each app's UI by replaying its event log under ITS OWN
  # limits, not the job's -- same values as the TPC-H jobs set, so a replayed UI keeps
  # what the live one showed.
  ui:
    retainedJobs: 1000
    retainedStages: 1000
    retainedTasks: 100000
    retainedDeadExecutors: 20
    retainedExecutions: 1000
  # Heap 1g + disk-backed KV store (storeSizeLimit): enough for a few hundred
  # retained apps on 16 GB nodes.
  resources:
    requests:
      cpu: "250m"
      memory: "1536Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# =============================================================================
# SPARK CONNECT SERVER — OFF by default; code kept for manual use (set enabled
# and ingress.spark-connect-server.enabled together). Its 8-16Gi driver would
# not fit beside the rest on 16 GB nodes — shrink resources before enabling.
# =============================================================================
spark-connect-server:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  dynamicAllocation:
    minExecutors: 2
    maxExecutors: 8
  executor:
    # Host directory for shuffle/spill, created on every node by
    # rke2/scripts/prep-node.sh — point it at the fastest disk (bind-mount or
    # symlink /mnt/spark-nvme there). The name is kept from main so the job
    # manifests, Alloy and dashboards stay the same.
    localDir: "/mnt/spark-nvme"
    hostPath: "/mnt/spark-nvme/spark-shuffle"

# =============================================================================
# KUBE-STARROCKS (external dependency) — dedicated node
# =============================================================================
# StarRocks owns one whole node (STARROCKS_NODE in rke2/cluster.env,
# default node-04). install-cluster.sh labels it
# node-role.kubernetes.io/starrocks= and taints it dedicated=starrocks:NoSchedule,
# so FE/BE land only there and nothing else does (DaemonSets aside).
#
# Sizing for a 16 GB / 20-core node with 2 GB held back for the OS
# (kubelet system/kube-reserved): ~13.6 Gi allocatable.
#   FE  3 Gi req / 4 Gi limit, JVM -Xmx3g   (chart default is -Xmx8192m — would
#                                            be OOM-killed under a 4 Gi limit)
#   BE  7 Gi req / 8.5 Gi limit, mem_limit 7G
#   leaves ~2 Gi for node DaemonSets and page cache headroom.
# Storage: FE meta + logs and BE data + logs on local-storage PVCs on that
# node (main had no storageSpec at all: emptyDir, data lost on restart).
#
# Query from the LAN: mysql -h <any-node-ip> -P 30930 -uroot
starrocks:
  enabled: true
  # kube-starrocks is itself an umbrella with two subcharts: operator + starrocks.
  # FE/BE specs live under the "starrocks" subchart key, NOT under starrocksCluster.
  operator:
    starrocksOperator:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 512Mi }
  starrocks:
    starrocksCluster:
      name: starrocks-cluster
    starrocksFESpec:
      image:
        repository: starrocks/fe-ubuntu
        tag: "3.3-latest"
      replicas: 1
      # runAsNonRoot must be true (not false) due to a chart v1.9.8 Go-template bug:
      # the helper uses `{{- if .Values.starrocksFESpec.runAsNonRoot -}}` which treats
      # false as falsy and emits empty string → null, failing CRD boolean validation.
      # StarRocks 3.3 ubuntu images support non-root (UID 1000).
      runAsNonRoot: true
      nodeSelector:
        node-role.kubernetes.io/starrocks: ""
      tolerations:
        - key: dedicated
          operator: Equal
          value: starrocks
          effect: NoSchedule
      service:
        type: NodePort
        ports:
          - name: query
            containerPort: 9030
            nodePort: 30930
      resources:
        requests:
          cpu: "2"
          memory: "3Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
      storageSpec:
        name: fe
        storageClassName: "local-storage"
        storageSize: 10Gi
        logStorageSize: 5Gi
      # Chart default + -Xmx3072m instead of -Xmx8192m.
      config: |
        LOG_DIR = ${STARROCKS_HOME}/log
        DATE = "$(date +%Y%m%d-%H%M%S)"
        JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx3072m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
        http_port = 8030
        rpc_port = 9020
        query_port = 9030
        edit_log_port = 9010
        mysql_service_nio_enabled = true
        sys_log_level = INFO
    starrocksBeSpec:
      image:
        repository: starrocks/be-ubuntu
        tag: "3.3-latest"
      replicas: 1
      runAsNonRoot: true
      nodeSelector:
        node-role.kubernetes.io/starrocks: ""
      tolerations:
        - key: dedicated
          operator: Equal
          value: starrocks
          effect: NoSchedule
      resources:
        requests:
          cpu: "8"
          memory: "7Gi"
        limits:
          cpu: "16"
          memory: "8704Mi"
      storageSpec:
        name: be
        storageClassName: "local-storage"
        storageSize: 100Gi
        logStorageSize: 10Gi
      # Chart default + explicit mem_limit below the container limit (BE would
      # otherwise size itself from the host's 16 GB).
      config: |
        be_port = 9060
        webserver_port = 8040
        heartbeat_service_port = 9050
        brpc_port = 8060
        sys_log_level = INFO
        default_rowset_type = beta
        mem_limit = 7G

# =============================================================================
# JUPYTERHUB — OFF by default; code kept for manual use (set enabled and
# ingress.jupyterhub.enabled together; it talks to Spark Connect).
# =============================================================================
jupyterhub:
  enabled: false
  replicas: 1
  sparkRemote: "sc://spark-connect-server-driver-svc:15002"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"

# =============================================================================
# INGRESS — centralized Traefik ingress rules
# =============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  # Sub-chart dependency flags passed to ingress template.
  # NOTE: the ingress chart can't see sibling subcharts' own .enabled values
  # (Helm only auto-shares .Values.global.* across subcharts) — these are
  # separate, manually-duplicated flags. If you flip the real superset.enabled
  # / gravitino.enabled / jupyterhub.enabled / spark-connect-server.enabled
  # above, flip the matching one here too, or the ingress rule and the
  # actual Service will disagree.
  gravitino:
    enabled: true
  superset:
    enabled: false
  jupyterhub:
    enabled: false
  spark-connect-server:
    enabled: false
  # spark-history.<domain> — keep in step with spark-history-server.enabled
  spark-history-server:
    enabled: true
  # victoriametrics.<domain>/vmui — keep in step with iiot.victoriametrics.enabled
  victoriametrics:
    enabled: true
  # starrocks.<domain> — FE web UI (8030); keep in step with starrocks.enabled
  starrocks:
    enabled: true

# =============================================================================
# SPARK OPERATOR (external dependency)
# =============================================================================
spark-operator:
  enabled: true
  fullnameOverride: "spark-operator"
  controller:
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    # Ran BestEffort by default (confirmed live: {} resources on the real
    # Deployment) — same CPU-starvation class already root-caused and
    # fixed for cloudnative-pg. This one is worse than most: the chart's own values.yaml
    # comment (spark-operator/values.yaml ~line 200) explicitly warns
    # "each job submission will spawn a JVM within the controller pods
    # using java -Xmx128m. Kubernetes may kill these Java processes at
    # will to enforce resource limits... you will see 'failed to run
    # spark-submit for SparkApplication [...]: signal: killed'" — under
    # BestEffort that spawned JVM has zero guaranteed memory floor, and
    # this is a single shared controller submitting every SparkApplication
    # cluster-wide, not a per-job pod. CPU request only (no limit — same
    # CFS-throttling reasoning as cloudnative-pg); memory gets
    # both, since the chart's own docs identify memory pressure as the
    # actual failure mode here, and unlike CPU, a memory limit is the
    # correct tool for capping a runaway/leaking JVM rather than something
    # that hurts a healthy one.
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
  webhook:
    enable: true
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    # Lighter than the controller — this pod only validates/mutates
    # SparkApplication objects, it doesn't spawn per-submission JVMs.
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
  prometheus:
    metrics:
      enable: true
    podMonitor:
      create: false
      labels:
        release: kube-prometheus-stack
  spark:
    jobNamespaces:
      - default
    # No IRSA annotation: S3 credentials reach drivers/executors through
    # `envFrom: secretRef: lakehouse-s3` in each SparkApplication's
    # driver/executor spec (examples/spark-jobs/rke2-iceberg-smoke-test.yaml).
    serviceAccount:
      create: true
      name: "spark-operator-spark"

# =============================================================================
# SUPERSET — OFF on this branch and not a Chart.yaml dependency (see the note
# there). This block is inert until the dependency is re-added.
# =============================================================================
superset:
  enabled: false
  fullnameOverride: "superset"
  postgresql:
    enabled: false
  redis:
    enabled: false
  image:
    repository: apachesuperset.docker.scarf.sh/apache/superset
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  initImage:
    repository: apache/superset
    tag: dockerize
    pullPolicy: IfNotPresent
  bootstrapScript: |
    #!/bin/bash
    set -e
    pip install --no-cache-dir \
      starrocks==1.0.6 \
      pymysql \
      psycopg2-binary \
      pyhive \
      thrift \
      sasl \
      thrift-sasl
    if [ ! -f ~/bootstrap ]; then
      touch ~/bootstrap
    fi
  ingress:
    enabled: false
  # Secrets injected as raw env vars (valueFrom.secretKeyRef) — reach every
  # Superset pod including the init Job, per the chart's own template wiring.
  # See configOverrides below for how DB_PASS/SUPERSET_SECRET_KEY get used,
  # and init.initscript for ADMIN_PASSWORD.
  extraEnvRaw:
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: db-password
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: secret-key
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: admin-password
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    connections:
      redis_host: "redis"
      redis_port: "6379"
      redis_user: ""
      redis_cache_db: "1"
      redis_celery_db: "0"
      redis_ssl:
        enabled: false
        ssl_cert_reqs: CERT_NONE
      db_type: "postgresql"
      db_host: "postgres-rw.default.svc.cluster.local"
      db_port: "5432"
      db_user: superset
      # Not the real password — configOverrides.database below replaces
      # SQLALCHEMY_DATABASE_URI using $DB_PASS from superset-credentials.
      db_pass: "unused-see-configOverrides-database"
      db_name: superset
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetCeleryBeat:
    enabled: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  # Appended to the end of superset_config.py (chart's own default assignments
  # run first, these overwrite them) — real values come from extraEnvRaw above,
  # never from a literal here.
  configOverrides:
    secret: |
      import os
      SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
    database: |
      import os
      SQLALCHEMY_DATABASE_URI = (
          f"postgresql+psycopg2://superset:{os.environ['DB_PASS']}"
          f"@postgres-rw.default.svc.cluster.local:5432/superset"
      )
  init:
    enabled: true
    createAdmin: true
    jobAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@superset.com
      # No password here — initscript override below reads $ADMIN_PASSWORD
      # instead of interpolating .Values.init.adminUser.password directly
      # (the chart's default initscript does the latter, which would put
      # the real password in this file).
    # Same as the chart's default init.initscript (see apache-superset/superset
    # templates/secret-superset-config.yaml), except the create-admin line
    # uses "$ADMIN_PASSWORD" (shell env, from extraEnvRaw) instead of a
    # Helm-templated literal.
    initscript: |-
      #!/bin/sh
      set -eu
      echo "Upgrading DB schema..."
      superset db upgrade
      echo "Initializing roles..."
      superset init
      {{ if .Values.init.createAdmin }}
      echo "Creating admin user..."
      superset fab create-admin \
                      --username {{ .Values.init.adminUser.username }} \
                      --firstname {{ .Values.init.adminUser.firstname }} \
                      --lastname {{ .Values.init.adminUser.lastname }} \
                      --email {{ .Values.init.adminUser.email }} \
                      --password "$ADMIN_PASSWORD" \
                      || true
      {{- end }}
      {{ if .Values.init.loadExamples }}
      echo "Loading examples..."
      superset load_examples
      {{- end }}
      if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
        echo "Importing database connections.... "
        superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
      fi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# =============================================================================
# METRICS SERVER — not deployed by this chart: RKE2 ships rke2-metrics-server
# (kube-system) by default, and a second copy would fight it over the
# v1beta1.metrics.k8s.io APIService.
# =============================================================================

# =============================================================================
# CERT-MANAGER (external dependency)
# Only consumer today is kube-prometheus-stack's Prometheus Operator admission
# webhook (below) — generates a self-signed CA for it instead of the chart's
# own create/patch Jobs, which ArgoCD can't manage safely (see comment there).
# =============================================================================
cert-manager:
  enabled: true
  # Drops the "big-data-platform-" prefix from every resource this subchart
  # creates (matches the pattern airflow/redis/postgres already use). No
  # other file references this chart's release-prefixed name, so this is a
  # pure rename — nothing else needs updating to match.
  fullnameOverride: "cert-manager"
  crds:
    enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  webhook:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  cainjector:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# KUBE-PROMETHEUS-STACK (external dependency)
# =============================================================================
kube-prometheus-stack:
  enabled: true
  # Drops the "big-data-platform-" prefix (matches airflow/redis/postgres) —
  # also replaces the cryptic auto-truncated "kube-pro" name (Helm's own
  # 63-char fullname truncation) with the real chart name. The prometheus
  # Service becomes "kube-prometheus-stack-prometheus" (charts/ingress).
  fullnameOverride: "kube-prometheus-stack"
  prometheusOperator:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
    admissionWebhooks:
      # Without this, the chart renders its own admission-create/-patch Jobs
      # (helm.sh/hook annotations, meaningless to ArgoCD's `helm template`
      # rendering) as permanent resources. Kubernetes Jobs are immutable, so
      # every ArgoCD resync fails to reapply them — this was the actual cause
      # of the "stuck Progressing/OutOfSync" loop. cert-manager (below)
      # generates the webhook CA instead; the chart's own condition
      # (see admission-webhooks/job-patch/job-createSecret.yaml) automatically
      # skips rendering those Jobs when this is true.
      certManager:
        enabled: true
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    admin:
      existingSecret: "grafana-credentials"
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: false  # Using centralized ingress instead
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: ALL
      datasources:
        # Pinned so dashboards and links can name it; dashboards use ${ds}.
        uid: prometheus
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # VictoriaMetrics (charts/iiot): the live DCS time series, 7-day retention,
    # Prometheus-compatible query API (PromQL/MetricsQL). Metric names follow
    # Telegraf's <measurement>_<field>, e.g. dcs_value{topic="dcs/..."}.
    # (main's Thanos, Tempo and Loki datasources are gone with those
    # components — see the alloy/loki-stack/thanos/monitoring.tempo blocks.)
    additionalDataSources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.default.svc.cluster.local:8428
        isDefault: false
        jsonData:
          timeInterval: 10s
  alertmanager:
    alertmanagerSpec:
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits: { memory: 128Mi }
  prometheus:
    prometheusSpec:
      # One replica, 7 days on its local volume. main ran 2 replicas + Thanos
      # (S3 history) because its cluster was torn down after every run; this one
      # is persistent, and on 16 GB nodes a second Prometheus plus the Thanos
      # query/store/compactor trio cost ~4 Gi for little gain. Losing the node
      # holding the PVC loses cluster-metrics history — plant data lives in
      # VictoriaMetrics/Kafka, not here.
      replicas: 1
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: "250m"
          memory: "1536Mi"
        limits:
          cpu: "2000m"
          memory: "3Gi"
      # Enables POST /api/v1/admin/tsdb/snapshot (on-demand backups).
      enableAdminAPI: true
      storageSpec:
        volumeClaimTemplate:
          spec:
            # Literal, not .Values.global.storageClassName — this block is
            # raw data handed to the kube-prometheus-stack subchart, not a
            # Go template, so {{ }} would never render here.
            storageClassName: "local-storage"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 40Gi
      retention: 7d
      # Size cap as a backstop: the oldest blocks go first if 7 days of series
      # ever outgrow the volume.
      retentionSize: 35GB
      externalLabels:
        cluster: rke2-bigdata
  # RKE2 control plane. Unlike EKS, etcd/scheduler/controller-manager run as
  # static pods on the server nodes (labels component=<name>, namespace
  # kube-system), so the chart's default scrapes work once RKE2 binds their
  # metrics off localhost — rke2/scripts/install-rke2.sh sets
  # etcd-expose-metrics and bind-address=0.0.0.0 for both, and
  # kube-proxy-arg metrics-bind-address=0.0.0.0:10249. Scheduler and
  # controller-manager serve HTTPS with a self-signed cert, hence
  # insecureSkipVerify (auth is still Prometheus's ServiceAccount token).
  kubeEtcd:
    enabled: true
    service:
      enabled: true
      port: 2381
      targetPort: 2381
      selector:
        component: etcd
    serviceMonitor:
      scheme: http
  kubeScheduler:
    enabled: true
    service:
      enabled: true
      port: 10259
      targetPort: 10259
      selector:
        component: kube-scheduler
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeControllerManager:
    enabled: true
    service:
      enabled: true
      port: 10257
      targetPort: 10257
      selector:
        component: kube-controller-manager
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  # RKE2 runs kube-proxy as a static pod (component=kube-proxy), not the
  # k8s-app=kube-proxy DaemonSet the chart's default selector expects.
  kubeProxy:
    enabled: true
    service:
      enabled: true
      port: 10249
      targetPort: 10249
      selector:
        component: kube-proxy
  prometheus-node-exporter:
    fullnameOverride: "node-exporter"
    # Scraped by Prometheus directly (ServiceMonitor on). On main Alloy
    # scraped and pushed it; Alloy is off here. main also ran
    # --collector.ethtool on ens5|ens6 for the AWS ENA counters — dropped.
    prometheus:
      monitor:
        enabled: true
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  kube-state-metrics:
    fullnameOverride: "kube-state-metrics"
    # kube_pod_info already carries namespace, pod, pod_ip, host_ip and node —
    # the table every other signal joins on. This adds the Spark pod labels
    # to kube_pod_labels (as label_spark_role, label_spark_app_selector,
    # label_spark_exec_id), so an executor_id in Spark's metrics resolves to
    # its pod, and through kube_pod_info to its IP and node.
    metricLabelsAllowlist:
      - pods=[spark-role,spark-app-selector,spark-exec-id,app,tier]
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# GRAFANA ALLOY (external dependency) -- the single node agent
# =============================================================================
# One DaemonSet on every node. Pipelines live in charts/monitoring/files/config.alloy
# (ConfigMap kube-system/alloy-config, rendered by charts/monitoring):
#   pod logs, journal, Spark GC/diag files -> Loki
#   node-exporter, OTLP metrics, Alloy's own metrics -> Prometheus
# Everything ships continuously; system-node-critical + a 50 s grace keep Alloy alive
# through a node shutdown long enough for the final flush.
#
# OFF on this cluster (resource plan, rke2/README.md): no log shipping, no OTLP. Pod logs
# stay readable with kubectl logs; node-exporter is scraped by Prometheus directly. To
# turn it back on: alloy.enabled, monitoring.alloyConfig.enabled, loki-stack.enabled (and
# node-exporter's ServiceMonitor off, or samples arrive twice).
alloy:
  enabled: false
  fullnameOverride: alloy
  # kube-system: an ArgoCD AppProject destination already (rke2/argocd/projects.yaml), and
  # where the other node agents live.
  namespaceOverride: kube-system
  crds:
    create: false            # PodLogs CRD -- not used
  image:
    tag: v1.20.0
  alloy:
    configMap:
      create: false
      name: alloy-config     # charts/monitoring/templates/alloy-config.yaml
      key: config.alloy
    # hostPath below: positions and the remote-write WAL survive an Alloy restart, so a
    # restart resends rather than re-reads from the end or drops.
    storagePath: /var/lib/alloy
    listenAddr: 0.0.0.0
    listenPort: 12345
    enableReporting: false
    extraEnv:
      # config.alloy selects this node's pods by spec.nodeName -- HOSTNAME is the short
      # host name under hostNetwork and never matches.
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    # OTLP receivers (config.alloy section 5), HTTP and gRPC.
    extraPorts:
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
    mounts:
      varlog: true           # /var/log -> /var/log/pods/*
      # varlog above already covers the persistent journal (/var/log/journal);
      # this adds the volatile one, for distros that keep it in /run.
      extra:
        - name: journal
          mountPath: /run/log/journal
          readOnly: true
        - name: machine-id
          mountPath: /etc/machine-id
          readOnly: true
        - name: spark-nvme
          mountPath: /spark-nvme
          readOnly: true
        - name: alloy-data
          mountPath: /var/lib/alloy
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
  controller:
    type: daemonset
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    # Stopped in kubelet's critical-pod phase, after the workload, so the last lines of the
    # executors are already read. 50 s fits inside shutdownGracePeriodCriticalPods (60 s,
    # rke2/scripts/install-rke2.sh kubelet-arg).
    priorityClassName: system-node-critical
    terminationGracePeriodSeconds: 50
    tolerations:
      - operator: Exists     # every node, control-plane and any future taint included
    volumes:
      extra:
        - name: journal
          hostPath:
            path: /run/log/journal
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        # What Spark pods mount as /mnt/spark-nvme.
        - name: spark-nvme
          hostPath:
            path: /mnt/spark-nvme/spark-shuffle
            type: DirectoryOrCreate
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
  service:
    enabled: true
    # An executor sending OTLP to alloy.kube-system.svc always reaches the Alloy on its own
    # node, never a remote one.
    internalTrafficPolicy: Local

# =============================================================================
# LOKI STACK (external dependency)
# =============================================================================
loki-stack:
  # OFF with Alloy (nothing would ship logs to it). Its config below is kept
  # for when it's turned back on.
  enabled: false
  loki:
    fullnameOverride: "loki"
    # The chart's Grafana datasource (templates/datasources.yaml). uid is pinned because Tempo's
    # "logs for this span" link names it; dashboards select Loki through ${ds}. The derived
    # field turns any trace id in a log line into a link to Tempo, matching both common forms:
    # `trace_id=<hex>` and JSON `"trace_id":"<hex>"`. A text match
    # rather than structured metadata, which Loki 2.9 here does not store.
    datasource:
      uid: loki
      jsonData: |
        derivedFields:
          - name: TraceID
            matcherRegex: 'trace_id"?[=:]"?([0-9a-f]{32})'
            datasourceUid: tempo
            url: "$${__value.raw}"
    isDefault: false
    image:
      repository: grafana/loki
      tag: 2.9.3
    # SeaweedFS credentials as AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env:
    # storage_config.aws below sets no keys, so Loki's S3 client takes them
    # from the environment — nothing secret in this file or the rendered
    # config Secret.
    extraEnvFrom:
      - secretRef:
          name: lakehouse-s3
    # Loki ships chunks/index to SeaweedFS (storage_config below) — this PVC
    # is WAL + not-yet-flushed in-memory chunks only (the ~10m ingester
    # flush window below), not the long-term store.
    persistence:
      enabled: true
      storageClassName: "local-storage"
      size: 20Gi
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    # Loki's own metrics (ingestion rate, discarded samples by reason,
    # rate-limit rejections) — the only way to see that logs are being lost.
    serviceMonitor:
      enabled: true
    config:
      # Flush policy: time trigger at 15m, size trigger as the pressure
      # relief valve, and chunk cuts aligned so the flushes go out as a
      # batch instead of dribbling.
      #
      # 10m, NOT the 15m an S3-cost argument alone would pick — on main the
      # cluster was ephemeral (torn down ~10-20 min after a benchmark, PVC
      # included), so the flush interval was a DATA LOSS window. On this
      # persistent on-prem cluster the WAL survives restarts, but 10m also
      # bounds what a lost node's local-storage PVC can take with it.
      #
      # For the record, the cost argument it overrides: measured over the
      # first hour of real traffic, 82 chunk objects, 702 KB total, average
      # 8,773 bytes — 0.6% of chunk_target_size. The size trigger never fires
      # at this rate, so max_chunk_age alone sets the S3 PUT rate and the
      # relationship is inverse — 10m costs ~50% more PUTs than 15m at ~9 KB
      # per object instead of ~13 KB. On a cluster that lives hours, that is
      # a rounding error against losing the tail of a benchmark run.
      #
      # 10m still is not a guarantee on its own: a chunk created 1 minute
      # before teardown has not aged out. flush_on_shutdown below closes
      # that, and `curl -XPOST loki:3100/flush` (returns 204) forces every
      # in-memory chunk out immediately — worth running as the last step
      # before destroying the cluster.
      #
      # The two triggers are a floor/ceiling pair, not alternatives:
      #   max_chunk_age 15m   ceiling — a quiet stream still reaches S3
      #                       within 15m even if it never fills a chunk
      #   chunk_target_size   floor — a stream under heavy pressure (Spark
      #     1.5 MB            executors, a crash loop) fills 1.5 MB and
      #                       flushes IMMEDIATELY, without waiting out the
      #                       15m. This is what keeps a log storm bounded in
      #                       ingester memory, and it is already sized right:
      #                       a stream has to be ~175x busier than today's
      #                       average to hit it, which is exactly when you
      #                       want an early flush and not before.
      #   chunk_idle_period   a stream that stops entirely is flushed rather
      #     15m               than pinned in memory forever.
      #
      # Batching. sync_period cuts chunks on a shared wall-clock boundary
      # across ALL streams, so they become flushable in the same tick and
      # the ingester's flush workers (concurrent_flushes, 32 by default)
      # push them together, rather than each stream cutting on its own
      # private timer and trickling PUTs out continuously. Chunks aligned
      # this way also compress and dedupe better.
      #
      # sync_min_utilization guards the obvious failure of that: without it
      # a sync boundary would cut EVERY stream regardless of how little it
      # holds, turning one aligned batch into a burst of near-empty objects
      # and undoing the whole point. At 0.5 a chunk below half of
      # chunk_target_size is left to keep filling and cut on age instead.
      #
      # Note on what "batch" can mean here: Loki writes one S3 object per
      # chunk and has no API to combine several into a single PUT. Batching
      # is therefore about ISSUING the flushes together in parallel, not
      # about merging them into one request. Fewer, larger objects is what
      # actually reduces the request count, which is what the 15m and the
      # utilization floor above are for.
      #
      # Cost of the window is durability latency, not durability: unflushed
      # chunks live in the ingester and in the WAL below, on the local-storage
      # PVC, replayed on restart. A pod restart is covered; losing the node
      # (and with it the PVC) costs up to 10m of logs.
      ingester:
        chunk_idle_period: 10m
        max_chunk_age: 10m
        chunk_target_size: 1572864
        sync_period: 10m
        sync_min_utilization: 0.5
        wal:
          enabled: true
          dir: /data/loki/wal
          # Flush everything still in memory when the pod terminates
          # gracefully. On an ephemeral benchmark cluster this is the
          # difference between keeping and losing the final chunks, since
          # teardown takes the PVC (and therefore the WAL) with it.
          #
          # Nests under ingester.wal, NOT ingester — it is a WAL setting.
          # Putting it directly under ingester crash-loops Loki at startup
          # with "field flush_on_shutdown not found in type ingester.Config",
          # which is a hard config-parse failure, not a warning.
          flush_on_shutdown: true
      # v13/tsdb on S3 from the first day — a fresh cluster has no older
      # schema period to keep.
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        # These nulls are Helm-version dependent — do not rely on them.
        # A local `helm template` (Helm 4) does strip both keys, but the
        # Secret ArgoCD actually rendered for this same revision still
        # contained the chart's boltdb_shipper (shared_store: filesystem) and
        # filesystem (directory: /data/loki/chunks) defaults — ArgoCD 7.8.23
        # bundles Helm 3, which is the likely difference.
        # Harmless either way: schema v13 uses store: tsdb + object_store: s3,
        # so neither key is ever consulted. Just don't read their absence in a
        # local render as proof they are gone in the cluster.
        boltdb_shipper: null
        filesystem: null
        tsdb_shipper:
          # Required. tsdb_shipper is the ACTIVE index shipper for schema v13
          # (store: tsdb above); without a shared_store the index is only ever
          # written to the local active_index_directory and never reaches S3.
          shared_store: s3
          active_index_directory: /data/loki/tsdb-shipper-active
          cache_location: /data/loki/tsdb-shipper-cache
        aws:
          # MUST be `bucketnames`, not an `s3://<bucket>` URL. Loki takes the
          # bucket from either `bucketnames` or the URL *path* — never the URL
          # host, which it treats as an endpoint/region. So
          # `s3: s3://<bucket>` parses to an EMPTY bucket and every S3 call
          # fails the SDK's own validation before it leaves the pod:
          #
          #   InvalidParameter: minimum field size of 1, ListObjectsV2Input.Bucket
          #   InvalidParameter: minimum field size of 1, DeleteObjectInput.Bucket
          #
          # Loki logs "uploading tables" every minute regardless, so this looks
          # healthy from the outside while the bucket stays completely empty.
          #
          # SeaweedFS: literal values (raw subchart data, not a template) —
          # keep in sync with global.s3.{lokiBucket,endpointHost,region}.
          bucketnames: loki
          endpoint: seaweedfs-filer.storage.svc.cluster.local:8333
          region: us-east-1
          insecure: true
          s3forcepathstyle: true
      # Loki's own internal compactor (retention/index compaction) is a
      # separate concept from Thanos's Compactor (charts/thanos) — this one
      # still defaulted to shared_store: filesystem, inconsistent with
      # everything else above now pointing at S3.
      compactor:
        working_directory: /data/loki/compactor
        shared_store: s3
      # Explicit limits instead of Loki 2.9's defaults (4 MB/s per tenant,
      # 3 MB/s per stream, 256 KB lines rejected outright). An SF1000 run
      # with 56 executors logging INFO, plus node journals and Kubernetes
      # events, can burst past 4 MB/s, and anything over is dropped at the
      # push with a 429 — silently, from the reader's side. Over-long lines
      # are truncated rather than rejected, so a huge stack trace is kept.
      limits_config:
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        per_stream_rate_limit: 8MB
        per_stream_rate_limit_burst: 16MB
        max_line_size: 512KB
        max_line_size_truncate: true
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_entries_limit_per_query: 20000
        max_query_series: 5000
  promtail:
    # Replaced by the `alloy` DaemonSet (top-level `alloy:` block). main keeps a full promtail
    # pipeline here for rollback; it was EKS-specific (node names, Karpenter taints) and is not
    # carried over. Do not run both: every line would reach Loki twice.
    enabled: false

# =============================================================================
# MONITORING EXTRAS (local sub-chart)
# =============================================================================
monitoring:
  enabled: true
  # Dashboards (dashboards/*.json) not deployed: loki-logs needs Loki, which is off.
  disabledDashboards:
    - loki-logs.json
  # ConfigMap kube-system/alloy-config from files/config.alloy, for the `alloy` subchart.
  # Off with alloy.enabled.
  alloyConfig:
    enabled: false
  # Kubernetes events -> stdout -> alloy -> Loki
  # (charts/monitoring/templates/k8s-event-exporter.yaml).
  # Off: its only consumer was Loki (via Alloy). Events: kubectl get events -A.
  eventExporter:
    enabled: false
  # Spark GC/diag files on the node disk -> s3://lakehouse/spark-node-logs/
  # (charts/monitoring/templates/spark-node-log-shipper.yaml). Off by default: on main it
  # existed because Karpenter deleted spark nodes minutes after a job; here nodes are
  # permanent and Alloy already tails the same files into Loki (spark-node-files pipeline).
  sparkNodeLogs:
    enabled: false
    intervalSeconds: 60
  # Tempo (charts/monitoring/templates/tempo.yaml): OTLP traces via the Alloy on each node
  # (config.alloy section 5). Blocks in s3://lakehouse/tempo/ (SeaweedFS). Limits are generous
  # (large Spark traces); Tempo's 5 MB default per trace truncates them.
  # Off: traces reached it only through Alloy's OTLP receiver.
  tempo:
    enabled: false
    image: "grafana/tempo:2.5.0"
    retention: "168h"
    storageClassName: "local-storage"
    storageSize: "20Gi"   # WAL + blocks not yet flushed to S3
    nodeSelector: {}
    limits:
      ingestionRateBytes: 104857600    # 100 MiB/s
      ingestionBurstBytes: 209715200   # 200 MiB
      maxTracesPerUser: 100000
      maxBytesPerTrace: 524288000      # 500 MiB
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits: { cpu: "2", memory: "8Gi" }

# =============================================================================
# THANOS (local sub-chart) — long-term Prometheus storage in SeaweedFS
# (s3://lakehouse/thanos/), see charts/thanos.
# =============================================================================
thanos:
  # OFF: single Prometheus with 7-day local retention (kube-prometheus-stack
  # block). Re-enabling also needs prometheusSpec.thanos and the sidecar's
  # lakehouse-s3 envFrom back (see main / git history).
  enabled: false
  # Must match kube-prometheus-stack.prometheus.prometheusSpec.thanos.image
  # above — Sidecar/Query/Store Gateway/Compactor all speak the same gRPC
  # StoreAPI.
  image: "quay.io/thanos/thanos:v0.42.4"
  # Compactor retention — raw kept a month for detailed shuffle/executor
  # debugging (issues #38-#40 style investigations), then downsampled so a
  # year of history doesn't cost a year of raw-resolution S3 storage.
  retention:
    raw: "30d"
    fiveMin: "90d"
    oneHour: "365d"
  query:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  storeGateway:
    storageSize: "5Gi"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  compactor:
    storageSize: "20Gi"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

# =============================================================================
# NETWORKING EXTRAS (local sub-chart) — Traefik IngressRoutes (ArgoCD, Traefik
# dashboard) and the optional `default` namespace NetworkPolicy
# =============================================================================
networking-extras:
  enabled: true
  # Canal (Calico policy engine) enforces standard NetworkPolicy. Off by
  # default: on a single-tenant 4-node cluster the boundary bought little and
  # main's version needed Cilium-only exceptions (apiserver -> webhooks,
  # hostNetwork Alloy -> Loki/Prometheus). With plain NetworkPolicy those
  # sources are node IPs, so turning this on requires nodeCIDRs (the nodes'
  # LAN subnet) and podCIDR (RKE2 default 10.42.0.0/16, whose per-node
  # .0 addresses are the flannel VXLAN source IPs for host traffic).
  networkPolicy:
    enabled: false
    nodeCIDRs: []
    podCIDR: "10.42.0.0/16"

# =============================================================================
# STRIMZI KAFKA OPERATOR (external dependency) — runs the Kafka cluster that
# charts/iiot declares (Kafka / KafkaNodePool / KafkaTopic CRs). Watches only
# its own (release) namespace. CRDs: rke2/scripts/apply-crds.sh.
# =============================================================================
strimzi-kafka-operator:
  enabled: true
  fullnameOverride: strimzi-cluster-operator
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 384Mi

# =============================================================================
# IIOT (local sub-chart) — DCS -> MQTT -> Telegraf -> Kafka + VictoriaMetrics
# =============================================================================
# DCS ──MQTT bridge──▶ Mosquitto ──▶ telegraf-kafka ──▶ Kafka dcs.raw ──▶ Spark
#                                └─▶ telegraf-vm ────▶ VictoriaMetrics (7 d) ──▶ Grafana
# See charts/iiot/README.md. Credentials: Secret mosquitto-credentials
# (rke2/bootstrap-platform.sh); optional outbound-bridge password: Secret
# mosquitto-bridge (key remote-password), created by you.
iiot:
  enabled: true

  mosquitto:
    enabled: true
    image: "eclipse-mosquitto:2.0.21"
    # mqtt://<ingress-node-ip>:1883 through Traefik's `mqtt` TCP entrypoint.
    expose: true
    users:
      dcs: dcs           # what the DCS side's bridge/gateway logs in as
      telegraf: telegraf # both Telegraf pipelines (read-only)
    # Topic patterns the dcs user may publish and telegraf may read.
    topics:
      - "dcs/#"
    # Per persistent session (each Telegraf): queue depth before the broker
    # drops the oldest messages while that consumer is down.
    maxQueuedMessages: 200000
    messageSizeLimit: 1048576
    storageSize: 5Gi
    # Outbound bridge: THIS broker connects to the DCS broker and pulls topics
    # in. Leave off if the DCS side bridges into this broker instead.
    bridge:
      enabled: false
      address: "dcs-broker.plant.local:1883"
      clientId: rke2-bigdata-bridge
      remoteUsername: ""           # password: Secret mosquitto-bridge, key remote-password
      # mosquitto `topic` lines: <pattern> <in|out|both> <qos> [local-prefix remote-prefix]
      topics:
        - "# in 1 dcs/ \"\""
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

  telegraf:
    enabled: true
    image: "telegraf:1.36.1"
    topics:
      - "dcs/#"
    # Measurement name: series become <measurement>_<field> in VictoriaMetrics.
    measurement: dcs
    # Parser for the MQTT payload (raw Telegraf TOML, input-plugin level).
    # Default: each topic carries one number (e.g. dcs/unit1/TI101 -> 23.4);
    # the topic is kept as the `topic` tag. For JSON payloads, e.g.
    #   data_format = "json_v2"
    #   [[inputs.mqtt_consumer.json_v2]]
    #     [[inputs.mqtt_consumer.json_v2.field]]
    #       path = "value"
    #       type = "float"
    #     [[inputs.mqtt_consumer.json_v2.tag]]
    #       path = "tag"
    #     [[inputs.mqtt_consumer.json_v2.timestamp]] ...
    parser: |
      data_format = "value"
      data_type = "float"
    pipelines:
      kafka:
        enabled: true
        flushInterval: 1s
        batchSize: 5000
        bufferLimit: 500000
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
      vm:
        enabled: true
        flushInterval: 5s
        batchSize: 5000
        bufferLimit: 500000
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }

  kafka:
    enabled: true
    clusterName: iiot
    version: "4.1.0"
    # One combined controller+broker per node, on 3 of the 4 nodes (the
    # StarRocks node is tainted). RF 3 / min ISR 2.
    replicas: 3
    heap: 1g
    resources:
      requests: { cpu: 500m, memory: 1536Mi }
      limits: { cpu: "2", memory: 2Gi }
    storageSize: 50Gi
    defaultRetentionHours: 72
    topic:
      name: dcs.raw
      partitions: 6
      # Kafka is the buffer between the plant and Spark, not the archive:
      # 3 days of replay for Spark jobs; history lives in the lakehouse.
      retentionHours: 72

  victoriametrics:
    enabled: true
    image: "victoriametrics/victoria-metrics:v1.122.0"
    retentionPeriod: 7d
    storageSize: 50Gi
    extraArgs: []
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
