# =============================================================================
# big-data-platform — Root values.yaml
# Data Platform as Code (DPaC) on AWS EC2 (ARM64/Graviton)
#
# This single file centralizes 60+ variables that were previously scattered
# across global-config.env and hardcoded in static manifests.
# =============================================================================

# --- Override Helpers ---
nameOverride: ""
fullnameOverride: ""

# --- Namespace Toggles ---
namespaces:
  createDashboard: true

# =============================================================================
# GLOBAL — shared across ALL sub-charts via .Values.global.*
# =============================================================================
global:
  # --- Platform Routing & Domain ---
  domain: "dailyblogstudio.com"
  cfTunnelId: "91e5be1d-3b51-4cac-aebf-d330aafda394"

  # --- Container Images ---
  sparkImage: "subhodeep2022/spark-bigdata:spark-3.5.8-v13-iceberg-gravitino"
  jupyterhubImage: "subhodeep2022/spark-bigdata:jupyterhub-4.0.7-pyspark-scala-sql-prod-v3"
  hiveImage: "subhodeep2022/spark-bigdata:hive-3.1.3-arm64-v1"
  airflowImage: "apache/airflow:3.2.0"
  gitSyncImage: "subhodeep2022/k8s-git-sync:v2-prod"

  # --- S3/MinIO Credentials & Endpoints ---
  s3:
    endpoint: "http://minio.default.svc.cluster.local:9000"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    pathStyleAccess: true
    sslEnabled: false

  # --- Node Selectors ---
  # Labels are applied by the node-auto-labeler DaemonSet in the bootstrap script.
  # The auto-labeler reads the `node-role` K8s label set by Terraform on each node
  # and creates node-role.kubernetes.io/<role>=  e.g. spark-node → node-role.kubernetes.io/spark-node
  nodeSelector:
    gp:
      node-role.kubernetes.io/k8s-gp-node: ""
    spark:
      node-role.kubernetes.io/spark-node: ""
    sparkWorker:
      node-role.kubernetes.io/spark-worker: ""
    minio:
      node-role.kubernetes.io/minio-worker: ""


  # --- Storage ---
  storageClassName: "openebs-hostpath"
  # Network-attached EBS (terraform-aws-k8s-ha: kubernetes_storage_class.ebs_gp3)
  # — for the handful of things that must survive node replacement/Karpenter
  # consolidation, unlike openebs-hostpath above which is tied to one node's
  # local disk. Used by Prometheus/Thanos/Loki below, not the general default,
  # since it costs real EBS $/GB-month vs. hostpath's free local disk.
  storageClassNameEbs: "ebs-gp3"

  # --- AWS Lakehouse S3 bucket (terraform-aws-k8s-ha: storage-s3-lakehouse.tf) ---
  # The real AWS S3 bucket, NOT the MinIO endpoint above — this cluster is
  # destroyed and rebuilt per benchmark run (see issues.md), so anything that
  # needs to survive a full teardown (Thanos's Prometheus history) has to live
  # here, not on MinIO's OpenEBS-hostpath PV. Every other workload that
  # touches this bucket gets credentials from the node's instance-profile
  # role via IMDS (aws_iam_policy.lakehouse_s3, granted on the whole
  # bucket) — Thanos is the one exception, see thanosS3RoleArn below.
  awsLakehouse:
    bucket: "k8s-ha-cluster-lakehouse-ap-south-1-419772658418"
    region: "ap-south-1"

  # --- IRSA S3 roles (terraform-aws-k8s-ha: observability-irsa.tf) ---
  # Thanos and Loki don't use the blanket node-role/IMDS pattern above —
  # each gets its own IAM role, trusted only by its specific K8s
  # ServiceAccount (via the OIDC provider already set up for Karpenter's
  # own IRSA), scoped to only the S3 paths that one workload needs. Role
  # ARNs are deterministic (IAM ARNs have no random suffix, unlike S3
  # bucket names), so — like awsLakehouse.bucket above — they're hardcoded
  # here rather than injected from Terraform at deploy time.
  thanosS3RoleArn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-thanos-s3-writer"
  lokiS3RoleArn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-loki-s3-writer"

  # --- Loki's own dedicated S3 bucket (terraform-aws-k8s-ha:
  # observability-irsa.tf: aws_s3_bucket.loki_logs) — NOT a prefix inside
  # awsLakehouse.bucket like Thanos gets. Loki's storage_config.aws S3
  # client treats the whole configured bucket as its flat storage root; it
  # has no bucket-internal prefix option the way Thanos's objstore config
  # does, so sharing the lakehouse bucket would mean Loki owns the entire
  # thing. A small dedicated bucket keeps it out of the lakehouse
  # namespace instead.
  awsLoki:
    bucket: "k8s-ha-cluster-loki-logs-ap-south-1-419772658418"
    region: "ap-south-1"

  # --- PostgreSQL Connection (shared by Hive, Airflow, Superset) ---
  postgres:
    host: "postgres.default.svc.cluster.local"
    port: 5432
    user: "postgres"
    password: "password"
    database: "postgres"

  # --- Hive Metastore Connection (optional — kept for StarRocks HMS compatibility if needed) ---
  hiveMetastore:
    uri: "thrift://hive-metastore.default.svc.cluster.local:9083"

  # --- Apache Gravitino — Iceberg REST Catalog & unified metadata lake ---
  gravitino:
    metalake: "enterprise_metalake"
    catalog: "sales_catalog"
    extraCatalogs:
      - "raw_catalog"
    # Iceberg REST Catalog endpoint consumed by StarRocks (direct IRC access).
    icebergRestUri: "http://gravitino.default.svc.cluster.local:9001/iceberg/"
    # Main API endpoint — used by GravitinoSparkPlugin for catalog discovery
    apiUri: "http://gravitino.default.svc.cluster.local:8090"

  # --- Unity Catalog OSS (disabled — replaced by Gravitino) ---
  unityCatalog:
    uri: "http://unity-catalog-server.default.svc.cluster.local:8080"
    token: ""

# =============================================================================
# PERSISTENCE — PV/PVC definitions
# =============================================================================
persistence:
  enabled: true
  postgres:
    size: 10Gi
    localPath: "/var/openebs/local/postgres-data"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  minio:
    size: 2Ti
    localPath: "/mnt/spark-nvme/minio"
    nodeSelector:
      node-role.kubernetes.io/minio-worker: ""
  airflow:
    size: 5Gi
    localPath: "/var/openebs/local/airflow-shared"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  # Logs PVs for Airflow StatefulSets (scheduler + triggerer).
  # Without these, the StatefulSet volumeClaimTemplates create PVCs that
  # stay Pending forever because there is no matching pre-provisioned PV.
  airflowSchedulerLogs:
    size: 10Gi
    localPath: "/var/openebs/local/airflow-scheduler-logs"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  airflowTriggererLogs:
    size: 10Gi
    localPath: "/var/openebs/local/airflow-triggerer-logs"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  starrocksFe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-fe"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  starrocksBe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-be"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
  redis:
    size: 8Gi
    localPath: "/var/openebs/local/redis-data"
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""

# =============================================================================
# POSTGRES — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
postgres:
  enabled: true
  replicas: 1
  image: "postgres:16"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# REDIS — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
redis:
  enabled: true
  replicas: 1
  image: "redis:7.2-alpine"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# =============================================================================
# MINIO — MinIO node (im4gn.8xlarge: 32 vCPU / 128 GB + NVMe RAID0)
# =============================================================================
minio:
  enabled: true
  replicas: 1
  image: "minio/minio:latest"
  mcImage: "minio/mc:latest"
  resources:
    requests:
      cpu: "28m"
      memory: "48Gi"
    limits:
      cpu: "48"
      memory: "84Gi"
  buckets:
    - warehouse
    - spark-logs
    - notebooks
    - airflow
    - delta-table
    - tpch-data

# =============================================================================
# AIRFLOW SECRETS — used by templates/airflow-secrets.yaml
# These values are NOT passed to the airflow sub-chart.
# The sub-chart references the pre-created secrets by name below.
# =============================================================================
airflowSecrets:
  fernetKey: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="
  webserverSecretKey: "bigdata-platform-airflow-webserver-key-change-me"
  metadataConnection:
    user: airflow
    pass: airflow
    host: postgres.default.svc.cluster.local
    port: 5432
    db: airflow

# =============================================================================
# APACHE AIRFLOW (external dependency)
# =============================================================================
airflow:
  enabled: true
  fullnameOverride: "airflow"
  useStandardNaming: true
  executor: "LocalExecutor"
  # Reference pre-created secrets from templates/airflow-secrets.yaml
  fernetKeySecretName: "big-data-platform-fernet-key"
  webserverSecretKeySecretName: "big-data-platform-webserver-secret-key"
  postgresql:
    enabled: false
  data:
    metadataSecretName: "big-data-platform-metadata"
  # Disable the chart's internal Helm-hook migration job.
  # Migrations are handled by templates/airflow-db-migrate.yaml (ArgoCD wave 5).
  # Running both concurrently can cause race conditions under ArgoCD.
  migrateDatabaseJob:
    enabled: false
  images:
    airflow:
      repository: apache/airflow
      tag: "3.2.0"
  dags:
    # Built-in gitSync disabled — replaced by airflow-git-sync sub-chart which
    # uses the custom image (git-sync + mc) and writes to the shared PVC.
    # Airflow reads DAGs from the PVC via persistence below.
    gitSync:
      enabled: false
    persistence:
      enabled: true
      existingClaim: airflow-dags-shared-pvc
      subPath: "repo/dags"
  # Airflow 3.x: DAG processor is a separate component that parses DAGs.
  # LocalDagBundle reads from the same folder git-sync mounts to ($AIRFLOW_HOME/dags).
  dagProcessor:
    enabled: true
    dagBundleConfigList:
      - name: airflow-dags
        classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
        kwargs: {}
  webserver:
    defaultUser:
      enabled: true
      role: Admin
      username: admin
      email: admin@airflow.com
      firstName: Admin
      lastName: User
      password: admin
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1500m"
        memory: "2Gi"
  scheduler:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  logs:
    persistence:
      enabled: true
      storageClassName: openebs-hostpath
      size: 10Gi

  config:
    core:
      parallelism: "64"
      max_active_runs_per_dag: "20"
      max_active_tasks_per_dag: "20"
    database:
      sql_alchemy_pool_size: "15"

# =============================================================================
# AIRFLOW GIT-SYNC (custom sub-chart)
# Uses subhodeep2022/k8s-git-sync:v2-prod (git-sync + mc bundled).
# Writes repo to airflow-dags-shared-pvc at /dags/repo (symlink).
# exechook runs sync-hook.sh → mc mirror /dags/repo myminio/dags (stable paths).
# =============================================================================
airflow-git-sync:
  enabled: true
  image: "subhodeep2022/k8s-git-sync:v2-prod"
  repo: "https://github.com/sp-202/airflow-dags.git"
  branch: "main"
  period: "60s"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# =============================================================================
# HIVE METASTORE (+ HiveServer2) — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
hive-metastore:
  enabled: false  # Replaced by Apache Gravitino IRC (Iceberg REST Catalog)
  replicas: 1
  db:
    user: "hive"
    password: "hive"
    name: "metastore"
  metastore:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  server:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  initContainer:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

# =============================================================================
# APACHE GRAVITINO 1.2.0 — Unified Metadata Lake + Iceberg REST Catalog (IRC)
# GP node — moderate CPU/memory; IRC handles Spark & StarRocks catalog traffic.
#
# Architecture:
#   Port 8090 → Main REST API + Web UI v2 (metalake, catalog, table management)
#   Port 9001 → Iceberg REST Catalog (consumed by Spark SparkCatalog + StarRocks)
#
# Gravitino 1.2.0 bundles Iceberg 1.10.1 — exact parity with Spark image JARs.
# =============================================================================
gravitino:
  enabled: true
  replicas: 1
  image: "apache/gravitino:1.2.0"
  db:
    name: "gravitino"
    user: "postgres"
    password: "password"
  icebergCatalog:
    db:
      name: "iceberg_catalog"
      user: "postgres"
      password: "password"
    warehouse: "s3://warehouse/iceberg/"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# SPARK HISTORY SERVER — Spark node (i4g.8xlarge: 32 vCPU / 256 GB)
# Light read workload; runs on spark node so it can access local NVMe event logs
# =============================================================================
spark-history-server:
  enabled: true
  replicas: 1
  daemonMemory: "2g"
  logDirectory: "s3a://spark-logs/spark-events/"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# SPARK CONNECT SERVER — Spark node (i4g.8xlarge: 32 vCPU / 256 GB)
# Driver runs on spark node; executors dispatched to spark-worker nodes
# =============================================================================
spark-connect-server:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  dynamicAllocation:
    minExecutors: 2
    maxExecutors: 8
  executor:
    # Node targeting is handled by executor-pod-template-cm.yaml via nodeAffinity
    # (OR logic: spark-critical OR spark-spot). nodeSelector removed — it is
    # AND-only and cannot target multiple pools.
    localDir: "/mnt/spark-nvme"
    hostPath: "/mnt/spark-nvme/spark-shuffle"

# =============================================================================
# UNITY CATALOG OSS 0.4.0
# NOTE: unitycatalog/unitycatalog:0.4.0 does not exist on Docker Hub.
# Disabled until a valid image tag is confirmed (check ghcr.io or build custom).
# =============================================================================
unity-catalog:
  enabled: false
  replicas: 1
  db:
    name: "unity_catalog"
    user: "postgres"
    password: "password"
  server:
    image: "unitycatalog/unitycatalog:0.4.0"
    port: 8080
    # S3 bucket name + region are injected dynamically:
    #   Terraform → SSM param → bootstrap script → K8s Secret (unity-catalog-s3)
    # AWS credentials use EC2 instance profile (IAM role) — no static keys needed
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  ui:
    image: "unitycatalog/unitycatalog-ui:0.4.0"
    port: 3000
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# =============================================================================
# KUBE-STARROCKS (external dependency)
# =============================================================================
starrocks:
  enabled: false
  # kube-starrocks is itself an umbrella with two subcharts: operator + starrocks.
  # FE/BE specs live under the "starrocks" subchart key, NOT under starrocksCluster.
  starrocks:
    starrocksCluster:
      name: starrocks-cluster
    starrocksFESpec:
      image:
        repository: starrocks/fe-ubuntu
        tag: "3.3-latest"
      replicas: 1
      # runAsNonRoot must be true (not false) due to a chart v1.9.8 Go-template bug:
      # the helper uses `{{- if .Values.starrocksFESpec.runAsNonRoot -}}` which treats
      # false as falsy and emits empty string → null, failing CRD boolean validation.
      # StarRocks 3.3 ubuntu images support non-root (UID 1000).
      runAsNonRoot: true
      service:
        type: NodePort
        ports:
          - name: query
            containerPort: 9030
            nodePort: 30930
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
    starrocksBeSpec:
      image:
        repository: starrocks/be-ubuntu
        tag: "3.3-latest"
      replicas: 1
      runAsNonRoot: true
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      storageVolumes:
        - name: be-storage
          storageClassName: "openebs-hostpath"
          storageSize: 20Gi

# =============================================================================
# JUPYTERHUB — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
jupyterhub:
  enabled: false
  replicas: 1
  sparkRemote: "sc://spark-connect-server-driver-svc:15002"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"

# =============================================================================
# INGRESS — centralized Traefik ingress rules
# =============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  # Sub-chart dependency flags passed to ingress template
  gravitino:
    enabled: true
  unityCatalog:
    enabled: false

# =============================================================================
# SPARK OPERATOR (external dependency)
# =============================================================================
spark-operator:
  enabled: true
  fullnameOverride: "spark-operator"
  nodeSelector:
    node-role.kubernetes.io/k8s-gp-node: ""
  controller:
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
  webhook:
    enable: true
    nodeSelector:
      node-role.kubernetes.io/k8s-gp-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
  prometheus:
    metrics:
      enable: true
    podMonitor:
      create: false
      labels:
        release: kube-prometheus-stack
  spark:
    jobNamespaces:
      - default
    serviceAccount:
      create: true
      name: "spark-operator-spark"

# =============================================================================
# SUPERSET (external dependency)
# =============================================================================
superset:
  enabled: true
  fullnameOverride: "superset"
  postgresql:
    enabled: false
  redis:
    enabled: false
  nodeSelector:
    node-role.kubernetes.io/k8s-gp-node: ""
  image:
    repository: apachesuperset.docker.scarf.sh/apache/superset
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  initImage:
    repository: apache/superset
    tag: dockerize
    pullPolicy: IfNotPresent
  bootstrapScript: |
    #!/bin/bash
    set -e
    pip install --no-cache-dir \
      starrocks==1.0.6 \
      pymysql \
      psycopg2-binary \
      pyhive \
      thrift \
      sasl \
      thrift-sasl
    if [ ! -f ~/bootstrap ]; then
      touch ~/bootstrap
    fi
  ingress:
    enabled: false
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    connections:
      redis_host: "redis"
      redis_port: "6379"
      redis_user: ""
      redis_cache_db: "1"
      redis_celery_db: "0"
      redis_ssl:
        enabled: false
        ssl_cert_reqs: CERT_NONE
      db_type: "postgresql"
      db_host: "postgres.default.svc.cluster.local"
      db_port: "5432"
      db_user: superset
      db_pass: superset
      db_name: superset
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetCeleryBeat:
    enabled: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  configOverrides:
    secret: |
      SECRET_KEY = 'bigdata-platform-superset-secret-key-change-me'
  init:
    enabled: true
    createAdmin: true
    jobAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@superset.com
      password: "CHANGE_ME_STRONG_PASSWORD"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# =============================================================================
# METRICS SERVER (external dependency - required for Headlamp)
# =============================================================================
metrics-server:
  enabled: true
  fullnameOverride: "metrics-server"
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 60
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 30

# =============================================================================
# KUBE-PROMETHEUS-STACK (external dependency)
# =============================================================================
kube-prometheus-stack:
  enabled: true
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    adminPassword: "admin"
    ingress:
      enabled: false  # Using centralized ingress instead
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: ALL
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # Thanos Query merges this same Prometheus's live data with historical S3
    # data (see charts/thanos) into one endpoint — point Grafana at it too so
    # dashboards keep working across the retention cutoff below without
    # switching datasources.
    additionalDataSources:
      - name: Thanos
        type: prometheus
        access: proxy
        url: http://thanos-query.default.svc.cluster.local:9090
        isDefault: false
  prometheus:
    # IRSA — Thanos sidecar runs as a container inside this same Prometheus
    # pod, so it inherits whatever ServiceAccount the pod uses. The chart
    # auto-creates this SA and already wires it into the Prometheus CR's
    # serviceAccountName; this annotation is the only thing needed for the
    # EKS pod-identity webhook to inject AWS_ROLE_ARN/
    # AWS_WEB_IDENTITY_TOKEN_FILE, which the sidecar's AWS SDK picks up
    # automatically — no access/secret keys anywhere in the objstore config.
    serviceAccount:
      annotations:
        # Literal, not .Values.global.thanosS3RoleArn — raw data handed to
        # the subchart, not a Go template. Keep in sync with global.thanosS3RoleArn
        # above by hand.
        eks.amazonaws.com/role-arn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-thanos-s3-writer"
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      # Was emptyDir (no storageSpec at all) — every pod reschedule (Karpenter
      # consolidation, node replacement, AMI rollout) wiped ALL metrics
      # history. This is a staging/buffer layer, not long-term storage: sized
      # for a handful of completed 2h TSDB blocks plus compaction working
      # space, not multi-day retention — Thanos (below) owns everything
      # beyond that, and is what survives a full Prometheus pod replacement
      # or cluster teardown, since even EBS gets deleted with the cluster.
      storageSpec:
        volumeClaimTemplate:
          spec:
            # Literal, not .Values.global.storageClassNameEbs — this block is
            # raw data handed to the kube-prometheus-stack subchart, not a
            # Go template, so {{ }} would never render here. Keep in sync
            # with global.storageClassNameEbs above by hand.
            storageClassName: "ebs-gp3"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # Short on purpose, and NOT shrinking the 2h TSDB block-duration
      # default to match — the sidecar uploads each completed 2h block well
      # before this window closes, so 6h covers the current in-progress
      # block plus 2-3 already-uploaded ones as safety margin against
      # upload lag, without accumulating real local history (that's what
      # Thanos + S3 are for, not this disk).
      retention: 6h
      externalLabels:
        cluster: k8s-ha-cluster
      # Triggers prometheus-operator to inject a Thanos sidecar container
      # into this same Prometheus pod — uploads blocks to S3 and serves the
      # live-data StoreAPI that Thanos Query (charts/thanos) reads from.
      thanos:
        # Must match charts/thanos's own image tag below — Sidecar, Query,
        # Store Gateway, and Compactor all speak the same gRPC StoreAPI, and
        # mismatched versions across components risk protocol drift.
        image: quay.io/thanos/thanos:v0.42.4
        version: v0.42.4
        objectStorageConfig:
          # existingSecret, not secret — .secret would make this chart render
          # its OWN separate objstore Secret from inline config; existingSecret
          # instead points the sidecar at the one Secret charts/thanos already
          # creates (thanos-objstore-secret), which Store Gateway and
          # Compactor also mount — one objstore config, shared by all three.
          existingSecret:
            key: object-store.yaml
            name: thanos-objstore-secret
  prometheus-node-exporter:
    fullnameOverride: "node-exporter"
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  kube-state-metrics:
    fullnameOverride: "kube-state-metrics"
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# LOKI STACK (external dependency)
# =============================================================================
loki-stack:
  enabled: true
  loki:
    fullnameOverride: "loki"
    isDefault: false
    image:
      repository: grafana/loki
      tag: 2.9.3
    # IRSA — Loki's own dedicated IAM role + S3 bucket (terraform-aws-k8s-ha:
    # observability-irsa.tf), not the shared node role. The chart
    # auto-creates this ServiceAccount and wires it into the StatefulSet
    # already; this annotation is the only thing needed for the EKS
    # pod-identity webhook to inject AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE,
    # which Loki's S3 client picks up automatically — no access/secret keys
    # anywhere in storage_config below.
    serviceAccount:
      annotations:
        # Literal, not .Values.global.lokiS3RoleArn — raw data handed to the
        # subchart, not a Go template. Keep in sync with global.lokiS3RoleArn
        # above by hand.
        eks.amazonaws.com/role-arn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-loki-s3-writer"
    # Loki now ships chunks/index to S3 natively (storage_config below) —
    # this PVC is WAL + not-yet-flushed in-memory chunks only (the ~10m
    # ingester flush window below), not the long-term store. Before this it
    # was emptyDir (no persistence block at all), so every pod reschedule
    # silently dropped even that staging buffer with no error.
    persistence:
      enabled: true
      storageClassName: "ebs-gp3"
      size: 20Gi
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    config:
      # 10m target: flush/upload to S3 often enough to bound how much log
      # data only exists on the EBS WAL/staging buffer at any moment,
      # without generating excessive S3 PUT volume. chunk_target_size
      # (~1.5MB) can still trigger an earlier flush if a stream is busy
      # enough to fill a chunk before either time-based trigger fires.
      ingester:
        chunk_idle_period: 10m
        max_chunk_age: 10m
        chunk_target_size: 1572864
        wal:
          enabled: true
          dir: /data/loki/wal
      # v11/boltdb-shipper/filesystem replaced outright, not layered as a
      # second schema period — this cluster is destroyed/rebuilt per
      # benchmark run (see issues.md), so there's no historical data on the
      # old schema worth preserving continuity for.
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        # Explicit null, not just omitted — Helm deep-merges map values, so
        # without this the chart's own filesystem/boltdb_shipper defaults
        # would still be here, unused but confusing next to the real S3/tsdb
        # config below.
        boltdb_shipper: null
        filesystem: null
        tsdb_shipper:
          active_index_directory: /data/loki/tsdb-shipper-active
          cache_location: /data/loki/tsdb-shipper-cache
        aws:
          s3: s3://k8s-ha-cluster-loki-logs-ap-south-1-419772658418
          region: ap-south-1
      # Loki's own internal compactor (retention/index compaction) is a
      # separate concept from Thanos's Compactor (charts/thanos) — this one
      # still defaulted to shared_store: filesystem, inconsistent with
      # everything else above now pointing at S3.
      compactor:
        working_directory: /data/loki/compactor
        shared_store: s3
  promtail:
    enabled: true
    fullnameOverride: "promtail"
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    config:
      snippets:
        pipelineStages:
          - cri: {}

# =============================================================================
# CLOUDFLARED (local sub-chart) — spread across GP nodes for tunnel HA
# =============================================================================
cloudflared:
  enabled: true
  replicas: 3
  image: "cloudflare/cloudflared:2025.1.0"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# =============================================================================
# HEADLAMP (local sub-chart) — GP node
# =============================================================================
headlamp:
  enabled: true
  replicas: 1
  image: "ghcr.io/headlamp-k8s/headlamp:latest"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# =============================================================================
# MONITORING EXTRAS (local sub-chart)
# =============================================================================
monitoring:
  enabled: true

# =============================================================================
# THANOS (local sub-chart) — S3 long-term storage for Prometheus, see
# charts/thanos for the full explanation of why this exists.
# =============================================================================
thanos:
  enabled: true
  # Must match kube-prometheus-stack.prometheus.prometheusSpec.thanos.image
  # above — Sidecar/Query/Store Gateway/Compactor all speak the same gRPC
  # StoreAPI.
  image: "quay.io/thanos/thanos:v0.42.4"
  # Compactor retention — raw kept a month for detailed shuffle/executor
  # debugging (issues #38-#40 style investigations), then downsampled so a
  # year of history doesn't cost a year of raw-resolution S3 storage.
  retention:
    raw: "30d"
    fiveMin: "90d"
    oneHour: "365d"
  query:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  storeGateway:
    storageSize: "5Gi"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  compactor:
    storageSize: "20Gi"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

# =============================================================================
# NETWORKING EXTRAS (local sub-chart)
# =============================================================================
networking-extras:
  enabled: true
