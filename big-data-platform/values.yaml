# =============================================================================
# big-data-platform — Root values.yaml
# Data Platform as Code (DPaC) on AWS EC2 (ARM64/Graviton)
#
# This single file centralizes 60+ variables that were previously scattered
# across global-config.env and hardcoded in static manifests.
# =============================================================================

# --- Override Helpers ---
nameOverride: ""
fullnameOverride: ""

# The postgres Cluster/Database CRs (charts/postgres, sync-wave -2) need the
# CNPG operator actually running to reconcile them — a CR with no controller
# watching it just sits inert. The cloudnative-pg subchart has no sync-wave
# of its own (defaults to 0, same wave as most other resources), so without
# this it doesn't exist yet when the Cluster/Database CRs are created, and
# the wave -1 hook Jobs (airflow-db-migrate, gravitino-schema-init) that
# need a live Postgres connection retry forever. commonAnnotations pushes
# every resource this subchart creates to the same early wave as
# namespaces.yaml (-3), well before the -2 CRs that depend on it.
cloudnative-pg:
  enabled: true
  # Drops the "big-data-platform-" prefix (matches airflow/redis/postgres).
  # The operator's own webhook Service/ValidatingWebhookConfiguration/
  # MutatingWebhookConfiguration names (cnpg-webhook-service,
  # cnpg-*-webhook-configuration) are fixed by the chart regardless of
  # release name, and nothing else in this repo references the
  # release-prefixed operator name — pure rename.
  fullnameOverride: "cloudnative-pg"
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "-3"
  # A single replica means the admission webhook (cnpg-webhook-service)
  # has exactly one backend serving every Cluster/Database create/update
  # for the whole cluster, synchronously, with a 30s deadline. Webhook
  # requests don't need leader election (only the reconciliation loop
  # does — CNPG's own controller-runtime manager elects a leader
  # independently of webhook serving), so a 2nd replica is pure added
  # capacity/redundancy with no correctness downside. Confirmed live:
  # even with the CPU floor below and the Cilium apiserver-ingress policy
  # fix (networking-extras chart) both in place, ArgoCD's sync still hit
  # intermittent "context deadline exceeded" calling this webhook while
  # the single pod was otherwise idle (3m CPU) — a second replica removes
  # the single-point-of-contention regardless of the exact per-request
  # cause.
  replicaCount: 2
  # The operator ran BestEffort (no requests/limits) by default — zero
  # guaranteed CPU share. It also serves the mutating/validating admission
  # webhooks (cnpg-webhook-service) that every postgresql.cnpg.io Cluster/
  # Database create or update must pass through synchronously with a 30s
  # deadline. Confirmed live: on a node with CPU limits overcommitted to
  # ~120% during a fresh-deploy pod-startup storm, this pod's webhook
  # handler got starved and ArgoCD's sync started failing with
  # "failed calling webhook ... context deadline exceeded" — the exact
  # same CPU-starvation failure class already root-caused and fixed for
  # the EFS CSI driver node plugin (eks-addons.tf, node.resources). Same
  # fix here: a real CPU request gives the scheduler grounds to guarantee
  # this pod a share instead of leaving it BestEffort. Deliberately NO cpu
  # limit — confirmed live elsewhere that a cpu limit on a latency-sensitive
  # pod causes hard CFS throttling mid-request (RST_STREAM/CANCEL for the
  # EFS CSI driver's TLS handshake), the same failure class as this webhook
  # timeout; the request alone already gives a guaranteed floor.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "256Mi"

# --- Namespace Toggles ---
namespaces:
  createDashboard: true

# =============================================================================
# GLOBAL — shared across ALL sub-charts via .Values.global.*
# =============================================================================
global:
  # --- Platform Routing & Domain ---
  domain: "dailyblogstudio.com"
  cfTunnelId: "91e5be1d-3b51-4cac-aebf-d330aafda394"

  # --- Container Images ---
  sparkImage: "subhodeep2022/spark-bigdata:spark-3.5.8-v13-iceberg-gravitino"
  jupyterhubImage: "subhodeep2022/spark-bigdata:jupyterhub-4.0.7-pyspark-scala-sql-prod-v3"
  airflowImage: "apache/airflow:3.2.0"
  gitSyncImage: "subhodeep2022/k8s-git-sync:v2-prod"

  # --- S3 ---
  # No endpoint/accessKey/secretKey — real S3's default endpoint applies, and
  # every workload gets credentials from the node's IAM role instead of
  # static keys. pathStyleAccess/sslEnabled still apply to real S3 (virtual-
  # hosted-style + TLS, the opposite of MinIO's old defaults).
  s3:
    pathStyleAccess: false
    sslEnabled: true

  # --- Node Selectors ---
  # Labels are applied by the node-auto-labeler DaemonSet in the bootstrap script.
  # The auto-labeler reads the `node-role` K8s label set by Terraform on each node
  # and creates node-role.kubernetes.io/<role>=  e.g. spark-node → node-role.kubernetes.io/spark-node
  # sparkWorker/spark-worker removed — that was the static spot-fleet ASG's
  # node-role, deleted along with it in favor of Karpenter. Karpenter's
  # spark-node NodePool covers both spot and on-demand capacity under the
  # same node-role label; spot-vs-on-demand is already distinguishable via
  # Karpenter's own native karpenter.sh/capacity-type label if ever needed,
  # no separate custom node-role required for that.
  #
  # Two always-on tiers (replacing the old single "gp" tier):
  #   core: cluster/platform-control-plane-adjacent services — ArgoCD,
  #     Traefik, CoreDNS, cert-manager, cloudflared, CSI controllers,
  #     Karpenter's own controller, Spark Operator (all wired in Terraform,
  #     not here — see compute-core-node.tf).
  #   data: data/app-plane services — Postgres, Airflow, Gravitino, Redis,
  #     kube-prometheus-stack, Spark History Server.
  # Only core/data/spark are used by local chart templates
  # (.Values.global.nodeSelector.x). Superset/StarRocks don't have entries
  # here — they're external charts with their own top-level nodeSelector
  # value, not something that reads our global.* convention; see the
  # superset/starrocks blocks below instead (their fallback, while their own
  # dedicated node groups are disabled, is the core tier).
  nodeSelector:
    core:
      node-role.kubernetes.io/core-node: ""
    data:
      node-role.kubernetes.io/data-node: ""
    spark:
      node-role.kubernetes.io/spark-node: ""


  # --- Storage ---
  storageClassName: "openebs-hostpath"
  # Network-attached EBS (terraform-aws-k8s-ha: kubernetes_storage_class.ebs_gp3)
  # — for the handful of things that must survive node replacement/Karpenter
  # consolidation, unlike openebs-hostpath above which is tied to one node's
  # local disk. Used by Prometheus/Thanos/Loki below, not the general default,
  # since it costs real EBS $/GB-month vs. hostpath's free local disk.
  storageClassNameEbs: "ebs-gp3"

  # --- AWS Lakehouse S3 bucket (terraform-aws-k8s-ha: storage-s3-lakehouse.tf) ---
  # The specific, named lakehouse bucket — global.s3 above is generic
  # pathStyle/SSL connection settings shared by whatever S3 endpoint a given
  # workload resolves to, not a bucket name itself. This cluster is
  # destroyed and rebuilt per benchmark run (see issues.md), so anything
  # that needs to survive a full teardown (Thanos's Prometheus history) has
  # to live in this externally-managed bucket, not on any node-local
  # OpenEBS-hostpath PV. Every other workload that touches this bucket gets
  # credentials from the node's instance-profile role via IMDS
  # (aws_iam_policy.lakehouse_s3, granted on the whole bucket) — Thanos is
  # the one exception, see thanosS3RoleArn below.
  awsLakehouse:
    bucket: "k8s-ha-cluster-lakehouse-ap-south-1-419772658418"
    region: "ap-south-1"

  # --- IRSA S3 roles (terraform-aws-k8s-ha: observability-irsa.tf) ---
  # Thanos and Loki don't use the blanket node-role/IMDS pattern above —
  # each gets its own IAM role, trusted only by its specific K8s
  # ServiceAccount (via the OIDC provider already set up for Karpenter's
  # own IRSA), scoped to only the S3 paths that one workload needs. Role
  # ARNs are deterministic (IAM ARNs have no random suffix, unlike S3
  # bucket names), so — like awsLakehouse.bucket above — they're hardcoded
  # here rather than injected from Terraform at deploy time.
  thanosS3RoleArn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-thanos-s3-writer"
  lokiS3RoleArn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-loki-s3-writer"

  # --- Loki's own dedicated S3 bucket (terraform-aws-k8s-ha:
  # observability-irsa.tf: aws_s3_bucket.loki_logs) — NOT a prefix inside
  # awsLakehouse.bucket like Thanos gets. Loki's storage_config.aws S3
  # client treats the whole configured bucket as its flat storage root; it
  # has no bucket-internal prefix option the way Thanos's objstore config
  # does, so sharing the lakehouse bucket would mean Loki owns the entire
  # thing. A small dedicated bucket keeps it out of the lakehouse
  # namespace instead.
  awsLoki:
    bucket: "k8s-ha-cluster-loki-logs-ap-south-1-419772658418"
    region: "ap-south-1"

  # --- PostgreSQL Connection (shared by Airflow, Superset, Gravitino) ---
  # host is CNPG's primary read-write service ("<cluster-name>-rw"), not a
  # plain Service named "postgres" — see charts/postgres/templates/cluster.yaml.
  # No password here: the superuser password lives in the postgres-superuser
  # Secret (pre-created out-of-band by post-cluster-bootstrap.sh) and is
  # referenced directly by name wherever it's needed, never as a Helm value.
  postgres:
    host: "postgres-rw.default.svc.cluster.local"
    port: 5432
    user: "postgres"
    database: "postgres"

  # --- Apache Gravitino — Iceberg REST Catalog & unified metadata lake ---
  # Sole metadata catalog now — Hive Metastore and Unity Catalog removed.
  gravitino:
    metalake: "enterprise_metalake"
    catalog: "sales_catalog"
    extraCatalogs:
      - "raw_catalog"
    # Iceberg REST Catalog endpoint consumed by StarRocks (direct IRC access).
    icebergRestUri: "http://gravitino.default.svc.cluster.local:9001/iceberg/"
    # Main API endpoint — used by GravitinoSparkPlugin for catalog discovery
    apiUri: "http://gravitino.default.svc.cluster.local:8090"

# =============================================================================
# PERSISTENCE — PV/PVC definitions
# =============================================================================
persistence:
  enabled: true
  # postgres no longer has a static local-hostpath PV/PVC here — see
  # postgres.persistence below (StatefulSet volumeClaimTemplates on ebs-gp3).
  # minio removed entirely — replaced by S3 (lakehouse-s3 Secret).
  # DAGs PVC is dynamically provisioned on efs-airflow-dags now (RWX) —
  # only .size is still read (see charts/persistence/templates/volumes.yaml).
  airflow:
    size: 5Gi
  # Scheduler/triggerer logs no longer need static PVs — they're on ebs-gp3
  # via airflow.logs.persistence.storageClassName, dynamically provisioned
  # by the official chart's own StatefulSet volumeClaimTemplates.
  # Coupled to starrocks.starrocks.starrocksFESpec/BeSpec.nodeSelector below
  # in the actual chart values — the PV's nodeAffinity must always match
  # wherever the pod is actually scheduled, or the PVC never binds. Flip
  # both together if you ever move StarRocks to its dedicated node group.
  starrocksFe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-fe"
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
  starrocksBe:
    size: 10Gi
    localPath: "/mnt/spark-nvme/starrocks-be"
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
  redis:
    size: 8Gi
    localPath: "/var/openebs/local/redis-data"
    nodeSelector:
      node-role.kubernetes.io/data-node: ""

# =============================================================================
# POSTGRES — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# CloudNativePG Cluster CR (charts/postgres/templates/cluster.yaml) on
# ebs-gp3 (network-attached, survives node replacement/pod reschedule).
# image MUST be a CNPG-published postgresql image, not the plain Docker Hub
# `postgres` image — CNPG's initdb/instance-manager expects that image's
# specific UID/filesystem layout. Using vanilla `postgres:16` fails every
# single initdb attempt with "could not look up effective user ID 26: user
# does not exist". Confirmed live.
# =============================================================================
postgres:
  enabled: true
  replicas: 3
  image: "ghcr.io/cloudnative-pg/postgresql:16"
  persistence:
    storageClassName: "ebs-gp3"
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# REDIS — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
redis:
  enabled: true
  replicas: 1
  image: "redis:7.2-alpine"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# MinIO removed entirely — replaced by S3 (one "lakehouse" bucket with
# prefixes instead of MinIO's separate warehouse/spark-logs/notebooks/
# airflow/delta-tables buckets; S3 prefixes don't need explicit creation).

# =============================================================================
# APACHE AIRFLOW (external dependency)
# =============================================================================
airflow:
  enabled: true
  fullnameOverride: "airflow"
  useStandardNaming: true
  executor: "LocalExecutor"
  # airflow-credentials is pre-created out-of-band by post-cluster-bootstrap.sh
  # (never in git) — one Secret referenced three times, each setting reading
  # its own key (fernet-key / webserver-secret-key / connection), matching
  # what the official chart expects for each of these three settings.
  fernetKeySecretName: "airflow-credentials"
  webserverSecretKeySecretName: "airflow-credentials"
  postgresql:
    enabled: false
  data:
    metadataSecretName: "airflow-credentials"
  # Disable the chart's internal Helm-hook migration job.
  # Migrations are handled by templates/airflow-db-migrate.yaml (ArgoCD wave 5).
  # Running both concurrently can cause race conditions under ArgoCD.
  migrateDatabaseJob:
    enabled: false
  # Disable the chart's own admin-user creation job too — it defaults to
  # enabled:true and would race templates/airflow-db-migrate.yaml, which
  # creates the same "admin" user with the real (secret-sourced) password.
  # Whichever job happened to run first was silently deciding the actual
  # login password — this was a real, live bug, not just redundancy.
  #
  # createUserJob.enabled here does NOT actually control this — the
  # chart's own helper (templates/_helpers.yaml, createUserJob.isEnabled)
  # checks webserver.defaultUser.enabled FIRST and only falls back to
  # createUserJob.enabled when webserver.defaultUser is unset entirely:
  #   {{- if .Values.webserver.defaultUser -}}
  #     {{- .Values.webserver.defaultUser.enabled -}}
  #   {{- else -}}
  #     {{- .Values.createUserJob.enabled -}}
  #   {{- end -}}
  # Since webserver.defaultUser (below) IS set — it has to be, for
  # airflow-db-migrate.yaml to read its username/role/email — this
  # setting was silently dead code the whole time and the chart's own
  # airflow-create-user Job kept running anyway. Confirmed live: it
  # crash-looped with the exact same empty-ADMIN_PASSWORD race as
  # airflow-db-migrate.yaml (its own default password is a hardcoded
  # "admin", never wired to the real secret, so even a successful run
  # would have set the WRONG password). The real, effective switch is
  # webserver.defaultUser.enabled below — left false there instead.
  createUserJob:
    enabled: false
  images:
    airflow:
      repository: apache/airflow
      tag: "3.2.0"
  dags:
    # Built-in gitSync disabled — replaced by airflow-git-sync sub-chart which
    # uses the custom image (git-sync + mc) and writes to the shared PVC.
    # Airflow reads DAGs from the PVC via persistence below.
    gitSync:
      enabled: false
    persistence:
      enabled: true
      existingClaim: airflow-dags-shared-pvc
      subPath: "repo/dags"
  # Airflow 3.x: DAG processor is a separate component that parses DAGs.
  # LocalDagBundle reads from the same folder git-sync mounts to ($AIRFLOW_HOME/dags).
  dagProcessor:
    enabled: true
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    dagBundleConfigList:
      - name: airflow-dags
        classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
        kwargs: {}
  # Airflow 3.x's actual UI/API-serving Deployment — this is what
  # ingress.yaml's {{ .Release.Name }}-api-server backend actually points
  # at, not webserver below (kept for chart compat, may be otherwise unused
  # in 3.x — not touched further here, out of scope for the node-tier split).
  apiServer:
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
  triggerer:
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
  webserver:
    defaultUser:
      # This is the flag that actually disables the chart's own
      # airflow-create-user Job (see createUserJob comment above) — the
      # username/role/email/name fields below stay set regardless, since
      # airflow-db-migrate.yaml still reads them for its own user-create
      # call. Only .enabled controls whether the CHART creates its own
      # competing Job.
      enabled: false
      role: Admin
      username: admin
      email: admin@airflow.com
      firstName: Admin
      lastName: User
      # No password here — templates/airflow-db-migrate.yaml sources it from
      # the airflow-credentials Secret's admin-password key via env var.
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1500m"
        memory: "2Gi"
  scheduler:
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  logs:
    persistence:
      enabled: true
      # The official chart's logs PVC uses accessMode ReadWriteMany by
      # default (scheduler/api-server/triggerer/dag-processor all need to
      # read/write the SAME log files concurrently, and they can land on
      # different data-nodes) — ebs-gp3 is EBS block storage, which cannot
      # satisfy RWX at all (EBS only supports RWO/ReadOnlyMany). Needs an
      # actual network filesystem — reusing the same EFS storage class
      # provisioned for airflow-dags. EFS-backed mounts were intermittently
      # timing out in this environment (access-point mounts REQUIRE TLS,
      # and that handshake kept exceeding the CSI driver's default 15s
      # budget) — fixed at the source in eks-addons.tf
      # (aws_eks_addon.efs_csi_driver's node.efsUtilsConfOverrides), not by
      # avoiding EFS.
      storageClassName: efs-airflow-dags
      size: 10Gi

  config:
    core:
      parallelism: "64"
      max_active_runs_per_dag: "20"
      max_active_tasks_per_dag: "20"
      # Airflow 3.1.0 switched the DEFAULT auth manager from FAB to the new
      # "Simple Auth Manager" (dev/test only — generates random per-user
      # passwords to a local file inside the pod, no support for a known
      # admin/password the way this stack is built around). This entire
      # deployment assumes FAB: templates/airflow-db-migrate.yaml runs
      # `airflow users create --password "$ADMIN_PASSWORD"` (a FAB-only
      # CLI command) with a password sourced from the airflow-credentials
      # Secret, and webserver.defaultUser (below) is FAB's own config
      # shape. Without this, `airflow users create` fails with
      # "AttributeError: 'AirflowSecurityManagerV2' object has no
      # attribute 'find_role'" — the FAB provider is still bundled in the
      # image, just no longer the default. Confirmed live.
      auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    database:
      sql_alchemy_pool_size: "15"

# =============================================================================
# AIRFLOW GIT-SYNC (custom sub-chart)
# Uses subhodeep2022/k8s-git-sync:v2-prod, writing the repo to
# airflow-dags-shared-pvc at /dags/repo (symlink) — its only job now. A
# separate s3-sync sidecar (official amazon/aws-cli image, IAM-role auth)
# mirrors /dags/repo to S3, replacing the image's own mc-based exechook.
# =============================================================================
airflow-git-sync:
  enabled: true
  image: "subhodeep2022/k8s-git-sync:v2-prod"
  repo: "https://github.com/sp-202/airflow-dags.git"
  branch: "main"
  period: "60s"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# =============================================================================
# APACHE GRAVITINO 1.2.0 — Unified Metadata Lake + Iceberg REST Catalog (IRC)
# GP node — moderate CPU/memory; IRC handles Spark & StarRocks catalog traffic.
#
# Architecture:
#   Port 8090 → Main REST API + Web UI v2 (metalake, catalog, table management)
#   Port 9001 → Iceberg REST Catalog (consumed by Spark SparkCatalog + StarRocks)
#
# Gravitino 1.2.0 bundles Iceberg 1.10.1 — exact parity with Spark image JARs.
# =============================================================================
gravitino:
  enabled: true
  # Drops the "big-data-platform-" prefix from the Deployment/pod name
  # (matches airflow/redis/postgres). The chart's own Service is already
  # named "gravitino" regardless of release name — verified via `helm
  # template` that this override doesn't change it, so the ingress backend
  # reference (charts/ingress/templates/ingress.yaml) needs no update.
  fullnameOverride: "gravitino"
  replicas: 1
  image:
    repository: apache/gravitino
    tag: "1.3.0"
  # Matches .Values.global.nodeSelector.data used elsewhere — this chart's
  # values.yaml is separate (external dependency), so it's repeated literally
  # rather than templated (values.yaml itself is plain data, not Go-templated).
  nodeSelector:
    node-role.kubernetes.io/data-node: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  # entity.jdbcPassword is NOT set here — the official chart renders it as
  # plaintext into a ConfigMap (SKIP_CONFIG_REWRITE=true disables the
  # env-var-override mechanism our old custom chart relied on), so it can't
  # use a Secret reference at all. The real value is injected by
  # post-cluster-bootstrap.sh as an ArgoCD Application-level Helm parameter
  # (gravitino.entity.jdbcPassword) instead — never touches this file/git.
  entity:
    jdbcUrl: "jdbc:postgresql://postgres-rw.default.svc.cluster.local:5432/gravitino?currentSchema=public"
    jdbcDriver: "org.postgresql.Driver"
    jdbcUser: "gravitino"
  auxService:
    names: iceberg-rest
  icebergRest:
    httpPort: 9001
    # dynamic-config-provider: IRC delegates catalog lookup to the Core
    # Server (8090) instead of managing its own static/memory catalog —
    # same mode the old custom chart used, needed so Spark-created tables
    # show up in the Gravitino Web UI. icebergRest.warehouse/jdbc.* are
    # irrelevant in this mode (only used for static/jdbc catalog backends).
    catalogConfigProvider: dynamic-config-provider
    dynamicConfigProvider:
      uri: "http://localhost:8090"
      metalake: "enterprise_metalake"
    ioImpl: "org.apache.iceberg.aws.s3.S3FileIO"
    # No s3.accessKeyId/secretAccessKey/endpoint/pathStyleAccess — omitting
    # them makes Iceberg's S3FileIO fall back to the AWS SDK's default
    # credential chain (the node's IAM role) and real S3's default
    # virtual-hosted-style endpoint. Only region needs to be explicit.
    s3:
      region: "us-east-1"
  # icebergCatalog is this platform's own key (read by templates/gravitino-init.yaml
  # and templates/gravitino-schema-init.yaml), not part of the official chart's
  # schema — the catalog's own JDBC backend DB, name/user are safe as plain
  # values; warehouse (real S3 bucket path) and password are both injected via
  # ArgoCD helm.parameters at deploy time (bucket name is only known after
  # `terraform apply`, so it can't be hardcoded here either).
  icebergCatalog:
    db:
      name: "iceberg_catalog"
      user: "gravitino"

# =============================================================================
# SPARK HISTORY SERVER — Spark node (i4g.8xlarge: 32 vCPU / 256 GB)
# Light read workload; runs on spark node so it can access local NVMe event logs
# =============================================================================
spark-history-server:
  enabled: true
  replicas: 1
  daemonMemory: "2g"
  # logDirectory is no longer a value here — the real bucket name (only known
  # after `terraform apply`) is read from the lakehouse-s3 Secret directly in
  # charts/spark-history-server/templates/deployment.yaml.
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# =============================================================================
# SPARK CONNECT SERVER — Spark node (Karpenter-managed, c7gd/m7gd/r7gd)
# Driver and executors both land on Karpenter's spark-node NodePool.
# =============================================================================
spark-connect-server:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  dynamicAllocation:
    minExecutors: 2
    maxExecutors: 8
  executor:
    # Executor node targeting is handled by executor-pod-template-cm.yaml's
    # nodeAffinity (single spark-node pool now) rather than nodeSelector here.
    localDir: "/mnt/spark-nvme"
    hostPath: "/mnt/spark-nvme/spark-shuffle"

# =============================================================================
# KUBE-STARROCKS (external dependency)
# =============================================================================
starrocks:
  enabled: false
  # kube-starrocks is itself an umbrella with two subcharts: operator + starrocks.
  # FE/BE specs live under the "starrocks" subchart key, NOT under starrocksCluster.
  starrocks:
    starrocksCluster:
      name: starrocks-cluster
    starrocksFESpec:
      image:
        repository: starrocks/fe-ubuntu
        tag: "3.3-latest"
      replicas: 1
      # runAsNonRoot must be true (not false) due to a chart v1.9.8 Go-template bug:
      # the helper uses `{{- if .Values.starrocksFESpec.runAsNonRoot -}}` which treats
      # false as falsy and emits empty string → null, failing CRD boolean validation.
      # StarRocks 3.3 ubuntu images support non-root (UID 1000).
      runAsNonRoot: true
      # Defaults to the GP node — matches where its PV is currently pinned
      # (persistence.starrocksFe.nodeSelector below). To actually move FE to
      # the dedicated starrocks-node (terraform-aws-k8s-ha's
      # compute-starrocks.tf, enable_starrocks_nodegroup): flip BOTH this
      # value AND persistence.starrocksFe.nodeSelector together, or the PVC
      # won't bind (nodeAffinity would point at a different node than the
      # pod is scheduled on). Manual, not automatic — see conversation
      # history for why an ArgoCD helm.parameters toggle doesn't work
      # cleanly here (nodeSelector is a map; overriding one key adds an AND
      # condition instead of replacing it).
      nodeSelector:
        node-role.kubernetes.io/core-node: ""
      service:
        type: NodePort
        ports:
          - name: query
            containerPort: 9030
            nodePort: 30930
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
    starrocksBeSpec:
      image:
        repository: starrocks/be-ubuntu
        tag: "3.3-latest"
      replicas: 1
      runAsNonRoot: true
      # Same coupling as starrocksFESpec above — flip together with
      # persistence.starrocksBe.nodeSelector.
      nodeSelector:
        node-role.kubernetes.io/core-node: ""
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      storageVolumes:
        - name: be-storage
          storageClassName: "openebs-hostpath"
          storageSize: 20Gi

# =============================================================================
# JUPYTERHUB — GP node (im4gn.4xlarge: 16 vCPU / 64 GB)
# =============================================================================
jupyterhub:
  enabled: false
  replicas: 1
  sparkRemote: "sc://spark-connect-server-driver-svc:15002"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"

# =============================================================================
# INGRESS — centralized Traefik ingress rules
# =============================================================================
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  # Sub-chart dependency flags passed to ingress template.
  # NOTE: the ingress chart can't see sibling subcharts' own .enabled values
  # (Helm only auto-shares .Values.global.* across subcharts) — these are
  # separate, manually-duplicated flags. If you flip the real superset.enabled
  # / gravitino.enabled / jupyterhub.enabled / spark-connect-server.enabled
  # above, flip the matching one here too, or the ingress rule and the
  # actual Service will disagree.
  gravitino:
    enabled: true
  superset:
    enabled: false
  jupyterhub:
    enabled: false
  spark-connect-server:
    enabled: false

# =============================================================================
# SPARK OPERATOR (external dependency)
# =============================================================================
spark-operator:
  enabled: true
  fullnameOverride: "spark-operator"
  # Top-level nodeSelector is a no-op here — the chart's controller
  # Deployment actually reads .Values.controller.nodeSelector (confirmed by
  # inspecting templates/controller/deployment.yaml), not a top-level key.
  controller:
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    # Ran BestEffort by default (confirmed live: {} resources on the real
    # Deployment) — same CPU-starvation class already root-caused and
    # fixed for cloudnative-pg and the EFS CSI driver node plugin this
    # session. This one is worse than most: the chart's own values.yaml
    # comment (spark-operator/values.yaml ~line 200) explicitly warns
    # "each job submission will spawn a JVM within the controller pods
    # using java -Xmx128m. Kubernetes may kill these Java processes at
    # will to enforce resource limits... you will see 'failed to run
    # spark-submit for SparkApplication [...]: signal: killed'" — under
    # BestEffort that spawned JVM has zero guaranteed memory floor, and
    # this is a single shared controller submitting every SparkApplication
    # cluster-wide, not a per-job pod. CPU request only (no limit — same
    # CFS-throttling reasoning as cloudnative-pg/EFS CSI); memory gets
    # both, since the chart's own docs identify memory pressure as the
    # actual failure mode here, and unlike CPU, a memory limit is the
    # correct tool for capping a runaway/leaking JVM rather than something
    # that hurts a healthy one.
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
  webhook:
    enable: true
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    # Lighter than the controller — this pod only validates/mutates
    # SparkApplication objects, it doesn't spawn per-submission JVMs.
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
  prometheus:
    metrics:
      enable: true
    podMonitor:
      create: false
      labels:
        release: kube-prometheus-stack
  spark:
    jobNamespaces:
      - default
    serviceAccount:
      create: true
      name: "spark-operator-spark"

# =============================================================================
# SUPERSET (external dependency)
# =============================================================================
superset:
  enabled: false
  fullnameOverride: "superset"
  postgresql:
    enabled: false
  redis:
    enabled: false
  # Defaults to the GP node — safe when enable_superset_nodegroup is false
  # (the default), since that's the only node this could possibly schedule
  # on. post-cluster-bootstrap.sh overrides this to superset-node via an
  # ArgoCD helm.parameters entry (same mechanism as Gravitino's password —
  # see argocd-app.sh) ONLY when enable_superset_nodegroup=true, so it's
  # automatically correct either way without hand-editing this file.
  nodeSelector:
    node-role.kubernetes.io/core-node: ""
  image:
    repository: apachesuperset.docker.scarf.sh/apache/superset
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  initImage:
    repository: apache/superset
    tag: dockerize
    pullPolicy: IfNotPresent
  bootstrapScript: |
    #!/bin/bash
    set -e
    pip install --no-cache-dir \
      starrocks==1.0.6 \
      pymysql \
      psycopg2-binary \
      pyhive \
      thrift \
      sasl \
      thrift-sasl
    if [ ! -f ~/bootstrap ]; then
      touch ~/bootstrap
    fi
  ingress:
    enabled: false
  # Secrets injected as raw env vars (valueFrom.secretKeyRef) — reach every
  # Superset pod including the init Job, per the chart's own template wiring.
  # See configOverrides below for how DB_PASS/SUPERSET_SECRET_KEY get used,
  # and init.initscript for ADMIN_PASSWORD.
  extraEnvRaw:
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: db-password
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: secret-key
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: superset-credentials
          key: admin-password
  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    connections:
      redis_host: "redis"
      redis_port: "6379"
      redis_user: ""
      redis_cache_db: "1"
      redis_celery_db: "0"
      redis_ssl:
        enabled: false
        ssl_cert_reqs: CERT_NONE
      db_type: "postgresql"
      db_host: "postgres-rw.default.svc.cluster.local"
      db_port: "5432"
      db_user: superset
      # Not the real password — configOverrides.database below replaces
      # SQLALCHEMY_DATABASE_URI using $DB_PASS from superset-credentials.
      db_pass: "unused-see-configOverrides-database"
      db_name: superset
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  supersetCeleryBeat:
    enabled: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  # Appended to the end of superset_config.py (chart's own default assignments
  # run first, these overwrite them) — real values come from extraEnvRaw above,
  # never from a literal here.
  configOverrides:
    secret: |
      import os
      SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
    database: |
      import os
      SQLALCHEMY_DATABASE_URI = (
          f"postgresql+psycopg2://superset:{os.environ['DB_PASS']}"
          f"@postgres-rw.default.svc.cluster.local:5432/superset"
      )
  init:
    enabled: true
    createAdmin: true
    jobAnnotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    adminUser:
      username: admin
      firstname: Superset
      lastname: Admin
      email: admin@superset.com
      # No password here — initscript override below reads $ADMIN_PASSWORD
      # instead of interpolating .Values.init.adminUser.password directly
      # (the chart's default initscript does the latter, which would put
      # the real password in this file).
    # Same as the chart's default init.initscript (see apache-superset/superset
    # templates/secret-superset-config.yaml), except the create-admin line
    # uses "$ADMIN_PASSWORD" (shell env, from extraEnvRaw) instead of a
    # Helm-templated literal.
    initscript: |-
      #!/bin/sh
      set -eu
      echo "Upgrading DB schema..."
      superset db upgrade
      echo "Initializing roles..."
      superset init
      {{ if .Values.init.createAdmin }}
      echo "Creating admin user..."
      superset fab create-admin \
                      --username {{ .Values.init.adminUser.username }} \
                      --firstname {{ .Values.init.adminUser.firstname }} \
                      --lastname {{ .Values.init.adminUser.lastname }} \
                      --email {{ .Values.init.adminUser.email }} \
                      --password "$ADMIN_PASSWORD" \
                      || true
      {{- end }}
      {{ if .Values.init.loadExamples }}
      echo "Loading examples..."
      superset load_examples
      {{- end }}
      if [ -f "{{ .Values.extraConfigMountPath }}/import_datasources.yaml" ]; then
        echo "Importing database connections.... "
        superset import_datasources -p {{ .Values.extraConfigMountPath }}/import_datasources.yaml
      fi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# =============================================================================
# METRICS SERVER (external dependency - required for Headlamp)
# =============================================================================
metrics-server:
  enabled: true
  fullnameOverride: "metrics-server"
  nodeSelector:
    node-role.kubernetes.io/core-node: ""
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 60
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 20
    initialDelaySeconds: 30

# =============================================================================
# CERT-MANAGER (external dependency)
# Only consumer today is kube-prometheus-stack's Prometheus Operator admission
# webhook (below) — generates a self-signed CA for it instead of the chart's
# own create/patch Jobs, which ArgoCD can't manage safely (see comment there).
# =============================================================================
cert-manager:
  enabled: true
  # Drops the "big-data-platform-" prefix from every resource this subchart
  # creates (matches the pattern airflow/redis/postgres already use). No
  # other file references this chart's release-prefixed name, so this is a
  # pure rename — nothing else needs updating to match.
  fullnameOverride: "cert-manager"
  crds:
    enabled: true
  nodeSelector:
    node-role.kubernetes.io/core-node: ""
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  webhook:
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  cainjector:
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# KUBE-PROMETHEUS-STACK (external dependency)
# =============================================================================
kube-prometheus-stack:
  enabled: true
  # Drops the "big-data-platform-" prefix (matches airflow/redis/postgres) —
  # also replaces the cryptic auto-truncated "kube-pro" name (Helm's own
  # 63-char fullname truncation, since "big-data-platform-kube-prometheus-
  # stack-operator" was too long) with the real chart name. Verified via
  # `helm template` that the prometheus Service becomes
  # "kube-prometheus-stack-prometheus" — updated the ingress backend
  # (charts/ingress/templates/ingress.yaml) to match, same fix pattern as
  # the airflow ingress bug.
  fullnameOverride: "kube-prometheus-stack"
  prometheusOperator:
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    admissionWebhooks:
      # Without this, the chart renders its own admission-create/-patch Jobs
      # (helm.sh/hook annotations, meaningless to ArgoCD's `helm template`
      # rendering) as permanent resources. Kubernetes Jobs are immutable, so
      # every ArgoCD resync fails to reapply them — this was the actual cause
      # of the "stuck Progressing/OutOfSync" loop. cert-manager (below)
      # generates the webhook CA instead; the chart's own condition
      # (see admission-webhooks/job-patch/job-createSecret.yaml) automatically
      # skips rendering those Jobs when this is true.
      certManager:
        enabled: true
  grafana:
    enabled: true
    fullnameOverride: "grafana"
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    admin:
      existingSecret: "grafana-credentials"
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: false  # Using centralized ingress instead
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: ALL
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # Thanos Query merges this same Prometheus's live data with historical S3
    # data (see charts/thanos) into one endpoint — point Grafana at it too so
    # dashboards keep working across the retention cutoff below without
    # switching datasources.
    additionalDataSources:
      - name: Thanos
        type: prometheus
        access: proxy
        url: http://thanos-query.default.svc.cluster.local:9090
        isDefault: false
  alertmanager:
    alertmanagerSpec:
      nodeSelector:
        node-role.kubernetes.io/data-node: ""
  prometheus:
    # IRSA — Thanos sidecar runs as a container inside this same Prometheus
    # pod, so it inherits whatever ServiceAccount the pod uses. The chart
    # auto-creates this SA and already wires it into the Prometheus CR's
    # serviceAccountName; this annotation is the only thing needed for the
    # EKS pod-identity webhook to inject AWS_ROLE_ARN/
    # AWS_WEB_IDENTITY_TOKEN_FILE, which the sidecar's AWS SDK picks up
    # automatically — no access/secret keys anywhere in the objstore config.
    serviceAccount:
      annotations:
        # Literal, not .Values.global.thanosS3RoleArn — raw data handed to
        # the subchart, not a Go template. Keep in sync with global.thanosS3RoleArn
        # above by hand.
        eks.amazonaws.com/role-arn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-thanos-s3-writer"
    prometheusSpec:
      # 2 independent replicas, each with its own StatefulSet-provisioned
      # ebs-gp3 PVC (storageSpec below) and its own Thanos sidecar — no
      # shared state, no ring, just two Prometheuses scraping the same
      # targets so one dying doesn't drop metrics collection. Automatically
      # gets a distinguishing "prometheus_replica" external label from
      # prometheus-operator (spec.replicaExternalLabelName's default) —
      # that's what charts/thanos's --query.replica-label flag uses to
      # deduplicate the two replicas' otherwise-identical series back down
      # to one, instead of Grafana showing everything doubled.
      replicas: 2
      # "hard": with exactly 2 data-nodes (data_node_count, a fixed count —
      # not a min/max range), this guarantees one replica per node instead
      # of merely preferring it — the whole point of doing this is
      # surviving a single node loss, which "soft" doesn't actually
      # guarantee. Tradeoff: if a data-node is ever down and not yet
      # replaced, the second replica stays Pending rather than doubling up
      # on the remaining node — accepted, since a doubled-up pair defeats
      # the purpose being solved here anyway.
      podAntiAffinity: "hard"
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      nodeSelector:
        node-role.kubernetes.io/data-node: ""
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      # Enables POST /api/v1/admin/tsdb/snapshot, which is the ONLY way to get
      # the current head into S3 on demand. This matters because the cluster
      # is destroyed ~10-20 min after a benchmark finishes, and the sidecar
      # can only ship SEALED blocks: Prometheus seals its first one about 3h
      # in and every 2h after, so a benchmark run plus teardown inside that
      # window uploads absolutely nothing. Verified on this cluster —
      # prometheus_tsdb_blocks_loaded 0, thanos.shipper.json "uploaded": null,
      # 1.8h after start.
      #
      # Shortening the block duration is NOT an option here, which is worth
      # recording so nobody burns time on it: prometheus-operator manages
      # those two flags itself whenever spec.thanos is set and rejects any
      # attempt to override them via additionalArgs, erroring the whole
      # StatefulSet reconcile with
      #
      #   can't set arguments which are already managed by the operator:
      #   storage.tsdb.min-block-duration,storage.tsdb.max-block-duration
      #
      # (confirmed live against operator v0.71.2, then reverted).
      #
      # PRE-TEARDOWN PROCEDURE — run before destroying the cluster:
      #   P=prometheus-kube-prometheus-stack-prometheus-0
      #   kubectl exec -n default $P -c prometheus -- \
      #     wget -qO- --post-data='' \
      #     'http://127.0.0.1:9090/api/v1/admin/tsdb/snapshot?skip_head=false'
      #   # then move the snapshot's block dirs into the TSDB root so the
      #   # sidecar's shipper sees them as ordinary blocks:
      #   kubectl exec -n default $P -c prometheus -- sh -c \
      #     'mv /prometheus/snapshots/*/[0-9A-Z]* /prometheus/'
      #   # sidecar rescans every 30s; confirm before teardown:
      #   aws s3 ls s3://<lakehouse>/thanos/ --recursive
      #
      # skip_head=false is the whole point — it materialises the in-memory
      # head as a real block, which is exactly the data a benchmark run
      # produces and would otherwise lose.
      enableAdminAPI: true
      # Was emptyDir (no storageSpec at all) — every pod reschedule (Karpenter
      # consolidation, node replacement, AMI rollout) wiped ALL metrics
      # history. This is a staging/buffer layer, not long-term storage: sized
      # for a handful of completed 2h TSDB blocks plus compaction working
      # space, not multi-day retention — Thanos (below) owns everything
      # beyond that, and is what survives a full Prometheus pod replacement
      # or cluster teardown, since even EBS gets deleted with the cluster.
      storageSpec:
        volumeClaimTemplate:
          spec:
            # Literal, not .Values.global.storageClassNameEbs — this block is
            # raw data handed to the kube-prometheus-stack subchart, not a
            # Go template, so {{ }} would never render here. Keep in sync
            # with global.storageClassNameEbs above by hand.
            storageClassName: "ebs-gp3"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # Still a staging buffer, NOT long-term history (Thanos + S3 own that),
      # and still NOT shrinking the 2h TSDB block duration to match — see the
      # thanos block below for the cost trade-off behind keeping 2h.
      #
      # Upstream recommends retention >= 3x the block duration (so >= 6h),
      # which is where the previous 6h came from — it was the documented
      # floor, not an arbitrary pick. 24h keeps that floor and adds margin.
      #
      # Widened 6h -> 24h. This is a safety margin against a SILENTLY BROKEN
      # sidecar, not against upload lag, and 6h was too short for that job: a
      # bad objstore config uploads nothing while looking perfectly healthy,
      # and this cluster shipped exactly that bug (prefix nested inside the S3
      # config block — compactor and store-gateway crash-looped, and the
      # sidecar would have silently written nothing). Anything past the
      # retention window when the mistake is found is gone permanently.
      #
      # Costs almost nothing here. Measured on this cluster: 5,030 samples/s
      # over 156k head series, ~2 bytes/sample compressed => ~870 MB/day,
      # against a 50Gi volume sitting at 0% used (85 MB after the first hour).
      # 24h is under 2% of the disk; 6h saved ~650 MB and bought one working
      # day less to notice a problem.
      retention: 24h
      externalLabels:
        cluster: k8s-ha-cluster
      # Triggers prometheus-operator to inject a Thanos sidecar container
      # into this same Prometheus pod — uploads blocks to S3 and serves the
      # live-data StoreAPI that Thanos Query (charts/thanos) reads from.
      #
      # Upload cadence is 2h. Asked periodically ("can we make it 10m?"), so
      # the reasoning is recorded here.
      #
      # The sidecar ships only *immutable, completed* TSDB blocks. Prometheus
      # seals one roughly every 2h (its head compacts once it spans 1.5x the
      # block duration, so ~3h in, then every 2h after). The sidecar already
      # rescans every 30s, so the latency is block PRODUCTION, not upload —
      # a shorter scan interval would change nothing.
      #
      # What IS and ISN'T fixed here, precisely:
      #
      #   HARD requirement (thanos.io/tip/components/sidecar): min-block-
      #   duration and max-block-duration must be EQUAL. That equality is
      #   what disables Prometheus's internal compaction, "critical for data
      #   consistency" — without it Prometheus rewrites blocks underneath
      #   Thanos and the Compactor sees overlaps it cannot reconcile.
      #
      #   NOT fixed: the 2h value itself, which upstream only *recommends*.
      #   min=max=10m would still satisfy the equality, so this is a cost
      #   trade-off, not a prohibition.
      #
      # It is a bad trade at this scale. Each block carries a full index and
      # meta.json regardless of how little data it holds, so 10m blocks mean
      # ~12x the objects and ~12x the S3 PUTs for the same metrics, with a
      # far worse index-to-data ratio, and Store Gateway memory grows with
      # block COUNT because it holds an index header per block. It is also
      # the exact opposite of the direction chosen for Loki's flush policy
      # above, for the same reason: fewer, larger objects.
      #
      # If sub-2h durability is ever a hard requirement, the answer is Thanos
      # Receive (Prometheus remote_write -> Receive, samples leave the pod in
      # seconds and are replicated before any block exists), not shrinking
      # blocks. That is a real component with its own StatefulSet, PVC and
      # replication factor — deliberately not run here, because the 50Gi EBS
      # PVC above already survives pod reschedule and node loss, which is the
      # failure mode that actually occurs. Confirmed live: a restart replayed
      # the full head from WAL with no gap.
      thanos:
        # Must match charts/thanos's own image tag below — Sidecar, Query,
        # Store Gateway, and Compactor all speak the same gRPC StoreAPI, and
        # mismatched versions across components risk protocol drift.
        image: quay.io/thanos/thanos:v0.42.4
        version: v0.42.4
        objectStorageConfig:
          # existingSecret, not secret — .secret would make this chart render
          # its OWN separate objstore Secret from inline config; existingSecret
          # instead points the sidecar at the one Secret charts/thanos already
          # creates (thanos-objstore-secret), which Store Gateway and
          # Compactor also mount — one objstore config, shared by all three.
          existingSecret:
            key: object-store.yaml
            name: thanos-objstore-secret
  prometheus-node-exporter:
    fullnameOverride: "node-exporter"
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  kube-state-metrics:
    fullnameOverride: "kube-state-metrics"
    nodeSelector:
      node-role.kubernetes.io/data-node: ""
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# =============================================================================
# LOKI STACK (external dependency)
# =============================================================================
loki-stack:
  enabled: true
  loki:
    fullnameOverride: "loki"
    isDefault: false
    nodeSelector:
      node-role.kubernetes.io/core-node: ""
    image:
      repository: grafana/loki
      tag: 2.9.3
    # IRSA — Loki's own dedicated IAM role + S3 bucket (terraform-aws-k8s-ha:
    # observability-irsa.tf), not the shared node role. The chart
    # auto-creates this ServiceAccount and wires it into the StatefulSet
    # already; this annotation is the only thing needed for the EKS
    # pod-identity webhook to inject AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE,
    # which Loki's S3 client picks up automatically — no access/secret keys
    # anywhere in storage_config below.
    serviceAccount:
      annotations:
        # Literal, not .Values.global.lokiS3RoleArn — raw data handed to the
        # subchart, not a Go template. Keep in sync with global.lokiS3RoleArn
        # above by hand.
        eks.amazonaws.com/role-arn: "arn:aws:iam::419772658418:role/k8s-ha-cluster-loki-s3-writer"
    # Loki now ships chunks/index to S3 natively (storage_config below) —
    # this PVC is WAL + not-yet-flushed in-memory chunks only (the ~10m
    # ingester flush window below), not the long-term store. Before this it
    # was emptyDir (no persistence block at all), so every pod reschedule
    # silently dropped even that staging buffer with no error.
    persistence:
      enabled: true
      storageClassName: "ebs-gp3"
      size: 20Gi
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 60
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    config:
      # Flush policy: time trigger at 15m, size trigger as the pressure
      # relief valve, and chunk cuts aligned so the flushes go out as a
      # batch instead of dribbling.
      #
      # 10m, NOT the 15m an S3-cost argument alone would pick — this cluster
      # is ephemeral. It is built to run a Spark benchmark and torn down
      # ~10-20 min afterwards, and teardown deletes the PVC, so anything
      # still sitting in the ingester and WAL at that moment is gone for
      # good. The flush interval is therefore a DATA LOSS window, not a cost
      # knob, and it has to be shorter than the gap between "benchmark ends"
      # and "cluster dies".
      #
      # For the record, the cost argument it overrides: measured over the
      # first hour of real traffic, 82 chunk objects, 702 KB total, average
      # 8,773 bytes — 0.6% of chunk_target_size. The size trigger never fires
      # at this rate, so max_chunk_age alone sets the S3 PUT rate and the
      # relationship is inverse — 10m costs ~50% more PUTs than 15m at ~9 KB
      # per object instead of ~13 KB. On a cluster that lives hours, that is
      # a rounding error against losing the tail of a benchmark run.
      #
      # 10m still is not a guarantee on its own: a chunk created 1 minute
      # before teardown has not aged out. flush_on_shutdown below closes
      # that, and `curl -XPOST loki:3100/flush` (returns 204) forces every
      # in-memory chunk out immediately — worth running as the last step
      # before destroying the cluster.
      #
      # The two triggers are a floor/ceiling pair, not alternatives:
      #   max_chunk_age 15m   ceiling — a quiet stream still reaches S3
      #                       within 15m even if it never fills a chunk
      #   chunk_target_size   floor — a stream under heavy pressure (Spark
      #     1.5 MB            executors, a crash loop) fills 1.5 MB and
      #                       flushes IMMEDIATELY, without waiting out the
      #                       15m. This is what keeps a log storm bounded in
      #                       ingester memory, and it is already sized right:
      #                       a stream has to be ~175x busier than today's
      #                       average to hit it, which is exactly when you
      #                       want an early flush and not before.
      #   chunk_idle_period   a stream that stops entirely is flushed rather
      #     15m               than pinned in memory forever.
      #
      # Batching. sync_period cuts chunks on a shared wall-clock boundary
      # across ALL streams, so they become flushable in the same tick and
      # the ingester's flush workers (concurrent_flushes, 32 by default)
      # push them together, rather than each stream cutting on its own
      # private timer and trickling PUTs out continuously. Chunks aligned
      # this way also compress and dedupe better.
      #
      # sync_min_utilization guards the obvious failure of that: without it
      # a sync boundary would cut EVERY stream regardless of how little it
      # holds, turning one aligned batch into a burst of near-empty objects
      # and undoing the whole point. At 0.5 a chunk below half of
      # chunk_target_size is left to keep filling and cut on age instead.
      #
      # Note on what "batch" can mean here: Loki writes one S3 object per
      # chunk and has no API to combine several into a single PUT. Batching
      # is therefore about ISSUING the flushes together in parallel, not
      # about merging them into one request. Fewer, larger objects is what
      # actually reduces the request count, which is what the 15m and the
      # utilization floor above are for.
      #
      # Cost of the window is durability latency, not durability: unflushed
      # chunks live in the ingester and in the WAL below, on the EBS PVC,
      # replayed on restart (confirmed — a Prometheus-side restart earlier
      # recovered its full head from WAL). Pod reschedule and node loss are
      # covered; only losing the PVC itself would cost up to 15m of logs.
      ingester:
        chunk_idle_period: 10m
        max_chunk_age: 10m
        chunk_target_size: 1572864
        sync_period: 10m
        sync_min_utilization: 0.5
        wal:
          enabled: true
          dir: /data/loki/wal
          # Flush everything still in memory when the pod terminates
          # gracefully. On an ephemeral benchmark cluster this is the
          # difference between keeping and losing the final chunks, since
          # teardown takes the PVC (and therefore the WAL) with it.
          #
          # Nests under ingester.wal, NOT ingester — it is a WAL setting.
          # Putting it directly under ingester crash-loops Loki at startup
          # with "field flush_on_shutdown not found in type ingester.Config",
          # which is a hard config-parse failure, not a warning.
          flush_on_shutdown: true
      # v11/boltdb-shipper/filesystem replaced outright, not layered as a
      # second schema period — this cluster is destroyed/rebuilt per
      # benchmark run (see issues.md), so there's no historical data on the
      # old schema worth preserving continuity for.
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        # These nulls are Helm-version dependent — do not rely on them.
        # A local `helm template` (Helm 4) does strip both keys, but the
        # Secret ArgoCD actually rendered for this same revision still
        # contained the chart's boltdb_shipper (shared_store: filesystem) and
        # filesystem (directory: /data/loki/chunks) defaults — ArgoCD 7.8.23
        # bundles Helm 3, which is the likely difference.
        # Harmless either way: schema v13 uses store: tsdb + object_store: s3,
        # so neither key is ever consulted. Just don't read their absence in a
        # local render as proof they are gone in the cluster.
        boltdb_shipper: null
        filesystem: null
        tsdb_shipper:
          # Required. tsdb_shipper is the ACTIVE index shipper for schema v13
          # (store: tsdb above); without a shared_store the index is only ever
          # written to the local active_index_directory and never reaches S3.
          shared_store: s3
          active_index_directory: /data/loki/tsdb-shipper-active
          cache_location: /data/loki/tsdb-shipper-cache
        aws:
          # MUST be `bucketnames`, not an `s3://<bucket>` URL. Loki takes the
          # bucket from either `bucketnames` or the URL *path* — never the URL
          # host, which it treats as an endpoint/region. So
          # `s3: s3://<bucket>` parses to an EMPTY bucket and every S3 call
          # fails the SDK's own validation before it leaves the pod:
          #
          #   InvalidParameter: minimum field size of 1, ListObjectsV2Input.Bucket
          #   InvalidParameter: minimum field size of 1, DeleteObjectInput.Bucket
          #
          # Loki logs "uploading tables" every minute regardless, so this looks
          # healthy from the outside while the bucket stays completely empty.
          bucketnames: k8s-ha-cluster-loki-logs-ap-south-1-419772658418
          region: ap-south-1
      # Loki's own internal compactor (retention/index compaction) is a
      # separate concept from Thanos's Compactor (charts/thanos) — this one
      # still defaulted to shared_store: filesystem, inconsistent with
      # everything else above now pointing at S3.
      compactor:
        working_directory: /data/loki/compactor
        shared_store: s3
  promtail:
    enabled: true
    fullnameOverride: "promtail"
    # REQUIRED — do not delete. All actual Spark driver/executor pods run on
    # Karpenter's spark-node pool, which carries a `spark-only=true:NoSchedule`
    # taint (karpenter-k8s.tf) specifically so no OTHER workload lands there
    # by accident — Spark pods get a matching toleration on their own template
    # (examples/spark-jobs/*.yaml). promtail is a DaemonSet, and a DaemonSet
    # pod needs that same toleration on ITS OWN pod spec to schedule onto a
    # tainted node — what Spark's pod template tolerates doesn't extend to
    # promtail's. The chart's default tolerations
    # (node-role.kubernetes.io/master / control-plane) don't cover this,
    # since neither exists on managed EKS. Without this override, promtail
    # only ever runs on core-node/data-node, and every multiline/labeling
    # rule added above for spark_role/spark_app_selector processes zero real
    # lines — the DaemonSet was never on the node producing them.
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: spark-only
        operator: Equal
        value: "true"
        effect: NoSchedule
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      timeoutSeconds: 10
      failureThreshold: 20
      initialDelaySeconds: 15
    config:
      # REQUIRED — do not delete. loki-stack's own values.yaml hardcodes
      #
      #   - url: http://{{ .Release.Name }}:3100/loki/api/v1/push
      #
      # which resolves to "big-data-platform" (the umbrella release name).
      # The Loki Service is called "loki", because loki.fullnameOverride
      # above renames it. Nothing reconciles those two names, so the chart
      # default points promtail at a host that does not exist:
      #
      #   dial tcp: lookup big-data-platform on 172.20.0.10:53: no such host
      #
      # Every promtail pod then retries forever and Loki receives NOTHING —
      # loki_ingester_memory_chunks stays 0 and the S3 bucket stays empty
      # even when the storage config is perfectly correct. Loki itself looks
      # healthy (1/1 Running, "uploading tables" every minute), which is what
      # makes this worth the comment.
      clients:
        - url: http://loki:3100/loki/api/v1/push
      snippets:
        # Multi-line stack traces: promtail (via `cri: {}` above) still tails
        # one *raw container log line* at a time, but a JVM/Python stack
        # trace is many lines with no per-line timestamp of its own — each
        # `at org.apache.spark...` frame lands as its own separate Loki
        # entry, so a driver OOM reads as dozens of unrelated one-line
        # events instead of one exception. `multiline` re-stitches everything
        # between one line matching `firstline` and the next into a single
        # entry. Scoped per-service via `match` because the timestamp shape
        # differs per logger and a wrong regex silently stops stitching
        # (worse: matches mid-trace and truncates it).
        #
        # spark-role/spark-app-selector aren't in promtail's default label
        # set (only app/instance/component/namespace/pod/container are), so
        # they're added via extraRelabelConfigs below. This is safe re:
        # cardinality — unlike the Hubble-flow TODO (CHANGELOG.md) where a
        # label per flow would explode the stream count, `pod` is already a
        # label here (default relabeling), so every stream this touches
        # already exists 1:1 per pod; these just add searchable dimensions
        # to it (`{spark_role="driver"} |= "app-20260902..."` pulls one
        # job's driver+executor logs together) rather than creating new ones.
        pipelineStages:
          - cri: {}
          # Spark driver/executor (spark-role set by spark-submit itself).
          # log4j default pattern layout is `%d{yy/MM/dd HH:mm:ss} ...`
          # (verified against archive/misc/log4j.properties, the last known
          # config before the image dropped a bundled log4j.properties) —
          # e.g. "26/09/02 10:15:23 INFO ...".
          - match:
              selector: '{spark_role=~"driver|executor"}'
              stages:
                - multiline:
                    firstline: '^\d{2}/\d{2}/\d{2}'
                    max_wait_time: 3s
          # Spark History Server — same Spark distribution, same log4j
          # pattern as above, but its own long-running Deployment (no
          # spark-role label), so it needs its own match on app (set via
          # `labels: {app: spark-history-server}` in
          # charts/spark-history-server/templates/deployment.yaml).
          - match:
              selector: '{app="spark-history-server"}'
              stages:
                - multiline:
                    firstline: '^\d{2}/\d{2}/\d{2}'
                    max_wait_time: 3s
          # Airflow (scheduler/webserver/worker/triggerer/dag-processor) —
          # every role carries `tier: airflow` (checked against the actual
          # chart template, charts/airflow's scheduler-deployment.yaml etc.;
          # `component` differs per role but `tier` doesn't, so relabel that
          # one). Default log format is Airflow's own
          # `[%(asctime)s] {file:line} LEVEL - msg`, not overridden anywhere
          # in this values.yaml — e.g. "[2026-09-02 10:15:23,456] {...} ...".
          - match:
              selector: '{tier="airflow"}'
              stages:
                - multiline:
                    firstline: '^\[\d{4}-\d{2}-\d{2}'
                    max_wait_time: 3s
          # Gravitino — resolves to app=gravitino-helm (no nameOverride set
          # below, so promtail's default app-label chain falls through to
          # the chart's own name, confirmed via its _helpers.tpl). Regex
          # assumes Apache Gravitino's documented default log4j2 pattern
          # (`%d{yyyy-MM-dd HH:mm:ss.SSS} ...`) — unlike the two Spark rules
          # above, this was NOT checked against the actual running image's
          # bundled log4j2.properties, only against Gravitino's typical
          # default. Verify with `kubectl logs` on the next deploy; if the
          # timestamp shape differs, fix the regex, don't drop the rule.
          - match:
              selector: '{app="gravitino-helm"}'
              stages:
                - multiline:
                    firstline: '^\d{4}-\d{2}-\d{2}'
                    max_wait_time: 3s
        extraRelabelConfigs:
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_spark_role]
            target_label: spark_role
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_spark_app_selector]
            target_label: spark_app_selector
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_tier]
            target_label: tier

# =============================================================================
# CLOUDFLARED (local sub-chart) — spread across GP nodes for tunnel HA
# =============================================================================
cloudflared:
  enabled: true
  replicas: 3
  image: "cloudflare/cloudflared:2025.1.0"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# =============================================================================
# HEADLAMP (local sub-chart) — GP node
# =============================================================================
headlamp:
  enabled: true
  replicas: 1
  image: "ghcr.io/headlamp-k8s/headlamp:latest"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# =============================================================================
# MONITORING EXTRAS (local sub-chart)
# =============================================================================
monitoring:
  enabled: true

# =============================================================================
# THANOS (local sub-chart) — S3 long-term storage for Prometheus, see
# charts/thanos for the full explanation of why this exists.
# =============================================================================
thanos:
  enabled: true
  # Must match kube-prometheus-stack.prometheus.prometheusSpec.thanos.image
  # above — Sidecar/Query/Store Gateway/Compactor all speak the same gRPC
  # StoreAPI.
  image: "quay.io/thanos/thanos:v0.42.4"
  # Compactor retention — raw kept a month for detailed shuffle/executor
  # debugging (issues #38-#40 style investigations), then downsampled so a
  # year of history doesn't cost a year of raw-resolution S3 storage.
  retention:
    raw: "30d"
    fiveMin: "90d"
    oneHour: "365d"
  query:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  storeGateway:
    storageSize: "5Gi"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  compactor:
    storageSize: "20Gi"
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

# =============================================================================
# NETWORKING EXTRAS (local sub-chart)
# =============================================================================
networking-extras:
  enabled: true
