# ------------------------------------------------------------------------------
# Gravitino - Metalake & Catalog Init Job
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Bootstraps the Gravitino metadata lake after the server is ready.
#   1. Creates metalake "enterprise_metalake" (idempotent — 409 = already exists)
#   2. Registers catalog "sales_catalog" as a lakehouse-iceberg catalog backed by
#      the iceberg_catalog PostgreSQL DB + MinIO S3FileIO.
#
# This is REQUIRED for the dynamic-config-provider mode to work.
# Without it, the Iceberg REST Catalog (port 9001) has no catalog to serve and
# all Spark/StarRocks queries will fail with "catalog not found".
#
# After this job runs, tables created by Spark are visible in the Gravitino Web UI
# at: gravitino.{{ .Values.global.domain }}
#
# Sync wave ordering:
#   wave -1 : Gravitino server starts (with init-config + init-databases init containers)
#   wave  0 : This job — waits for Gravitino readiness, then registers metadata
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

{{- if .Values.gravitino.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: gravitino-init
  namespace: default
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      initContainers:
        # Wait for Gravitino Core Server (port 8090) to pass its readiness probe
        - name: wait-for-gravitino
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://gravitino.default.svc.cluster.local:8090/api/version >/dev/null; do
                echo "Waiting for Gravitino..."; sleep 5
              done
              echo "Gravitino is ready."
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: gravitino-init
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              set -e
              GRAV_URI="http://gravitino.default.svc.cluster.local:8090"
              METALAKE="enterprise_metalake"
              CATALOG="sales_catalog"

              # --------------- Create metalake ---------------
              echo "Creating metalake '${METALAKE}'..."
              HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
                -X POST "${GRAV_URI}/api/metalakes" \
                -H "Content-Type: application/json" \
                -H "Accept: application/vnd.gravitino.v1+json" \
                -d "{\"name\":\"${METALAKE}\",\"comment\":\"Primary data lake\"}")
              echo "  -> HTTP ${HTTP}"
              if [ "$HTTP" != "200" ] && [ "$HTTP" != "409" ]; then
                echo "ERROR: unexpected HTTP ${HTTP}"; cat /tmp/resp.json; exit 1
              fi
              [ "$HTTP" = "409" ] && echo "  Metalake already exists — OK."

              # --------------- Register catalog ---------------
              echo "Registering catalog '${CATALOG}' in metalake '${METALAKE}'..."
              cat > /tmp/catalog.json << 'CATALOG_JSON'
              {
                "name": "CATALOG_PLACEHOLDER",
                "type": "RELATIONAL",
                "provider": "lakehouse-iceberg",
                "comment": "Iceberg tables backed by PostgreSQL JDBC + MinIO S3FileIO",
                "properties": {
                  "catalog-backend": "jdbc",
                  "uri": "JDBC_URI_PLACEHOLDER",
                  "jdbc-driver": "org.postgresql.Driver",
                  "jdbc-user": "JDBC_USER_PLACEHOLDER",
                  "jdbc-password": "JDBC_PASSWORD_PLACEHOLDER",
                  "warehouse": "WAREHOUSE_PLACEHOLDER",
                  "io-impl": "org.apache.iceberg.aws.s3.S3FileIO",
                  "s3-endpoint": "S3_ENDPOINT_PLACEHOLDER",
                  "s3-access-key-id": "S3_ACCESS_KEY_PLACEHOLDER",
                  "s3-secret-access-key": "S3_SECRET_KEY_PLACEHOLDER",
                  "s3-path-style-access": "true"
                }
              }
              CATALOG_JSON

              # Substitute env vars into the JSON
              sed -i \
                -e "s|CATALOG_PLACEHOLDER|${CATALOG}|g" \
                -e "s|JDBC_URI_PLACEHOLDER|${ICEBERG_JDBC_URL}|g" \
                -e "s|JDBC_USER_PLACEHOLDER|${ICEBERG_JDBC_USER}|g" \
                -e "s|JDBC_PASSWORD_PLACEHOLDER|${ICEBERG_JDBC_PASSWORD}|g" \
                -e "s|WAREHOUSE_PLACEHOLDER|${ICEBERG_WAREHOUSE}|g" \
                -e "s|S3_ENDPOINT_PLACEHOLDER|${S3_ENDPOINT}|g" \
                -e "s|S3_ACCESS_KEY_PLACEHOLDER|${S3_ACCESS_KEY}|g" \
                -e "s|S3_SECRET_KEY_PLACEHOLDER|${S3_SECRET_KEY}|g" \
                /tmp/catalog.json

              HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
                -X POST "${GRAV_URI}/api/metalakes/${METALAKE}/catalogs" \
                -H "Content-Type: application/json" \
                -H "Accept: application/vnd.gravitino.v1+json" \
                -d @/tmp/catalog.json)
              echo "  -> HTTP ${HTTP}"
              if [ "$HTTP" != "200" ] && [ "$HTTP" != "409" ]; then
                echo "ERROR: unexpected HTTP ${HTTP}"; cat /tmp/resp.json; exit 1
              fi
              [ "$HTTP" = "409" ] && echo "  Catalog already exists — OK."

              echo "Gravitino init complete. Catalog '${CATALOG}' is live in metalake '${METALAKE}'."
          env:
            - name: ICEBERG_JDBC_URL
              value: "jdbc:postgresql://{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/{{ .Values.gravitino.icebergCatalog.db.name }}"
            - name: ICEBERG_JDBC_USER
              value: "{{ .Values.gravitino.icebergCatalog.db.user }}"
            - name: ICEBERG_JDBC_PASSWORD
              value: "{{ .Values.gravitino.icebergCatalog.db.password }}"
            - name: ICEBERG_WAREHOUSE
              value: "{{ .Values.gravitino.icebergCatalog.warehouse }}"
            - name: S3_ENDPOINT
              value: "{{ .Values.global.s3.endpoint }}"
            - name: S3_ACCESS_KEY
              value: "{{ .Values.global.s3.accessKey }}"
            - name: S3_SECRET_KEY
              value: "{{ .Values.global.s3.secretKey }}"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
{{- end }}
