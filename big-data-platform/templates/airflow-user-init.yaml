# ------------------------------------------------------------------------------
# Airflow - Admin User Init Job
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Creates the Airflow admin user after every sync.
# Uses `airflow users create` which is idempotent — safe to re-run.
# The chart's built-in createUserJob relies on migrateDatabaseJob being enabled;
# since we disabled that and use our own airflow-db-migrate.yaml, the built-in
# user creation never fires under ArgoCD.
#
# Sync wave ordering:
#   wave -2 : Secrets (airflow-secrets.yaml)
#   wave -1 : DB migration (airflow-db-migrate.yaml)
#   wave  0 : Airflow components (webserver, scheduler, triggerer)
#   wave  1 : This job — runs after webserver is healthy
#
# Managed via ArgoCD Sync Wave: 1
# ------------------------------------------------------------------------------

{{- if .Values.airflow.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-user-init
  namespace: default
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres.default.svc.cluster.local 5432; do echo "waiting for db"; sleep 2; done']
      containers:
        - name: airflow-user-init
          image: {{ .Values.global.airflowImage | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              airflow users create \
                --username {{ .Values.airflow.webserver.defaultUser.username }} \
                --firstname {{ .Values.airflow.webserver.defaultUser.firstName }} \
                --lastname {{ .Values.airflow.webserver.defaultUser.lastName }} \
                --role {{ .Values.airflow.webserver.defaultUser.role }} \
                --email {{ .Values.airflow.webserver.defaultUser.email }} \
                --password "{{ .Values.airflow.webserver.defaultUser.password }}"
              echo "Airflow user init complete."
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: big-data-platform-metadata
                  key: connection
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: big-data-platform-fernet-key
                  key: fernet-key
{{- end }}
