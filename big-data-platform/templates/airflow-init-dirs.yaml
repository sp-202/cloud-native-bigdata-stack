{{- if .Values.airflow.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init-dirs
  namespace: default
  annotations:
    # Run at wave -5, before the db-migrate job (wave -1) and before any Airflow
    # StatefulSets try to mount the log PVs. The log PVs use openebs-hostpath with
    # static hostPath provisioning — the directory must exist on the node or the
    # kubelet will refuse to mount the volume (FailedMount error).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      tolerations:
        - operator: Exists
      containers:
        - name: init-dirs
          image: busybox
          command:
            - sh
            - -c
            - |
              mkdir -p /mnt/host{{ .Values.persistence.airflow.localPath }}
              mkdir -p /mnt/host{{ .Values.persistence.airflowSchedulerLogs.localPath }}
              mkdir -p /mnt/host{{ .Values.persistence.airflowTriggererLogs.localPath }}
              echo "Airflow host directories ready."
          volumeMounts:
            - name: host-root
              mountPath: /mnt/host
      volumes:
        - name: host-root
          hostPath:
            path: /
{{- end }}
