# ------------------------------------------------------------------------------
# Node Setup - Host Directory Provisioner
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: DaemonSet that pre-creates all required hostPath directories on
# GP nodes before local PVs attempt to mount them. Without this, pods using
# local PVs (airflow scheduler/triggerer logs) get stuck in FailedMount on
# fresh node launches.
#
# Managed via ArgoCD Sync Wave: -4 (must run before persistence wave -3)
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-dir-setup
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  selector:
    matchLabels:
      app: node-dir-setup
  template:
    metadata:
      labels:
        app: node-dir-setup
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      tolerations:
        - operator: Exists
      initContainers:
        - name: create-dirs
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              mkdir -p \
                {{ .Values.persistence.postgres.localPath }} \
                {{ .Values.persistence.minio.localPath }} \
                {{ .Values.persistence.airflow.localPath }} \
                {{ .Values.persistence.airflowSchedulerLogs.localPath }} \
                {{ .Values.persistence.airflowTriggererLogs.localPath }} \
                {{ .Values.persistence.redis.localPath }} \
                {{ .Values.persistence.starrocksFe.localPath }} \
                {{ .Values.persistence.starrocksBe.localPath }}
              echo "All host directories created."
          volumeMounts:
            - name: host-root
              mountPath: /
      containers:
        - name: pause
          image: gcr.io/google_containers/pause:3.1
          resources:
            requests:
              cpu: "1m"
              memory: "8Mi"
            limits:
              cpu: "10m"
              memory: "16Mi"
      volumes:
        - name: host-root
          hostPath:
            path: /
