{{- if .Values.airflow.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-db-migrate
  namespace: default
  annotations:
    # ArgoCD: run this Job after every sync so postgres is already running
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      containers:
        - name: airflow-db-migrate
          image: {{ .Values.global.airflowImage | quote }}
          command: ["airflow", "db", "migrate"]
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: big-data-platform-metadata
                  key: connection
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: big-data-platform-fernet-key
                  key: fernet-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
{{- end }}
