{{- if .Values.airflow.enabled }}
---
# ------------------------------------------------------------------------------
# Airflow - Database Migration Job
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Init Job that runs alembic migrations for the Airflow metadata DB.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: -1
# ------------------------------------------------------------------------------

apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-db-migrate
  namespace: default
  annotations:
    # ArgoCD sync wave -1: runs before all wave-0 resources (including Airflow
    # StatefulSets) are health-checked. The job's own init container waits for
    # Postgres to be ready, so no explicit ordering vs Postgres is needed.
    # Must be wave -1 (not 5) to avoid deadlock: Airflow init containers block
    # on wait-for-migrations, and ArgoCD won't advance past wave 0 until they
    # are healthy — wave 5 would never be reached.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.data | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: "postgres:15-alpine"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} -U {{ .Values.global.postgres.user }}; do
                echo "Waiting for postgres at {{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}...";
                sleep 3;
              done
              echo "Postgres is ready."
      containers:
        - name: airflow-db-migrate
          image: {{ .Values.global.airflowImage | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              airflow db migrate
              # Create admin user immediately after migration. Done here (wave -1)
              # instead of a separate wave-1 hook so the user always exists even
              # when an ArgoCD sync fails before wave 1 is reached.
              #
              # Must stay idempotent across repeat syncs (this Job reruns on every
              # sync) — `airflow users create` exits non-zero if the user already
              # exists, which is expected, not a failure. But a blanket `|| true`
              # previously swallowed EVERY failure reason equally, including a
              # genuinely broken user-creation (e.g. wrong auth manager, DB not
              # ready) — the Job would still report success with no admin user
              # actually created, and login would fail with no visible cause.
              # Only "already exists" is now treated as OK; anything else fails
              # the Job loudly. Confirmed live: this exact silent-failure shape
              # was suspected as the cause of an "invalid credentials" report.
              set +e
              airflow users create \
                --username {{ .Values.airflow.webserver.defaultUser.username }} \
                --firstname {{ .Values.airflow.webserver.defaultUser.firstName }} \
                --lastname {{ .Values.airflow.webserver.defaultUser.lastName }} \
                --role {{ .Values.airflow.webserver.defaultUser.role }} \
                --email {{ .Values.airflow.webserver.defaultUser.email }} \
                --password "$ADMIN_PASSWORD" > /tmp/user_create.log 2>&1
              USER_CREATE_EXIT=$?
              set -e
              cat /tmp/user_create.log
              if [ $USER_CREATE_EXIT -ne 0 ] && ! grep -qi "already exist" /tmp/user_create.log; then
                echo "ERROR: airflow users create failed for an unexpected reason (exit $USER_CREATE_EXIT) — see output above."
                exit 1
              fi
              echo "DB migration and user init complete."
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-credentials
                  key: connection
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-credentials
                  key: fernet-key
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-credentials
                  key: admin-password
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
{{- end }}
