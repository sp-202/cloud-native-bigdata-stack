# ------------------------------------------------------------------------------
# Spark History Server - Deployment
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Web UI for monitoring completed Spark jobs and viewing event logs.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  labels:
    app: spark-history-server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      # data-node, not spark-node — this is just a log viewer reading
      # completed job history from S3, it doesn't need Karpenter's
      # scale-from-zero Spark capacity. Pinning it there meant just opening
      # the UI would cold-start an expensive Spark instance for no reason.
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.data | nindent 8 }}
      containers:
        - name: spark-history-server
          image: {{ .Values.global.sparkImage }}
          # Always while the spark image is rebuilt under an unchanged tag: the golden AMI
          # pre-pulls spark-bigdata (terraform-aws-k8s-ha packer/images/spark.txt), and with
          # IfNotPresent every node ran that baked copy instead of the rebuilt one.
          imagePullPolicy: {{ .Values.global.sparkImagePullPolicy | default "Always" }}
          command:
            [
              "/opt/spark/bin/spark-class",
              "org.apache.spark.deploy.history.HistoryServer",
            ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: SPARK_DAEMON_MEMORY
              value: {{ .Values.daemonMemory | quote }}
            # No AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/s3a.endpoint — the
            # node's IAM role provides S3 credentials via the default chain.
            - name: LAKEHOUSE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: lakehouse-s3
                  key: bucket
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory={{ .Values.logDirectory | default "s3a://$(LAKEHOUSE_BUCKET)/spark-events/" }}
                -Dspark.hadoop.fs.s3a.path.style.access={{ .Values.global.s3.pathStyleAccess }}
                -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
                -Dspark.history.fs.cleaner.enabled=false
                -Dspark.history.retainedApplications={{ .Values.retainedApplications | default 2000 }}
                -Dspark.history.fs.update.interval=10s
                -Dspark.history.store.path=/var/spark-history-store
                -Dspark.history.store.hybridStore.enabled=true
                -Dspark.ui.retainedJobs={{ (.Values.ui).retainedJobs | default 1000 }}
                -Dspark.ui.retainedStages={{ (.Values.ui).retainedStages | default 1000 }}
                -Dspark.ui.retainedTasks={{ (.Values.ui).retainedTasks | default 100000 }}
                -Dspark.ui.retainedDeadExecutors={{ (.Values.ui).retainedDeadExecutors | default 20 }}
                -Dspark.sql.ui.retainedExecutions={{ (.Values.ui).retainedExecutions | default 1000 }}
          volumeMounts:
            # Disk-backed KVStore for parsed apps: with 2000 retained UIs an in-memory store
            # would need the whole lot on the heap, and every restart would re-parse every
            # event log before the listing is complete.
            - name: history-store
              mountPath: /var/spark-history-store
          ports:
            - containerPort: 18080
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: history-store
          emptyDir:
            sizeLimit: {{ .Values.storeSizeLimit | default "20Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
    - port: 18080
      targetPort: 18080
      protocol: TCP
      name: http
  selector:
    app: spark-history-server
