{{- if .Values.enabled }}
# ------------------------------------------------------------------------------
# Monitoring - Spark ServiceMonitor
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Prometheus discovery for Spark drivers and executors metrics.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spark-service-monitor
  namespace: default
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  jobLabel: spark-role
  selector:
    matchLabels:
      app: spark-ui
  endpoints:
  - port: spark-ui
    path: /metrics/prometheus/
    interval: 10s
    honorLabels: true
  namespaceSelector:
    matchNames:
      - default
---
# Executor metrics in K8s mode are not served on blockmanager port (7079).
# They are aggregated by the driver and exposed at the driver's Spark UI
# (/metrics/prometheus/ on port 4040). No per-executor scrape needed.
# This PodMonitor exists as a placeholder for if executor HTTP servers are
# enabled in future (spark.executor.metrics.fileSystemSchemes etc).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spark-executor-pod-monitor
  namespace: default
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  jobLabel: spark-executor
  selector:
    matchLabels:
      spark-role: executor
  podMetricsEndpoints:
  - port: blockmanager
    path: /metrics/prometheus/
    interval: 15s
    honorLabels: true
  namespaceSelector:
    matchNames:
      - default
{{- end }}
