{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centralized-ingress
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.className }}
  rules:
  # Airflow
  - host: airflow.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: airflow-webserver
            port:
              name: web
  # MinIO Console
  - host: minio.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              name: console
  # MinIO API
  - host: s3.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              name: api
  # Superset
  - host: superset.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: superset
            port:
              name: http
  # JupyterHub
  - host: jupyterhub.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jupyterhub
            port:
              name: web
  # Spark UI
  - host: spark.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spark-ui
            port:
              name: spark-ui
  # Spark History
  - host: spark-history.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spark-history-server
            port:
              number: 18080
  # Unity Catalog (API + UI)
  - host: unity-catalog.{{ .Values.global.domain }}
    http:
      paths:
      # API Server routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: unity-catalog-server
            port:
              name: api
      # UI routes (root path last as it's catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: unity-catalog-ui
            port:
              name: ui
{{- end }}
