{{- if .Values.enabled }}
# ------------------------------------------------------------------------------
# Ingress - Routing Rules
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Centralized Ingress definitions for all platform services.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centralized-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.className }}
  rules:
  # Airflow
  - host: airflow.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-api-server
            port:
              name: api-server
  {{- if and .Values.superset .Values.superset.enabled }}
  # Superset — only rendered when superset.enabled: true
  - host: superset.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: superset
            port:
              name: http
  {{- end }}
  {{- if and (index .Values "jupyterhub") (index .Values "jupyterhub").enabled }}
  # JupyterHub — only rendered when jupyterhub.enabled: true
  - host: jupyterhub.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jupyterhub
            port:
              name: web
  {{- end }}
  {{- if and (index .Values "spark-connect-server") (index .Values "spark-connect-server").enabled }}
  # Spark UI — only rendered when spark-connect-server.enabled: true
  - host: spark.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spark-ui
            port:
              name: spark-ui
  {{- end }}
  # Prometheus
  - host: prometheus.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-kube-pro-prometheus
            port:
              name: http-web
  # Grafana
  - host: grafana.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              name: http-web
  # Spark History
  - host: spark-history.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spark-history-server
            port:
              number: 18080
  {{- if and .Values.gravitino .Values.gravitino.enabled }}
  # Gravitino — Web UI v2 + Main REST API (port 8090)
  # The Iceberg REST port (9001) is internal-only; Spark uses it in-cluster.
  - host: gravitino.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gravitino
            port:
              name: http
  {{- end }}
{{- end }}
