{{- if .Values.enabled }}
# ------------------------------------------------------------------------------
# Ingress - Routing Rules
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Centralized Ingress definitions for all platform services.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centralized-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.className }}
  rules:
  # Airflow
  - host: airflow.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-api-server
            port:
              name: api-server
  # MinIO Console
  - host: minio.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              name: console
  # MinIO API
  - host: s3.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              name: api
  # Superset
  - host: superset.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: superset
            port:
              name: http
  # JupyterHub
  - host: jupyterhub.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jupyterhub
            port:
              name: web
  # Spark UI
  - host: spark.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spark-ui
            port:
              name: spark-ui
  # Prometheus
  - host: prometheus.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-kube-pro-prometheus
            port:
              name: http-web
  # Grafana
  - host: grafana.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              name: http-web
  # Spark History
  - host: spark-history.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spark-history-server
            port:
              number: 18080
  {{- if and .Values.unityCatalog .Values.unityCatalog.enabled }}
  # Unity Catalog (API + UI) — only rendered when unity-catalog.enabled: true
  - host: unity-catalog.{{ .Values.global.domain }}
    http:
      paths:
      # API Server routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: unity-catalog-server
            port:
              name: api
      # UI routes (root path last as it's catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: unity-catalog-ui
            port:
              name: ui
  {{- end }}
  {{- if and .Values.gravitino .Values.gravitino.enabled }}
  # Gravitino — Web UI v2 + Main REST API (port 8090)
  # The Iceberg REST port (9001) is internal-only; Spark uses it in-cluster.
  - host: gravitino.{{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gravitino
            port:
              name: api
  {{- end }}
{{- end }}
