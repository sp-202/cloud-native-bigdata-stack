{{- if .Values.enabled }}
# ------------------------------------------------------------------------------
# Thanos — S3 long-term storage for kube-prometheus-stack's Prometheus
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Why this exists: Prometheus keeps only a short buffer on its local volume
# (values.yaml, retention 24h). The Thanos sidecar injected via
# prometheus.prometheusSpec.thanos uploads each sealed 2h TSDB block to
# SeaweedFS (s3://lakehouse/thanos/), so history survives a Prometheus pod
# or node loss — with local-storage, losing the node means losing its PVC.
#
# Credentials: the objstore Secret below carries no access_key/secret_key.
# Thanos's S3 client falls back to AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# from the environment, which the Store Gateway and Compactor (here) and
# the sidecar (values.yaml prometheusSpec.containers) all get via
# `envFrom: secretRef: lakehouse-s3`.
#
# Components: Sidecar (injected into Prometheus itself, not deployed here)
# + Query (merges live sidecar data with historical S3 data for one query
# endpoint) + Store Gateway (serves historical blocks from S3) + Compactor
# (exactly one replica — running two corrupts the block index; downsamples
# old data so a year of history doesn't cost a year of raw-resolution
# storage).
#
# Managed via ArgoCD Sync Wave: 0 (same tier as the rest of monitoring)
# ------------------------------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-s3
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-secret
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
stringData:
  # `prefix` is a field of objstore's top-level BucketConfig, NOT of s3.Config —
  # it must stay a sibling of `type`/`config`, never nested inside `config`.
  # objstore parses this in two passes: it unmarshals the outer BucketConfig,
  # then re-marshals the `config` map and strict-unmarshals that into s3.Config.
  # A prefix inside `config` survives pass one and dies in pass two with
  #
  #   yaml: unmarshal errors: line 3: field prefix not found in type s3.Config
  #
  # which is doubly confusing: line 3 is not line 3 of this file, it is line 3
  # of the re-marshaled sub-document with its keys sorted alphabetically
  # (bucket, endpoint, prefix, region). Every Thanos component that opens the
  # bucket crash-loops on it — compactor and store-gateway both.
  object-store.yaml: |
    type: S3
    prefix: thanos
    config:
      bucket: {{ .Values.global.s3.bucket }}
      endpoint: {{ .Values.global.s3.endpointHost }}
      region: {{ .Values.global.s3.region }}
      insecure: true
      bucket_lookup_type: path
---
# =============================================================================
# Thanos Query — single endpoint over live (via Prometheus's sidecar) +
# historical (via Store Gateway, below) data. This is what Grafana's "Thanos"
# datasource (kube-prometheus-stack.grafana.additionalDataSources) points at.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # 2, not 1 — stateless (Query holds no data of its own, just fans out to
  # the sidecar/store-gateway StoreAPIs below and merges results), so this
  # is a safe, no-coordination-needed HA bump, paired with Prometheus
  # itself going to 2 replicas (values.yaml prometheusSpec.replicas).
  # Unlike Compactor further down, which must stay at exactly 1 forever.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-query
        app.kubernetes.io/part-of: thanos
    spec:
      nodeSelector:
        # Was .gp, a key that doesn't exist in global.nodeSelector (only
        # core/data/spark do, post the tier-split refactor) — rendered as an
        # empty/no-op nodeSelector rather than a template error, so this ran
        # completely unconstrained until now. .data matches where the rest
        # of kube-prometheus-stack's always-on pieces (Grafana, Alertmanager)
        # already live.
        {{- toYaml .Values.global.nodeSelector.data | nindent 8 }}
      containers:
        - name: thanos-query
          image: {{ .Values.image }}
          args:
            - query
            - --log.level=info
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:9090
            # Required now that Prometheus runs 2 replicas
            # (values.yaml prometheusSpec.replicas: 2): prometheus-operator
            # auto-injects an external label named exactly this
            # (spec.replicaExternalLabelName, defaults to
            # "prometheus_replica") on each replica specifically so
            # federation/Thanos can tell "same series, different replica"
            # apart from "actually different series" — without this flag,
            # every metric would show doubled (both replicas' identical
            # scrapes returned as separate series) instead of deduplicated.
            - --query.replica-label=prometheus_replica
            # --endpoint, not --store — confirmed live (CrashLoopBackOff,
            # "unknown long flag '--store'") and against the actual v0.42.4
            # source (cmd/thanos/query.go): --store was renamed to
            # --endpoint at some point before this version; --store no
            # longer exists as a flag at all here.
            #
            # Governing service name is fixed by prometheus-operator
            # ("prometheus-operated") — not overridable via values here.
            - --endpoint=dnssrv+_grpc._tcp.prometheus-operated.default.svc.cluster.local:10901
            - --endpoint=dnssrv+_grpc._tcp.thanos-store-gateway.default.svc.cluster.local:10901
          ports:
            - containerPort: 9090
              name: http-query
            - containerPort: 10901
              name: grpc
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.query.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: thanos-query
  ports:
    - name: http-query
      port: 9090
      targetPort: 9090
---
# =============================================================================
# Thanos Store Gateway — serves historical blocks straight from S3. Headless
# (clusterIP: None) with a port literally named "grpc" because Thanos Query's
# dnssrv+_grpc._tcp.* discovery above resolves via DNS SRV records, which
# only headless services with named ports produce.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store-gateway
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: thanos-store-gateway
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-store-gateway
        app.kubernetes.io/part-of: thanos
    spec:
      serviceAccountName: thanos-s3
      # The thanos image runs as UID 1001 (checked: config.User on
      # quay.io/thanos/thanos:v0.42.4), but a freshly provisioned EBS volume
      # is mounted root:root 0755, so the process cannot create its data dir:
      #
      #   mkdir /var/thanos/store/meta-syncer: permission denied
      #
      # fsGroup makes kubelet chown the volume to this GID on mount. This is
      # only needed because the data dir moved from emptyDir to a PVC — an
      # emptyDir is created owned by the pod, a fresh block volume is not.
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.data | nindent 8 }}
      containers:
        - name: thanos-store-gateway
          image: {{ .Values.image }}
          envFrom:
            - secretRef:
                name: {{ .Values.global.s3.secretName }}
          args:
            - store
            - --log.level=info
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/store
            # Must match the Secret's data key exactly (object-store.yaml,
            # with the hyphen) — the volume mounts the Secret as a
            # directory of files named after each key. Was
            # /etc/thanos/objstore.yaml (no hyphen) here, which doesn't
            # exist on disk under that name — confirmed live
            # (CrashLoopBackOff, "open /etc/thanos/objstore.yaml: no such
            # file or directory").
            - --objstore.config-file=/etc/thanos/object-store.yaml
          ports:
            - containerPort: 10901
              name: grpc
            - containerPort: 10902
              name: http-metrics
          volumeMounts:
            - name: objstore-config
              mountPath: /etc/thanos
              readOnly: true
            - name: store-data
              mountPath: /var/thanos/store
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 10902
            initialDelaySeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.storeGateway.resources | nindent 12 }}
      volumes:
        - name: objstore-config
          secret:
            secretName: thanos-objstore-secret
  volumeClaimTemplates:
    - metadata:
        name: store-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storeGateway.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store-gateway
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-store-gateway
  ports:
    - name: grpc
      port: 10901
      targetPort: 10901
    - name: http-metrics
      port: 10902
      targetPort: 10902
---
# =============================================================================
# Thanos Compactor — exactly ONE replica, ever. Compacts/downsamples S3
# blocks in the background and enforces retention (raw/5m/1h resolutions
# below), so a year of history doesn't cost a year of raw-resolution S3
# storage. Not in the query path (Query never talks to this directly).
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: thanos-compactor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
        app.kubernetes.io/part-of: thanos
    spec:
      serviceAccountName: thanos-s3
      # Same root-owned-PVC problem as the Store Gateway above — see there for
      # the full explanation. Without this: mkdir /var/thanos/compact/meta-syncer:
      # permission denied.
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.data | nindent 8 }}
      containers:
        - name: thanos-compactor
          image: {{ .Values.image }}
          envFrom:
            - secretRef:
                name: {{ .Values.global.s3.secretName }}
          args:
            - compact
            - --log.level=info
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/compact
            # Must match the Secret's data key exactly — see Store
            # Gateway's args above for the full explanation.
            - --objstore.config-file=/etc/thanos/object-store.yaml
            - --wait
            - --retention.resolution-raw={{ .Values.retention.raw }}
            - --retention.resolution-5m={{ .Values.retention.fiveMin }}
            - --retention.resolution-1h={{ .Values.retention.oneHour }}
            - --compact.concurrency=1
            - --downsample.concurrency=1
            # flush-all-to-s3.sh run on a cluster that keeps running uploads a
            # head block that the later 2h block overlaps (same replica
            # labels). Without this the compactor halts on the overlap;
            # with it, it merges them (identical samples deduplicated).
            - --compact.enable-vertical-compaction
          ports:
            - containerPort: 10902
              name: http-metrics
          volumeMounts:
            - name: objstore-config
              mountPath: /etc/thanos
              readOnly: true
            - name: compact-data
              mountPath: /var/thanos/compact
          resources:
            {{- toYaml .Values.compactor.resources | nindent 12 }}
      volumes:
        - name: objstore-config
          secret:
            secretName: thanos-objstore-secret
  volumeClaimTemplates:
    - metadata:
        name: compact-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.compactor.storageSize }}
---
# =============================================================================
# Self-observability — scrape Thanos's own /metrics. Matches
# charts/monitoring/templates/spark-service-monitor.yaml's "release" label
# convention; costs nothing extra since Prometheus is already running.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: thanos
  namespace: default
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: thanos
  podMetricsEndpoints:
    - port: http-query
      path: /metrics
      interval: 30s
    - port: http-metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - default
{{- end }}
