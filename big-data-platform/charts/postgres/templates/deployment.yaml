# ------------------------------------------------------------------------------
# PostgreSQL - Deployment
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Primary relational database for platform metadata (Airflow, Hive, etc.)
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: -2
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    # Deploy Postgres before the airflow-db-migrate hook (wave -1) so that
    # the migrate job's init container can reach Postgres immediately.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.global.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.global.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.global.postgres.database | quote }}
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.global.postgres.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.global.postgres.user | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: postgres-data-pvc
        - name: init-scripts
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
