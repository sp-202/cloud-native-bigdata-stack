# ------------------------------------------------------------------------------
# JupyterHub - Deployment
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Multi-user notebook environment with interactive Spark support.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  labels:
    app: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: jupyterhub
  template:
    metadata:
      labels:
        app: jupyterhub
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      serviceAccountName: jupyterhub
      # No wait-for-minio init container — real S3 doesn't need a
      # readiness wait the way the in-cluster MinIO pod did.
      containers:
        - name: jupyterhub
          image: {{ .Values.global.jupyterhubImage }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: web
          env:
            - name: SPARK_REMOTE
              value: {{ .Values.sparkRemote | quote }}
            - name: PYSPARK_PYTHON
              value: "python3"
            # No AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/S3 endpoint — the
            # node's IAM role provides S3 credentials via boto3/Hadoop's
            # default credential chain.
            - name: LAKEHOUSE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: lakehouse-s3
                  key: bucket
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: JUPYTER_TOKEN
              value: ""
            - name: GRANT_SUDO
              value: "yes"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: jupyter-config
              mountPath: /etc/jupyter/jupyter_notebook_config.py
              subPath: jupyter_notebook_config.py
            - name: notebooks
              mountPath: /home/jovyan/work
            - name: startup-script
              mountPath: /usr/local/bin/before-notebook.d/setup-kernels.sh
              subPath: setup-kernels.sh
      volumes:
        - name: jupyter-config
          configMap:
            name: jupyterhub-config
        - name: notebooks
          emptyDir: {}
        - name: startup-script
          configMap:
            name: jupyterhub-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: jupyterhub
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
      name: web
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jupyterhub-spark
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: jupyterhub
    namespace: default
