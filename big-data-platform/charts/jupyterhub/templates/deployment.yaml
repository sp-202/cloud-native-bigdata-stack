# ------------------------------------------------------------------------------
# JupyterHub - Deployment
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Multi-user notebook environment with interactive Spark support.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  labels:
    app: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: jupyterhub
  template:
    metadata:
      labels:
        app: jupyterhub
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      serviceAccountName: jupyterhub
      initContainers:
        - name: wait-for-minio
          image: curlimages/curl:latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              until curl -sf {{ .Values.global.s3.endpoint }}/minio/health/live; do
                echo "MinIO not ready, retrying in 3s..."
                sleep 3
              done
              echo "MinIO is ready"
      containers:
        - name: jupyterhub
          image: {{ .Values.global.jupyterhubImage }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: web
          env:
            - name: SPARK_REMOTE
              value: {{ .Values.sparkRemote | quote }}
            - name: PYSPARK_PYTHON
              value: "python3"
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.global.s3.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.global.s3.secretKey | quote }}
            - name: JUPYTER_S3_ENDPOINT
              value: {{ .Values.global.s3.endpoint | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.global.s3.endpoint | quote }}
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: JUPYTER_TOKEN
              value: ""
            - name: GRANT_SUDO
              value: "yes"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: jupyter-config
              mountPath: /etc/jupyter/jupyter_notebook_config.py
              subPath: jupyter_notebook_config.py
            - name: notebooks
              mountPath: /home/jovyan/work
            - name: startup-script
              mountPath: /usr/local/bin/before-notebook.d/setup-kernels.sh
              subPath: setup-kernels.sh
      volumes:
        - name: jupyter-config
          configMap:
            name: jupyterhub-config
        - name: notebooks
          emptyDir: {}
        - name: startup-script
          configMap:
            name: jupyterhub-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: jupyterhub
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
      name: web
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jupyterhub-spark
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: jupyterhub
    namespace: default
