# ------------------------------------------------------------------------------
# Redis - Deployment & Service
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: In-memory store for Superset caching and session state.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: -2
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.image }}
          command: ["redis-server"]
          args:
            - "--protected-mode"
            - "no"
            - "--save"
            - "60"
            - "1"
            - "--loglevel"
            - "notice"
            - "--dir"
            - "/data"
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# Headless service for Superset
apiVersion: v1
kind: Service
metadata:
  name: superset-redis-headless
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
