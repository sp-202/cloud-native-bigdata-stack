apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-catalog-server
  labels:
    app: unity-catalog
    component: server
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: unity-catalog
      component: server
  template:
    metadata:
      labels:
        app: unity-catalog
        component: server
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      initContainers:
        - name: init-db
          image: {{ .Values.global.postgres.initImage | default "postgres:13" }}
          command: ['sh', '-c']
          args:
            - |
              until pg_isready -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              PGPASSWORD={{ .Values.global.postgres.password }} psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} -U {{ .Values.global.postgres.user }} -tc "SELECT 1 FROM pg_database WHERE datname = '{{ .Values.db.name }}'" | grep -q 1 || \
              PGPASSWORD={{ .Values.global.postgres.password }} psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} -U {{ .Values.global.postgres.user }} -c "CREATE DATABASE {{ .Values.db.name }}"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      containers:
        - name: unity-catalog-server
          image: {{ .Values.server.image }}
          imagePullPolicy: Always
          command: ["/bin/bash", "/opt/unitycatalog/scripts/entrypoint.sh"]
          ports:
            - containerPort: {{ .Values.server.port }}
              name: http
          env:
            # Dynamic values from Secret (created by bootstrap script from SSM/Terraform)
            - name: UC_STORAGE_ROOT
              valueFrom:
                secretKeyRef:
                  name: unity-catalog-s3
                  key: storage-root
            - name: UC_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: unity-catalog-s3
                  key: region
            # Instance profile credentials (IAM role on EC2 node) — no static keys
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: uc-config
              mountPath: /opt/unitycatalog/etc/conf/server.properties
              subPath: server.properties
            - name: uc-config
              mountPath: /opt/unitycatalog/etc/conf/hibernate.properties
              subPath: hibernate.properties
            - name: uc-entrypoint
              mountPath: /opt/unitycatalog/scripts/entrypoint.sh
              subPath: entrypoint.sh
          livenessProbe:
            httpGet:
              path: /api/2.1/unity-catalog/catalogs
              port: {{ .Values.server.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/2.1/unity-catalog/catalogs
              port: {{ .Values.server.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: uc-config
          configMap:
            name: unity-catalog-config
        - name: uc-entrypoint
          configMap:
            name: unity-catalog-config
            defaultMode: 0755
            items:
              - key: entrypoint.sh
                path: entrypoint.sh
---
apiVersion: v1
kind: Service
metadata:
  name: unity-catalog-server
  labels:
    app: unity-catalog
    component: server
spec:
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
  selector:
    app: unity-catalog
    component: server
  type: ClusterIP
