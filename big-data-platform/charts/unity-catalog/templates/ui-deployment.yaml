apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-catalog-ui
  labels:
    app: unity-catalog
    component: ui
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: unity-catalog
      component: ui
  template:
    metadata:
      labels:
        app: unity-catalog
        component: ui
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      containers:
        - name: unity-catalog-ui
          image: {{ .Values.ui.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.ui.port }}
              name: http
          env:
            - name: UC_SERVER_URL
              value: "http://unity-catalog-server:{{ .Values.server.port }}"
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unity-catalog-ui
  labels:
    app: unity-catalog
    component: ui
spec:
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: {{ .Values.ui.port }}
  selector:
    app: unity-catalog
    component: ui
  type: ClusterIP
