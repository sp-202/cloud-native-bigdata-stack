{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: cloudflare-tunnel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.yaml: |
    tunnel: 91e5be1d-3b51-4cac-aebf-d330aafda394
    credentials-file: /etc/cloudflared/creds/credentials.json
    protocol: quic
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: airflow.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: superset.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: jupyterhub.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: spark.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: spark-history.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: prometheus.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: gravitino.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: grafana.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: headlamp.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: traefik.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: hubble.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: dashboard.dailyblogstudio.com
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: argocd.dailyblogstudio.com
        service: http://traefik.kube-system.svc.cluster.local:80
      # Spark Connect — gRPC (HTTP/2 prior-knowledge cleartext).
      # h2c:// is the only valid scheme for gRPC servers: they speak HTTP/2
      # immediately without any HTTP/1.1 upgrade handshake. Cloudflare
      # terminates TLS at the edge; gRPC toggle must be ON in the Cloudflare
      # dashboard (Network tab). Note: Cloudflare gRPC toggle + Tunnel has a
      # known "Stream removed" issue — use kubectl port-forward for local dev
      # until Cloudflare resolves tunnel+gRPC compatibility.
      - hostname: spark-connect.dailyblogstudio.com
        service: h2c://spark-connect-server-driver-svc.default.svc.cluster.local:15002
      # Catch-all rule (required by cloudflared)
      - service: http_status:404
{{- end }}
