apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-scripts
  namespace: {{ .Release.Namespace }}
data:
  create-buckets.sh: |
    #!/bin/bash
    echo "Waiting for MinIO..."
    until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do
      echo "MinIO not ready, retrying in 2s..."
      sleep 2
    done

    /usr/bin/mc mb myminio/warehouse || true
    /usr/bin/mc mb myminio/data || true
    /usr/bin/mc mb myminio/dags || true
    /usr/bin/mc mb myminio/notebooks || true
    /usr/bin/mc mb myminio/test-bucket || true
    /usr/bin/mc mb myminio/taxi-data || true
    /usr/bin/mc mb myminio/spark-logs || true

    /usr/bin/mc policy set public myminio/warehouse || true
    /usr/bin/mc policy set public myminio/data || true
    /usr/bin/mc policy set public myminio/dags || true
    /usr/bin/mc policy set public myminio/notebooks || true
    /usr/bin/mc policy set public myminio/test-bucket || true
    /usr/bin/mc policy set public myminio/taxi-data || true
    /usr/bin/mc policy set public myminio/spark-logs || true

    echo "Creating spark-events directory..."
    /usr/bin/mc pipe myminio/spark-logs/spark-events/.keep < /dev/null || true
    echo "Buckets created."
    exit 0
