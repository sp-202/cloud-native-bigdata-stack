# ------------------------------------------------------------------------------
# Gravitino - Deployment
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Apache Gravitino 1.2.0 metadata lake server.
#   - Port 8090: Main REST API (metalake, catalog, schema, table management)
#   - Port 9001: Iceberg REST Catalog (IRC) — consumed by Spark & StarRocks
#
# Init containers:
#   1. wait-for-postgres — ensures Postgres is accepting connections
#   2. init-config       — copies image conf into emptyDir, overlays ConfigMap
#   3. init-databases    — creates 'gravitino' and 'iceberg_catalog' DBs, applies schema
#
# Managed via ArgoCD Sync Wave: -1 (after infra-core, before applications)
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitino
  labels:
    app: gravitino
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: gravitino
  template:
    metadata:
      labels:
        app: gravitino
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.gp | nindent 8 }}
      initContainers:
        # Step 1: Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: "postgres:13"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} -U {{ .Values.global.postgres.user }}; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
              echo "PostgreSQL is ready."
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

        # Step 2: Populate writable conf dir from image defaults + ConfigMap override.
        # /root/gravitino/conf is an emptyDir — the image conf files won't exist
        # until this init container copies them in. We then overwrite gravitino.conf
        # with our ConfigMap so rewrite_gravitino_server_config.py (which calls
        # os.remove on the file) works on a real writable file, not a bind-mount.
        - name: init-config
          image: {{ .Values.image }}
          command:
            - sh
            - -c
            - |
              cp -a /root/gravitino/conf/. /conf-rw/
              cp /tmp/gravitino-config/gravitino.conf /conf-rw/gravitino.conf
              cp /root/gravitino/scripts/postgresql/schema-1.2.0-postgresql.sql /schema/gravitino-schema.sql
          volumeMounts:
            - name: gravitino-config
              mountPath: /tmp/gravitino-config/gravitino.conf
              subPath: gravitino.conf
            - name: gravitino-conf-rw
              mountPath: /conf-rw
            - name: gravitino-schema-sql
              mountPath: /schema
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

        # Step 3: Create Gravitino and Iceberg catalog databases, then apply Gravitino schema
        - name: init-databases
          image: "postgres:13"
          command:
            - sh
            - -c
            - |
              export PGPASSWORD="{{ .Values.db.password }}"
              # Create Gravitino entity store DB
              psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} -U {{ .Values.db.user }} \
                -tc "SELECT 1 FROM pg_database WHERE datname = '{{ .Values.db.name }}'" \
                | grep -q 1 || psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} \
                -U {{ .Values.db.user }} -c "CREATE DATABASE {{ .Values.db.name }}"
              # Apply Gravitino schema if tables don't exist (schema-1.2.0 uses CREATE TABLE IF NOT EXISTS)
              TABLE_EXISTS=$(psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} \
                -U {{ .Values.db.user }} -d {{ .Values.db.name }} -tAc \
                "SELECT to_regclass('public.metalake_meta')" 2>/dev/null)
              if [ -z "$TABLE_EXISTS" ]; then
                echo "Applying Gravitino 1.2.0 PostgreSQL schema..."
                psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} \
                  -U {{ .Values.db.user }} -d {{ .Values.db.name }} -f /schema/gravitino-schema.sql
                echo "Gravitino schema applied."
              else
                echo "Gravitino schema already exists, skipping."
              fi
              # Create Iceberg catalog JDBC DB
              export PGPASSWORD="{{ .Values.icebergCatalog.db.password }}"
              psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} -U {{ .Values.icebergCatalog.db.user }} \
                -tc "SELECT 1 FROM pg_database WHERE datname = '{{ .Values.icebergCatalog.db.name }}'" \
                | grep -q 1 || psql -h {{ .Values.global.postgres.host }} -p {{ .Values.global.postgres.port }} \
                -U {{ .Values.icebergCatalog.db.user }} -c "CREATE DATABASE {{ .Values.icebergCatalog.db.name }}"
              echo "Database initialization complete."
          volumeMounts:
            - name: gravitino-schema-sql
              mountPath: /schema
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

      containers:
        - name: gravitino
          image: {{ .Values.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
              name: api
            - containerPort: 9001
              name: iceberg-rest
          readinessProbe:
            httpGet:
              path: /api/version
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/version
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          # rewrite_gravitino_server_config.py runs before the JVM in 3 phases:
          #   1. Reads gravitino.conf
          #   2. Overwrites specific keys with hardcoded init_config defaults
          #      (H2 entity store, catalog-backend=memory, warehouse=/tmp/)
          #   3. Applies container env vars — these WIN and cannot be overwritten
          # All critical settings must be set as env vars so phase 3 wins.
          # Do NOT add GRAVITINO_ICEBERG_REST_CATALOG_BACKEND here — that is the
          # static-mode key and would conflict with dynamic-config-provider.
          env:
            # Entity store — override H2 defaults with PostgreSQL (phase 3 win)
            - name: GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_URL
              value: "jdbc:postgresql://{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/{{ .Values.db.name }}"
            - name: GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_DRIVER
              value: "org.postgresql.Driver"
            - name: GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_USER
              value: "{{ .Values.db.user }}"
            - name: GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_PASSWORD
              value: "{{ .Values.db.password }}"
            # Iceberg REST — dynamic-config-provider (phase 3 win over script defaults)
            # These 3 vars ensure dynamic mode survives rewrite_gravitino_server_config.py
            - name: GRAVITINO_ICEBERG_REST_CATALOG_CONFIG_PROVIDER
              value: "dynamic-config-provider"
            - name: GRAVITINO_ICEBERG_REST_GRAVITINO_URI
              value: "http://localhost:8090"
            - name: GRAVITINO_ICEBERG_REST_GRAVITINO_METALAKE
              value: "enterprise_metalake"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: gravitino-conf-rw
              mountPath: /root/gravitino/conf
      volumes:
        - name: gravitino-config
          configMap:
            name: gravitino-config
        - name: gravitino-conf-rw
          emptyDir: {}
        - name: gravitino-schema-sql
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gravitino
  labels:
    app: gravitino
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ports:
    - name: api
      port: 8090
      targetPort: 8090
    - name: iceberg-rest
      port: 9001
      targetPort: 9001
  selector:
    app: gravitino
  type: ClusterIP
