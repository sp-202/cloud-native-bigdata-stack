# ------------------------------------------------------------------------------
# Spark Connect Server - Deployment
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Shared Spark gateway allowing thin clients to connect via gRPC.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-connect-server
  labels:
    app: spark-connect-server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: spark-connect-server
  template:
    metadata:
      labels:
        app: spark-connect-server
        spark-role: driver
        monitoring: "true"
    spec:
      serviceAccountName: spark-operator-spark
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.spark | nindent 8 }}
      containers:
        - name: spark-connect-server
          image: {{ .Values.global.sparkImage }}
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              /opt/spark/bin/spark-submit \
              --master k8s://https://kubernetes.default.svc.cluster.local:443 \
              --deploy-mode client \
              --class org.apache.spark.sql.connect.service.SparkConnectServer \
              --conf spark.driver.host=$POD_IP \
              --conf spark.driver.bindAddress=0.0.0.0 \
              --conf spark.dynamicAllocation.enabled=true \
              --conf spark.dynamicAllocation.minExecutors={{ .Values.dynamicAllocation.minExecutors }} \
              --conf spark.dynamicAllocation.maxExecutors={{ .Values.dynamicAllocation.maxExecutors }} \
              --conf spark.kubernetes.container.image={{ .Values.global.sparkImage }} \
              --conf spark.kubernetes.driver.pod.name=$POD_NAME \
              --conf spark.kubernetes.namespace=default \
              --conf spark.sql.connect.port=15002 \
              --conf spark.sql.connect.common.enforce_pyspark_compat=true \
              --conf spark.hadoop.fs.s3a.path.style.access={{ .Values.global.s3.pathStyleAccess }} \
              --conf spark.hadoop.fs.s3a.connection.ssl.enabled={{ .Values.global.s3.sslEnabled }} \
              --conf spark.hadoop.fs.s3a.endpoint={{ .Values.global.s3.endpoint }} \
              --conf spark.hadoop.fs.s3a.access.key={{ .Values.global.s3.accessKey }} \
              --conf spark.hadoop.fs.s3a.secret.key={{ .Values.global.s3.secretKey }} \
              --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
              --conf spark.kryo.registrator=org.apache.sedona.core.serde.SedonaKryoRegistrator \
              --conf spark.sql.extensions=org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
              --conf spark.plugins=org.apache.gravitino.spark.connector.plugin.GravitinoSparkPlugin \
              --conf "spark.sql.gravitino.metalake={{ .Values.global.gravitino.metalake }}" \
              --conf "spark.sql.gravitino.uri={{ .Values.global.gravitino.apiUri }}" \
              --conf spark.sql.gravitino.enableIcebergSupport=true \
              --conf spark.sql.warehouse.dir=s3a://warehouse/iceberg/ \
              --conf spark.kubernetes.executor.podTemplateFile=local:///opt/spark/conf/executor-pod-template.yaml \
              --conf spark.local.dir={{ .Values.executor.localDir }}/spark-local \
              local:///opt/spark/jars/spark-connect_2.13-3.5.8.jar
          ports:
            - containerPort: 15002
              name: spark-connect
            - containerPort: 4040
              name: spark-ui
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.global.s3.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.global.s3.secretKey | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.global.s3.endpoint | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: spark-config-volume
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: spark-log4j-volume
              mountPath: /opt/spark/conf/log4j2.properties
              subPath: log4j2.properties
            - name: executor-pod-template
              mountPath: /opt/spark/conf/executor-pod-template.yaml
              subPath: executor-pod-template.yaml
      volumes:
        - name: spark-config-volume
          configMap:
            name: spark-config
        - name: spark-log4j-volume
          configMap:
            name: spark-config
        - name: executor-pod-template
          configMap:
            name: spark-executor-pod-template
---
apiVersion: v1
kind: Service
metadata:
  name: spark-connect-server-driver-svc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
    - name: spark-connect
      port: 15002
      targetPort: 15002
    - name: spark-ui
      port: 4040
      targetPort: 4040
  selector:
    app: spark-connect-server
    spark-role: driver
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: spark-ui
  labels:
    app: spark-ui
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
    - name: spark-ui
      port: 4040
      protocol: TCP
      targetPort: 4040
  selector:
    app: spark-connect-server
    spark-role: driver
  type: ClusterIP
