apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-executor-pod-template
  labels:
    app: spark
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        monitoring: "true"
    spec:
      # nodeSelectorTerms uses OR logic — executor lands on whichever
      # spark pool (spark-node OR spark-worker) has available capacity.
      # This ensures minExecutors always find a node even if spot is empty.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/spark-node
                    operator: Exists
              - matchExpressions:
                  - key: node-role.kubernetes.io/spark-worker
                    operator: Exists
      # Tolerate spot interruption taint if applied by NTH
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      volumes:
        - name: spark-shuffle
          hostPath:
            path: {{ .Values.executor.hostPath }}
            type: DirectoryOrCreate
      containers:
        - name: spark-kubernetes-executor
          volumeMounts:
            - name: spark-shuffle
              mountPath: {{ .Values.executor.localDir }}
