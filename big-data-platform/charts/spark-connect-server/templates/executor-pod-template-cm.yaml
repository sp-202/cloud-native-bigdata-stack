apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-executor-pod-template
  labels:
    app: spark
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        monitoring: "true"
    spec:
      # Single Spark tier now (Karpenter's spark-node NodePool covers both
      # spot and on-demand capacity under one node-role label — no more
      # separate spark-critical/spark-worker pools to OR between).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/spark-node
                    operator: Exists
      tolerations:
        # Tolerate spot interruption taint if applied by NTH
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        # spark-node's NodePool taint (terraform-aws-k8s-ha/karpenter-k8s.tf)
        # — without this, executors couldn't schedule there at all despite
        # matching the nodeAffinity above.
        - key: "spark-only"
          value: "true"
          effect: "NoSchedule"
          operator: "Equal"
      volumes:
        - name: spark-shuffle
          hostPath:
            path: {{ .Values.executor.hostPath }}
            type: DirectoryOrCreate
      containers:
        - name: spark-kubernetes-executor
          volumeMounts:
            - name: spark-shuffle
              mountPath: {{ .Values.executor.localDir }}
