apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-executor-pod-template
  labels:
    app: spark
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        monitoring: "true"
    spec:
      # No node pinning: all nodes are identical. global.nodeSelector.spark
      # applies if nodes are ever labeled for Spark.
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector.spark | nindent 8 }}
      tolerations:
        # Move executors off a dead node quickly instead of the default 300s.
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      volumes:
        - name: spark-shuffle
          hostPath:
            path: {{ .Values.executor.hostPath }}
            type: DirectoryOrCreate
      containers:
        - name: spark-kubernetes-executor
          # SeaweedFS credentials for S3A.
          envFrom:
            - secretRef:
                name: {{ .Values.global.s3.secretName }}
          volumeMounts:
            - name: spark-shuffle
              mountPath: {{ .Values.executor.localDir }}
