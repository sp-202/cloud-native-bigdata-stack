{{- if .Values.enabled }}
# ------------------------------------------------------------------------------
# Spark Connect Server - RBAC
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: ServiceAccount and RoleBinding for Spark to spawn executor pods.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-secrets-extension
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-secrets-extension-binding
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
- kind: ServiceAccount
  name: spark-operator-spark
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: spark-secrets-extension
  apiGroup: rbac.authorization.k8s.io
{{- end }}
