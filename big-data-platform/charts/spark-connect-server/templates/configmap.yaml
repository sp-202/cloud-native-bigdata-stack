# ------------------------------------------------------------------------------
# Spark Connect Server - Configuration
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Environment variables and Spark configuration for the Connect server.
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  labels:
    app: spark
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  spark-defaults.conf: |
    # =============================================================================
    # Spark Configuration (Kubernetes)
    # =============================================================================

    # --- Application & Naming ---
    spark.app.name                   spark-bigdata
    spark.kubernetes.executor.podNamePrefix spark-executor

    # --- Master & Deployment ---
    spark.master                     k8s://https://kubernetes.default.svc
    spark.submit.deployMode          client
    spark.kubernetes.namespace       default
    spark.kubernetes.container.image {{ .Values.global.sparkImage }}
    spark.kubernetes.authenticate.driver.serviceAccountName spark-operator-spark

    # --- Serialization (Sedona + Kryo) ---
    spark.serializer                 org.apache.spark.serializer.KryoSerializer
    spark.kryo.registrator           org.apache.sedona.core.serde.SedonaKryoRegistrator

    # --- SQL & ANSI Mode ---
    spark.sql.ansi.enabled           false

    # --- Dynamic Resource Allocation ---
    spark.dynamicAllocation.enabled              true
    spark.dynamicAllocation.shuffleTracking.enabled true
    spark.dynamicAllocation.minExecutors         {{ .Values.dynamicAllocation.minExecutors }}
    spark.dynamicAllocation.maxExecutors         {{ .Values.dynamicAllocation.maxExecutors }}
    spark.dynamicAllocation.executorIdleTimeout  600
    spark.dynamicAllocation.schedulerBacklogTimeout 5

    # --- Networking & Timeouts ---
    spark.network.timeout            120
    spark.files.fetchTimeout         60
    spark.executor.heartbeatInterval 10
    spark.rpc.askTimeout             120

    # --- Hadoop S3A Configuration ---
    spark.hadoop.fs.s3a.threads.keepalivetime    60
    spark.hadoop.fs.s3a.connection.timeout       200
    spark.hadoop.fs.s3a.connection.establish.timeout 30
    spark.hadoop.fs.s3a.connection.acquisition.timeout 60
    spark.hadoop.fs.s3a.connection.idle.time     60
    spark.hadoop.fs.s3a.connection.request.timeout 60
    spark.hadoop.fs.s3a.connection.ttl           300
    spark.hadoop.fs.s3a.multipart.purge.age      86400
    spark.hadoop.fs.s3a.paging.maximum           5000

    # --- Executor & Driver Resources ---
    # Executor: 2 vCPU / 4g memory — small footprint so more executors
    # can run in parallel across both spark-critical and spark-spot pools.
    # With minExecutors=2 and maxExecutors=8 across two pools, the platform
    # always has warm executors ready for JupyterHub and Airflow Spark jobs.
    spark.executor.cores             2
    spark.executor.memory            4g
    spark.executor.memoryOverhead    1g
    spark.driver.cores               2
    spark.driver.memory              4g
    spark.driver.memoryOverhead      2g
    spark.kubernetes.executor.request.cores 2
    spark.kubernetes.executor.limit.cores   2

    # --- Metrics & Monitoring ---
    spark.ui.prometheus.enabled                       true
    spark.metrics.namespace                           spark
    spark.metrics.conf.*.sink.prometheusServlet.class org.apache.spark.metrics.sink.PrometheusServlet
    spark.metrics.conf.*.sink.prometheusServlet.path  /metrics/prometheus
    spark.metrics.conf.*.source.jvm.class             org.apache.spark.metrics.source.JvmSource
    spark.metrics.conf.*.source.jvm.unit              milliseconds
    spark.metrics.conf.executor.source.jvm.class      org.apache.spark.metrics.source.JvmSource
    spark.metrics.staticSources.enabled               true
    spark.ui.port                                     4040

    # --- SQL Extensions (Sedona + Iceberg) ---
    spark.sql.extensions             org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    # --- Gravitino Spark Plugin — Dynamic Multi-Catalog Discovery ---
    # GravitinoSparkPlugin queries enterprise_metalake at Spark startup and
    # auto-registers ALL catalogs (present and future) without ConfigMap changes.
    # Any catalog created in Gravitino Web UI is immediately available to Spark
    # on the next session without pod restarts or config updates.
    spark.plugins                    org.apache.gravitino.spark.connector.plugin.GravitinoSparkPlugin
    spark.sql.gravitino.metalake     {{ .Values.global.gravitino.metalake }}
    spark.sql.gravitino.uri          {{ .Values.global.gravitino.apiUri }}
    spark.sql.gravitino.enableIcebergSupport true
    spark.sql.warehouse.dir          s3a://warehouse/iceberg/
    # Add this to ConfigMap to make it feel "instant"
    spark.sql.gravitino.metadata.refresh.interval 5000

    # --- S3 / MinIO Configuration ---
    spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.path.style.access    {{ .Values.global.s3.pathStyleAccess }}
    spark.hadoop.fs.s3a.connection.ssl.enabled {{ .Values.global.s3.sslEnabled }}
    spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    spark.hadoop.fs.s3a.fast.upload          true

    # --- Networking & UI ---
    spark.ui.bindHost                        0.0.0.0
    spark.ui.port                            4040
    spark.driver.bindAddress                 0.0.0.0

    # --- Local NVMe Shuffle Storage ---
    # Executors land on spark-node/spark-worker which have NVMe at /mnt/spark-nvme.
    # Terraform pre-creates /mnt/spark-nvme/spark-shuffle on those nodes.
    # hostPath volume in executor-pod-template mounts it into the container.
    spark.local.dir                          {{ .Values.executor.localDir }}

    # --- Performance Tuning ---
    spark.sql.shuffle.partitions             200
    spark.sql.adaptive.enabled               true

    # --- Event Logging (Spark History Server reads from spark-logs/spark-events) ---
    spark.eventLog.enabled                   true
    spark.eventLog.dir                       s3a://spark-logs/spark-events/

  log4j2.properties: |
    # =============================================================================
    # Log4j2 Configuration — Spark Driver & Executors
    # =============================================================================
    # Console and file appenders with JSON formatting for structured logging.
    # All output goes to stdout/stderr for container-native log collection.

    status = warn

    # =============================================================================
    # Appenders
    # =============================================================================
    appender.console.type = Console
    appender.console.name = ConsoleAppender
    appender.console.target = SYSTEM_OUT
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{ISO8601} [%t] %-5p %c - %m%n

    # =============================================================================
    # Loggers
    # =============================================================================
    # Root logger — all logs at WARN level and above
    rootLogger.level = warn
    rootLogger.appenderRefs = stdout
    rootLogger.appenderRef.stdout.ref = ConsoleAppender

    # Spark — INFO level for general operations
    logger.spark.name = org.apache.spark
    logger.spark.level = info
    logger.spark.appenderRefs = stdout
    logger.spark.appenderRef.stdout.ref = ConsoleAppender

    # Hadoop — WARN level (reduce noise from Hadoop internals)
    logger.hadoop.name = org.apache.hadoop
    logger.hadoop.level = warn

    # Iceberg — INFO level for catalog operations
    logger.iceberg.name = org.apache.iceberg
    logger.iceberg.level = info

    # Gravitino — INFO level for plugin catalog discovery
    logger.gravitino.name = org.apache.gravitino
    logger.gravitino.level = info

    # Sedona — INFO level for geospatial operations
    logger.sedona.name = org.apache.sedona
    logger.sedona.level = info
