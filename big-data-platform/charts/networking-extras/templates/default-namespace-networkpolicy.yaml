# ------------------------------------------------------------------------------
# NetworkPolicy - default namespace boundary (opt-in)
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Coarse ingress boundary for `default` (where the whole umbrella release
# lives): allows traffic from pods in `default`, from kube-system (Traefik,
# Alloy's Service traffic, CoreDNS), and from the nodes themselves. Blocks
# other namespaces. NOT a default-deny-all — intra-namespace traffic stays
# unrestricted.
#
# Off by default (networking-extras.networkPolicy.enabled). Enforced by Canal's
# Calico policy engine. The node rule is what main needed Cilium entities
# for: the kube-apiserver (calling CNPG/prometheus-operator/cert-manager
# webhooks, metrics-server's APIService) and hostNetwork Alloy (pushing to
# Loki/Prometheus) are not pods in any namespace — their packets come from a
# node IP on the local node, or from the remote node's flannel VXLAN address
# (the .0 of that node's pod CIDR slice) across nodes. So both the nodes' LAN
# subnet(s) and the pod CIDR's per-node tunnel addresses must be allowed, or
# webhooks time out and ArgoCD syncs stall.
#
# Managed via ArgoCD Sync Wave: 0
# ------------------------------------------------------------------------------
{{- if and .Values.enabled (.Values.networkPolicy).enabled }}
{{- if not .Values.networkPolicy.nodeCIDRs }}
{{- fail "networking-extras.networkPolicy.nodeCIDRs must list the nodes' subnet(s) when networkPolicy.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-namespace-boundary
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Everything already in `default` (Airflow<->Postgres, Spark<->Gravitino, ...).
    - from:
        - podSelector: {}
    # Traefik and the other kube-system agents.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Nodes: kube-apiserver, kubelet probes, hostNetwork Alloy.
    - from:
        {{- range .Values.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        # flannel.1 addresses (<pod-cidr-slice>.0/32 per node), the source of
        # host-originated traffic arriving over VXLAN. A /16 of pod IPs would
        # also admit every pod in every namespace, so only the .0 of each /24
        # slice is listed (RKE2 default node-cidr-mask-size 24).
        {{- $parts := splitList "." (index (splitList "/" .Values.networkPolicy.podCIDR) 0) }}
        {{- range $i := until 256 }}
        - ipBlock:
            cidr: {{ index $parts 0 }}.{{ index $parts 1 }}.{{ $i }}.0/32
        {{- end }}
{{- end }}
