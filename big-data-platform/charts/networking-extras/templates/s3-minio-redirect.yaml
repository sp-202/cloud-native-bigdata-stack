{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: s3-redirect
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ExternalName
  externalName: minio.default.svc.cluster.local
  ports:
  - port: 443
    targetPort: 9000
    protocol: TCP
    name: https
{{- end }}
