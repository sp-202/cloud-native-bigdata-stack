# ------------------------------------------------------------------------------
# Persistence - Volumes & Storage
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: PVCs for workloads that don't own a StatefulSet
# volumeClaimTemplate. Dynamically provisioned on global.storageClassName
# (`local-storage`, OpenEBS local PV — see rke2/README.md),
# WaitForFirstConsumer: the volume is created on whichever node the pod first
# schedules to, and the pod stays on that node.
#
# On main these were static local PVs pinned by node-role labels (Redis,
# StarRocks) plus an RWX EFS PVC for Airflow DAGs. StarRocks now gets its
# volumes from the kube-starrocks chart's own storageSpec, and the DAGs come
# from the Airflow chart's git-sync, so only Redis is left.
#
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: -3
# ------------------------------------------------------------------------------

{{- if .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.redis.size }}
{{- end }}
