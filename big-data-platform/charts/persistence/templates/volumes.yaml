{{- $storageClass := .Values.global.storageClassName }}
# =============================================================================
# PostgreSQL PV/PVC
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: {{ .Values.postgres.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $storageClass }}
  volumeMode: Filesystem
  local:
    path: {{ .Values.postgres.localPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ (keys .Values.postgres.nodeSelector | first) }}
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.size }}
  volumeName: postgres-data-pv

