# ------------------------------------------------------------------------------
# Persistence - Volumes & Storage
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Definitions for PVs, PVCs, and local storage paths (OpenEBS).
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: -3
# ------------------------------------------------------------------------------

{{- $storageClass := .Values.global.storageClassName }}
# Postgres, Airflow DAGs, and Airflow scheduler/triggerer logs no longer get
# static local-hostpath PV/PVCs here — they're dynamically provisioned now:
#   - Postgres: CNPG Cluster volumeClaimTemplates on ebs-gp3 (see charts/postgres)
#   - Airflow DAGs: efs-airflow-dags StorageClass, PVC below (ReadWriteMany —
#     git-sync/scheduler/triggerer/webserver mount it concurrently, possibly
#     from different GP nodes; EBS is ReadWriteOnce-only and can't do that)
#   - Airflow scheduler/triggerer logs: ebs-gp3 via airflow.logs.persistence
#     (single-writer StatefulSet volumeClaimTemplate, EBS is fine)
# NOTE: redis/starrocks below still use local-hostpath and have the same
# theoretical durability exposure — not fixed here, worth a follow-up if they
# ever show the same "reset after reschedule" symptom Postgres had.
# MinIO's PV/PVC (and the dedicated MinIO node) are gone — replaced by S3.
# =============================================================================
# Airflow DAGs PVC — dynamically provisioned on efs-airflow-dags (RWX).
# No static PV: EFS CSI's efs-ap provisioning mode creates an Access Point
# per PVC automatically. Name matches airflow.dags.persistence.existingClaim.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-dags-shared-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-airflow-dags
  resources:
    requests:
      storage: {{ .Values.airflow.size }}

---
# Airflow scheduler/triggerer logs no longer need static local PVs here —
# airflow.logs.persistence.storageClassName is ebs-gp3, so the official
# chart's own StatefulSet volumeClaimTemplates (logs-<release>-scheduler-0,
# logs-<release>-triggerer-0) provision dynamically, same as Postgres.

---
# =============================================================================
# StarRocks FE PV/PVC
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: starrocks-fe-pv
  labels:
    app: starrocks-fe
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  capacity:
    storage: {{ .Values.starrocksFe.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $storageClass }}
  volumeMode: Filesystem
  local:
    path: {{ .Values.starrocksFe.localPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ (keys .Values.starrocksFe.nodeSelector | first) }}
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: starrocks-fe-meta-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $storageClass }}
  resources:
    requests:
      storage: {{ .Values.starrocksFe.size }}
  volumeName: starrocks-fe-pv

---
