# ------------------------------------------------------------------------------
# Persistence - Volumes & Storage
# ------------------------------------------------------------------------------
# Part of the Cloud-Native Big Data Platform (Umbrella Chart)
#
# Description: Definitions for PVs, PVCs, and local storage paths (OpenEBS).
# For configuration, see: big-data-platform/values.yaml
#
# Managed via ArgoCD Sync Wave: -3
# ------------------------------------------------------------------------------

{{- $storageClass := .Values.global.storageClassName }}
# =============================================================================
# PostgreSQL PV/PVC
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pv
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  capacity:
    storage: {{ .Values.postgres.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ $storageClass }}
  volumeMode: Filesystem
  local:
    path: {{ .Values.postgres.localPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ (keys .Values.postgres.nodeSelector | first) }}
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.size }}
  volumeName: postgres-data-pv

